name: Install V10.34 editors
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject editor script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="js/v10.34-editors.js?v=134"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s,encoding='utf-8')
          else:
              print('editor script already installed')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'V10.34 — ativar editores robustos de categorias marcas e produtos' || true
          git rm .github/workflows/install-v1034-editors.yml || true
          git commit -m 'V10.34 — remover workflow temporário' || true
          git push