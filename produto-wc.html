<style>
:root{--orange:#f28c00;--dark:#17212b;--muted:#6d7782;--line:#e6eaee;--soft:#f7f8fa}
.product-page{padding:24px 0 60px;background:#fff}.breadcrumb{font-size:13px;color:#7b858f;margin-bottom:18px}.breadcrumb a{color:#56616c;text-decoration:none}.product-shell{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(390px,.92fr);gap:48px;align-items:start}.visual{position:sticky;top:20px}.main-photo{height:540px;border:1px solid var(--line);border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 5px 22px rgba(20,30,40,.04)}.main-photo img{width:100%;height:100%;object-fit:contain;padding:28px}.photo-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#a0a8b0;text-align:center;gap:8px}.photo-placeholder strong{font-size:16px;color:#66717c}.thumbs{display:flex;gap:10px;margin-top:12px;overflow:auto;padding-bottom:3px}.thumb{width:78px;height:78px;flex:0 0 78px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;cursor:pointer}.thumb.active{border:2px solid var(--orange)}.thumb img{width:100%;height:100%;object-fit:contain}.product-info{min-width:0}.brand{font-size:13px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:#e67d00}.title{font-size:42px;line-height:1.08;margin:7px 0 12px;color:#121a22}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.pill{border:1px solid var(--line);background:#fafbfc;border-radius:999px;padding:7px 11px;font-size:12px;color:#59636d}.short-desc{font-size:16px;line-height:1.65;color:#4d5863;margin:0 0 20px}.buy-card{border:1px solid var(--line);border-radius:16px;padding:20px;background:#fff;box-shadow:0 8px 25px rgba(20,30,40,.05)}.promo{display:inline-flex;background:#fff1e2;color:#c25c00;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;margin-bottom:8px}.price-old{font-size:16px;color:#8b939b;text-decoration:line-through}.price{font-size:34px;font-weight:900;color:#111820;line-height:1.2}.consult{font-size:23px;font-weight:900;color:#17212b}.variant-title{font-weight:900;font-size:14px;margin:20px 0 9px}.variant-grid{display:flex;gap:9px;flex-wrap:wrap}.variant-btn{border:1px solid #cfd6dc;background:#fff;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;min-width:76px}.variant-btn:hover,.variant-btn.active{border-color:var(--orange);box-shadow:0 0 0 2px rgba(242,140,0,.13)}.variant-price{display:block;font-size:11px;font-weight:600;color:#78818a;margin-top:3px}.buy-row{display:flex;gap:10px;margin-top:18px}.quantity{width:90px;text-align:center}.add-btn{flex:1;border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:900;padding:13px 18px;cursor:pointer;font-size:14px}.add-btn:hover{filter:brightness(.96)}.stock{font-size:12px;margin-top:10px;color:#66717c}.details{margin-top:38px}.detail-block{border-top:1px solid var(--line);padding:28px 0}.detail-block h2{font-size:24px;margin:0 0 15px;color:#151d25}.description{font-size:15px;line-height:1.75;color:#4b5660}.tech-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tech-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fafbfc;font-size:14px;color:#3f4a54}.docs-grid{display:flex;flex-wrap:wrap;gap:10px}.doc-card{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:12px 14px;text-decoration:none;color:#222;background:#fff;font-weight:800}.doc-icon{width:34px;height:34px;border-radius:8px;background:#fff1e2;display:grid;place-items:center;color:#d36b00}.related{border-top:1px solid var(--line);padding-top:30px;margin-top:8px}.related-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:16px}.related-head h2{margin:0;font-size:25px}.related-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.rel-card{border:1px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:inherit;background:#fff;transition:.15s}.rel-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,30,40,.08)}.rel-img{height:170px;border-radius:10px;background:#fafbfc;display:flex;align-items:center;justify-content:center;margin-bottom:12px}.rel-img img{width:100%;height:100%;object-fit:contain;padding:12px}.rel-brand{font-size:10px;text-transform:uppercase;font-weight:900;color:#d87500;letter-spacing:.06em}.rel-name{font-weight:900;margin:4px 0 7px;line-height:1.25}.rel-price{font-size:13px;color:#505b65}.empty{color:#7a848d;font-size:14px;padding:15px 0}.toast{position:fixed;right:20px;bottom:20px;background:#17212b;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:0 10px 30px #0003;z-index:99;display:none;font-weight:700}.toast.show{display:block}
@media(max-width:900px){.product-shell{grid-template-columns:1fr;gap:24px}.visual{position:static}.main-photo{height:420px}.title{font-size:34px}.related-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.product-page{padding-top:15px}.main-photo{height:330px}.main-photo img{padding:18px}.title{font-size:29px}.buy-card{padding:16px}.buy-row{flex-direction:column}.quantity{width:100%}.tech-grid{grid-template-columns:1fr}.related-grid{grid-template-columns:1fr 1fr}.rel-img{height:130px}.related-head{display:block}}
</style>
<style id="MM_SoudalLocalV2">.mm-color-grid{display:flex;flex-wrap:wrap;gap:8px}.mm-color-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid #cfd6dc;background:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.mm-color-btn.active{border-color:#f28c00;box-shadow:0 0 0 2px rgba(242,140,0,.13)}.mm-color-dot{width:22px;height:22px;border-radius:50%;border:1px solid #c6ccd1;display:inline-block;box-shadow:inset 0 0 0 2px #fff}</style><style id="MM_TrexPower290CSS">
.mm-trex-colors{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}.mm-trex-color{display:flex;align-items:center;gap:8px;border:1px solid #d6dbe0;background:#fff;border-radius:10px;padding:8px 11px;font-weight:800;cursor:pointer}.mm-trex-color.active{border-color:#f28c00;box-shadow:0 0 0 2px rgba(242,140,0,.14)}.mm-trex-dot{width:24px;height:24px;border-radius:50%;border:1px solid #c7ccd1;box-shadow:inset 0 0 0 2px #fff;flex:none}.mm-trex-pack-hidden{display:none!important}
</style><style id="MM_TrexPowerFinalCSS">.mm-trex-colors{display:flex;flex-wrap:wrap;gap:8px}.mm-trex-color{display:flex;align-items:center;gap:8px;border:1px solid #d6dbe0;background:#fff;border-radius:10px;padding:8px 11px;font-weight:800;cursor:pointer}.mm-trex-color.active{border:2px solid #f28c00;box-shadow:0 0 0 3px rgba(242,140,0,.12)}.mm-trex-dot{width:24px;height:24px;border-radius:50%;border:1px solid #c7ccd1;box-shadow:inset 0 0 0 2px #fff}</style></head>
<body>
<header class="header">
<div class="container head-main">
<a href="index.html"><img class="logo" src="assets/marquesmater-logo.svg" alt="MarquesMater"></a>
<form class="search" action="catalogo.html"><input name="q" placeholder="Pesquisar produtos..."><button>⌕</button></form>
<div class="head-actions"><a class="action" href="index.html"><b>⌂</b><span>Início</span></a><a class="action" href="carrinho.html"><b>🛒</b><span>Carrinho</span></a></div>
</div>
<div class="menu"><div class="container"><div id="global-menu"></div></div></div>
</header>
<main class="product-page"><div class="container" id="app"><p>A carregar produto...</p></div></main>
<footer class="footer"><div class="container footgrid"><div><img class="footlogo" src="assets/marquesmater-logo.svg"><p>Materiais de construção, ferramentas, pinturas, jardim e muito mais.</p></div><div><h4>Loja</h4><a href="catalogo.html">Todos os produtos</a><a href="catalogo-rida.html">Máquinas</a></div><div><h4>MarquesMater</h4><a href="empresa.html">Empresa</a><a href="contactos.html">Contactos</a></div></div><div class="container copyright">© 2026 MarquesMater</div></footer>
<div id="toast" class="toast"></div>
<script>
const slug=new URLSearchParams(location.search).get('slug');let P=null,variant=null;
function imgUrl(v){v=String(v||'').trim();if(!v)return '/assets/paint-placeholder.svg';if(v.startsWith('soudal-page:'))return '/api/soudal-image?url='+encodeURIComponent(v.slice(12));if(v.startsWith('/'))return v;if(/^https?:\/\//i.test(v)||v.startsWith('data:'))return v;return '/'+v.replace(/^\.\//,'')}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function money(v){if(v===null||v===undefined||v==='')return '';let s=String(v).trim();let n=Number(s.replace('€','').replace(/\./g,'').replace(',','.'));return Number.isFinite(n)&&n>0?'€ '+n.toFixed(2).replace('.',','):s}
function techList(v){if(!v)return [];if(Array.isArray(v))return v.filter(Boolean);let s=String(v).trim();if(!s||s==='[]'||s==='{}')return [];try{const x=JSON.parse(s);if(Array.isArray(x))return x.filter(Boolean);if(x&&typeof x==='object')return Object.entries(x).map(([k,val])=>`${k}: ${val}`)}catch{}return s.split(/\r?\n|;/).map(x=>x.trim()).filter(Boolean)}
function imageFor(x){return x||'/assets/paint-placeholder.svg'}
function priceFor(v){return v?.price||P.promo_price||P.price||P.price_display||'Preço sob consulta'}
function render(){
 const images=(P.gallery?.length?P.gallery:[P.image].filter(Boolean));
 const safeImages=images.length?images:['/assets/paint-placeholder.svg'];
 variant=P.variants?.[0]||null;
 const current=priceFor(variant);
 const tech=techList(P.tech);
 document.getElementById('app').innerHTML=`
 <div class="breadcrumb"><a href="catalogo.html">Loja</a> / <a href="catalogo.html?cat=${encodeURIComponent(P.family||'')}">${esc(P.family||'Produtos')}</a> / ${esc(P.name)}</div>
 <div class="product-shell">
  <section class="visual">
   <div class="main-photo" id="photoBox"><img id="mainImg" src="${esc(imageFor(safeImages[0]))}" alt="${esc(P.name)}" onerror="this.onerror=null;this.src='/assets/paint-placeholder.svg'"></div>
   <div class="thumbs">${safeImages.map((x,i)=>`<button class="thumb ${i===0?'active':''}" onclick="showImg(${i})"><img src="${esc(imageFor(x))}" alt="" onerror="this.onerror=null;this.src='/assets/paint-placeholder.svg'"></button>`).join('')}</div>
  </section>
  <section class="product-info">
   <div class="brand">${esc(P.brand||'MarquesMater')}</div>
   <h1 class="title">${esc(P.name)}</h1>
   <div class="meta">${P.sku?`<span class="pill">Ref. ${esc(P.sku)}</span>`:''}${P.family?`<span class="pill">${esc(P.family)}</span>`:''}${P.subfamily?`<span class="pill">${esc(P.subfamily)}</span>`:''}</div>
   ${P.description?`<p class="short-desc">${esc(P.description)}</p>`:''}
   <div class="buy-card">
    ${P.promo_price&&!P.variants?.length?'<span class="promo">EM PROMOÇÃO</span>':''}
    <div id="priceBox">${P.promo_price&&!P.variants?.length?`<div class="price-old">${money(P.price)}</div><div class="price">${money(P.promo_price)}</div>`:(current&&String(current).toLowerCase().includes('sob consulta')||current==='Preço por variante'?'<div class="consult">Preço sob consulta</div>':`<div class="price">${money(current)}</div>`)}</div>
    ${P.variants?.length?`<div class="variant-title">Escolha a embalagem</div><div class="variant-grid">${P.variants.map((v,i)=>`<button class="variant-btn ${i===0?'active':''}" onclick="selectVariant(${i})">${esc(v.name)}${v.price?`<span class="variant-price">${money(v.price)}</span>`:'<span class="variant-price">Consultar preço</span>'}</button>`).join('')}</div>`:''}
    <div class="buy-row"><input id="qty" class="input quantity" type="number" min="1" value="1"><button class="add-btn" onclick="addCart()">ADICIONAR AO CARRINHO</button></div>
    <div class="stock">${P.stock>0?'✓ Em stock':'Disponibilidade e preço sujeitos a confirmação'}</div>
   </div>
  </section>
 </div>
 <div class="details">
  ${P.description_html?`<section class="detail-block"><h2>Descrição do produto</h2><div class="description">${P.description_html}</div></section>`:''}
  ${tech.length?`<section class="detail-block"><h2>Características técnicas</h2><div class="tech-grid">${tech.map(x=>`<div class="tech-item">${esc(x)}</div>`).join('')}</div></section>`:''}
  ${P.docs?.length?`<section class="detail-block"><h2>Documentação técnica</h2><div class="docs-grid">${P.docs.map(d=>`<a class="doc-card" href="${esc(d.url||'#')}" target="_blank" rel="noopener"><span class="doc-icon">📄</span><span>${esc(d.title||'Documento')}</span></a>`).join('')}</div></section>`:''}
  <section class="related"><div class="related-head"><h2>Também pode interessar-lhe</h2></div><div class="related-grid" id="rel"><div class="empty">A carregar...</div></div></section>
 </div>`;
 loadRelated();
}
function showImg(i){const a=(P.gallery?.length?P.gallery:[P.image].filter(Boolean));const src=imageFor(a[i]);document.getElementById('mainImg').src=src;document.querySelectorAll('.thumb').forEach((b,k)=>b.classList.toggle('active',k===i))}
function selectVariant(i){variant=P.variants[i];document.querySelectorAll('.variant-btn').forEach((b,k)=>b.classList.toggle('active',k===i));const box=document.getElementById('priceBox');const v=variant?.price;if(!v){box.innerHTML='<div class="consult">Preço sob consulta</div>';return}box.innerHTML=`<div class="price">${money(v)}</div>`}
async function loadRelated(){let list=[];if(P.related?.length){for(const s of P.related){try{const r=await fetch('/api/product/slug/'+encodeURIComponent(typeof s==='string'?s:s.slug));if(r.ok)list.push(await r.json())}catch{}}}if(!list.length){try{const r=await fetch('/api/products?category='+encodeURIComponent(P.family||''));const a=await r.json();list=a.filter(x=>x.slug!==P.slug).slice(0,4)}catch{}}document.getElementById('rel').innerHTML=list.map(x=>`<a class="rel-card" href="produto-wc.html?slug=${encodeURIComponent(x.slug)}"><div class="rel-img"><img src="${esc(imageFor(x.gallery?.[0]||x.image))}" alt="${esc(x.name)}" loading="lazy" onerror="this.onerror=null;this.src='/assets/paint-placeholder.svg'"></div><div class="rel-brand">${esc(x.brand||'MarquesMater')}</div><div class="rel-name">${esc(x.name)}</div><div class="rel-price">${esc(x.price_display||x.price||'Preço sob consulta')}</div></a>`).join('')||'<div class="empty">Não existem produtos relacionados definidos.</div>'}
function addCart(){const qty=Math.max(1,Number(document.getElementById('qty').value||1));const item={slug:P.slug,name:P.name,sku:P.sku,variant:variant?.name||'',price:variant?.price||P.promo_price||P.price||P.price_display||'Preço sob consulta',image:P.gallery?.[0]||P.image||'/assets/paint-placeholder.svg',qty};let c=JSON.parse(localStorage.getItem('mm_cart')||'[]');const k=JSON.stringify([item.slug,item.variant,item.price]);const e=c.find(x=>JSON.stringify([x.slug,x.variant,x.price])===k);if(e)e.qty+=qty;else c.push(item);localStorage.setItem('mm_cart',JSON.stringify(c));const t=document.getElementById('toast');t.textContent='Produto adicionado ao carrinho.';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
fetch('/api/product/slug/'+encodeURIComponent(slug||'')).then(r=>r.json()).then(x=>{if(x.error)throw Error('Produto não encontrado');P=x;render()}).catch(()=>document.getElementById('app').innerHTML='<div class="panel"><h2>Produto não encontrado</h2><p>O produto que procuras não está disponível.</p></div>');
</script>
<script src="chat.js?v=20"></script><script src="nav.js?v=20"></script><script id="MM_SoudalMoneyFix">function money(v){if(v===null||v===undefined||v==='')return '';if(typeof v==='number'&&Number.isFinite(v))return '€ '+v.toFixed(2).replace('.',',');let s=String(v).trim();let n=Number(s.replace('€','').replace(/\s/g,'').replace(',','.'));return Number.isFinite(n)&&n>0?'€ '+n.toFixed(2).replace('.',','):s}</script><script id="MM_TrexPowerFinalJS">(function(){let T=null,I=0;const path=v=>'/'+String(v.image||v.asset_image||'').replace(/^\//,'');const bg=c=>{c=(c||'').toLowerCase();if(c.includes('preto'))return '#171717';if(c.includes('cinz'))return '#9da3a8';if(c.includes('bege'))return '#d7c2a2';if(c.includes('terracota'))return '#b65c43';if(c.includes('transpar'))return 'linear-gradient(135deg,#fff,#dfe8ef)';return '#fff'};function apply(){if(!T)return;let b=document.getElementById('priceBox');if(b)b.innerHTML='<div class="price">€ '+Number(T.price||12.95).toFixed(2).replace('.',',')+'</div>';document.querySelector('.stock')?.remove();let t=document.querySelector('.variant-title'),g=document.querySelector('.variant-grid');if(!t||!g)return;t.textContent='Escolha a cor';g.className='mm-trex-colors';g.innerHTML=T.variants.map((v,i)=>'<button type="button" class="mm-trex-color '+(i===I?'active':'')+'" data-i="'+i+'"><span class="mm-trex-dot" style="background:'+bg(v.color)+'"></span>'+v.color+'</button>').join('');g.querySelectorAll('.mm-trex-color').forEach(x=>x.onclick=()=>{I=Number(x.dataset.i);let m=document.getElementById('mainImg');if(m)m.src=path(T.variants[I]);g.querySelectorAll('.mm-trex-color').forEach((z,k)=>z.classList.toggle('active',k===I))});let m=document.getElementById('mainImg');if(m)m.src=path(T.variants[I])}async function boot(){if(!/soudal-t-rex-power-290ml/i.test(new URLSearchParams(location.search).get('slug')||''))return;T=(await fetch('/data/soudal_products.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json())).products.find(x=>x.slug==='soudal-t-rex-power-290ml');if(!T)return;T.price=12.95;let n=0,q=setInterval(()=>{if(document.getElementById('priceBox')&&document.querySelector('.variant-grid')){apply();clearInterval(q)}else if(++n>40)clearInterval(q)},150)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot()})();</script><script id="MM_NEUCE_PRICES_20260909">
(function(){
  const PR={
    neucebel:[['1L','€9,90'],['5L','€39,90'],['15L','€89,90']],
    neucematt:[['5L','€29,90'],['15L','€69,90']],
    neucesoft:[['1L','€14,90'],['5L','€39,90'],['15L','€129,90']]
  };
  const key=(new URLSearchParams(location.search).get('slug')||'').toLowerCase();
  if(!PR[key])return;
  let done=false;
  const apply=()=>{
    if(done||!window.P)return;
    P.variants=PR[key].map(x=>({name:x[0],price:x[1],stock:'Disponível'}));
    P.capacity=PR[key].map(x=>x[0]);
    P.price=PR[key][0][1]+' – '+PR[key][PR[key].length-1][1];
    P.price_display=P.price;
    done=true;
    render();
  };
  const t=setInterval(()=>{if(window.P){apply();clearInterval(t)}},100);
  setTimeout(()=>clearInterval(t),10000);
})();
</script>
</body></html>
