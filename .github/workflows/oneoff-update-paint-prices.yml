name: Atualizar preços das tintas
on:
  push:
    paths:
      - 'scripts/update_paint_prices.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar preços
        run: python scripts/update_paint_prices.py
      - name: Commit e remover ficheiros temporários
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.db
          git rm -f scripts/update_paint_prices.py .github/workflows/oneoff-update-paint-prices.yml
          git commit -m 'Atualizar preços das tintas NEUCE'
          git push
