name: Fix NEUCE prices in catalog DB

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-neuce-prices-db.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update catalog database
        run: |
          python - <<'PY'
          import sqlite3, json
          db='data/catalog.db'
          conn=sqlite3.connect(db)
          cur=conn.cursor()
          products={
            'neucebel': [
              {'name':'1L','price':'€9,90','stock':'Disponível'},
              {'name':'5L','price':'€39,90','stock':'Disponível'},
              {'name':'15L','price':'€89,90','stock':'Disponível'}
            ],
            'neucematt': [
              {'name':'5L','price':'€29,90','stock':'Disponível'},
              {'name':'15L','price':'€69,90','stock':'Disponível'}
            ],
            'neucesoft': [
              {'name':'1L','price':'€14,90','stock':'Disponível'},
              {'name':'5L','price':'€39,90','stock':'Disponível'},
              {'name':'15L','price':'€129,90','stock':'Disponível'}
            ]
          }
          for slug, variants in products.items():
              row=cur.execute('SELECT slug,name FROM products WHERE lower(slug)=?',(slug,)).fetchone()
              if not row:
                  print('Produto não encontrado:', slug)
                  continue
              low=min(float(v['price'].replace('€','').replace(',','.')) for v in variants)
              high=max(float(v['price'].replace('€','').replace(',','.')) for v in variants)
              display=f'€{low:.2f} – €{high:.2f}'.replace('.',',')
              cur.execute('UPDATE products SET variants_json=?, price=?, price_display=?, updated_at=CURRENT_TIMESTAMP WHERE lower(slug)=?',
                          (json.dumps(variants,ensure_ascii=False,separators=(',',':')), low, display, slug))
              print('Atualizado:', slug, variants)
          conn.commit()
          conn.close()
          PY

      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.db
          git diff --cached --quiet || git commit -m "Atualizar preços e variantes NEUCE na base de dados"
          git push

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-neuce-prices-db.yml
          git add .github/workflows/fix-neuce-prices-db.yml
          git commit -m "Remover workflow temporário de preços NEUCE" || true
          git push || true
