name: MarquesMater V10.30 install dashboard
on:
  push:
    branches: [main]
jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install dashboard fix in admin.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="js/v10.30-dashboard-fix.js?v=130"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>')
              p.write_text(s,encoding='utf-8')
              print('V10.30 script instalado no admin.html')
          else:
              print('V10.30 script já instalado')
          PY
      - name: Commit installation
        run: |
          git config user.name 'MarquesMater Bot'
          git config user.email 'actions@github.com'
          git add admin.html
          if git diff --cached --quiet; then echo 'Sem alterações'; exit 0; fi
          git commit -m 'V10.30 — ativar novo Dashboard e menu escuro'
          git push
