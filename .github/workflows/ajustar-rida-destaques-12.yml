name: Ajustar destaque RIDA para 12
on:
  push:
    branches: [main]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aumentar cartões RIDA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const rp=(featured.length?[...featured,...others].slice(0,8):(rida||[]).filter(p=>p.brand==='RIDA').slice(0,8));"
          new="const rp=(featured.length?[...featured,...others].slice(0,12):(rida||[]).filter(p=>p.brand==='RIDA').slice(0,12));"
          if old not in s:
              raise SystemExit('Linha do destaque RIDA não encontrada')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Mostrar 12 máquinas RIDA em destaque'
          git push
      - name: Remover workflow temporário
        if: success()
        run: |
          git rm .github/workflows/ajustar-rida-destaques-12.yml
          git commit -m 'Remover workflow temporário RIDA'
          git push
