name: Apply NEUCE paints
on: push
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_server_neuce.py
      - run: python scripts/update_neuce_paints.py
      - run: python -m py_compile server.py
      - name: Clean generated files
        run: rm -rf __pycache__ scripts/__pycache__
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py admin.html produto-wc.html scripts
          git diff --cached --quiet || git commit -m "Finalizar pinturas NEUCE e WoodNeuce"
          git pull --rebase origin main
          git push
