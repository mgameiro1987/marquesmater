<!DOCTYPE html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Produto | MarquesMater</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="v4.css"><link rel="stylesheet" href="v5.css"><link rel="stylesheet" href="v6.css"><link rel="stylesheet" href="v7.css"><link rel="stylesheet" href="v7.1.css"><link rel="stylesheet" href="v7.2.css"><link rel="stylesheet" href="v7.2.1.css"><link rel="stylesheet" href="v8.3.css"><link rel="stylesheet" href="v8.4.css"><link rel="stylesheet" href="v8.13.css"></head><body><div class="topbar">ENTREGA EM PORTUGAL CONTINENTAL · LEVANTAMENTO EM LOJA · APOIO AO CLIENTE</div><header><div class="container header-main"><a class="logo" href="index.html">MARQUES<b>MATER</b></a><div class="search"><input id="searchInput" placeholder="Pesquisar produtos, marcas ou referências..."><button onclick="doSearch()">⌕</button></div><div class="head-actions"><a href="account.html"><span>♙</span><small>Conta</small></a><a href="favorites.html"><span>♡</span><small>Favoritos</small></a><a href="cart.html"><span>🛒</span><small>Carrinho <b id="cartCount">0</b></small></a></div></div></header><nav><div class="container nav-inner" id="mainNav"></div></nav><main class="section"><div class="container"><div class="breadcrumbs"><a href="index.html">Início</a> / <a id="catLink">Categoria</a> / Produto</div><div class="product-detail v6-product" id="root"></div><div class="tabs v6-tabs"><button class="active" type="button">Descrição</button><button type="button">Características</button><button type="button">Especificações</button><button type="button">Aplicações</button><button type="button">Documentação</button><button type="button">Avaliações</button></div><div class="tabbody" id="tabbody"></div></div></main><footer><div class="container copyright">© MarquesMater · Produto V8.13</div></footer><script src="js/catalog.js"></script><script src="js/v8.4-data.js"></script><script src="js/store.js"></script><script src="js/chat.js"></script><script>document.getElementById('mainNav').innerHTML=MM_NAV;const params=new URLSearchParams(location.search),sku=params.get('sku')||'SIL001',p=MARQUES_CATALOG.find(x=>x.sku===sku)||MARQUES_CATALOG[0];document.title=p.name+' | MarquesMater';document.getElementById('catLink').href='category.html?cat='+encodeURIComponent(p.category);document.getElementById('catLink').textContent=p.category;const variantImages=(MM_VARIANT_IMAGES||{})[p.sku]||{},variantPrices=(MM_VARIANT_PRICES||{})[p.sku]||{};let selections={};let qtyValue=1;for(const [k,vals] of Object.entries(p.options||{})){selections[k]=variantPrices[k]?Object.keys(variantPrices[k])[Object.keys(variantPrices[k]).length-1]:vals[0]}for(const [k,map] of Object.entries(variantImages)){selections[k]=Object.keys(map).find(v=>v==='Branco'||v==='3000 K')||Object.keys(map)[0]}function isVisual(k,v){return !!variantImages[v]}function swatch(v,k){let color={"Branco":"#fff","Preto":"#111","Cinza":"#8f9499","Transparente":"linear-gradient(135deg,#ffffff,#dce9ef)","Marfim":"#eee4cf","3000 K":"linear-gradient(135deg,#ffd27a,#fff1c2)","4000 K":"linear-gradient(135deg,#f4f4f4,#ffffff)","6500 K":"linear-gradient(135deg,#b9d9ff,#eef7ff)"}[v]||'#ddd';return `<button class="v6-swatch ${selections[k]===v?'selected':''}" style="--swatch:${color}" data-value="${v}" title="${v}" onclick="choose(this,'${v.replace(/'/g,"\\'")}','${k.replace(/'/g,"\\'")}')"><span></span><em>${v}</em></button>`}function optionBlock(k,vals){let visual=vals.some(v=>isVisual(k,v));return `<div class="option v6-option"><label>${k}</label>${variantPrices[k]?'<div class="v84-option-note">O preço varia conforme a opção selecionada</div>':''}<div class="option-buttons ${visual?'v6-swatches':''}">${vals.map(v=>visual?swatch(v,k):`<button class="${selections[k]===v?'selected':''}" data-value="${v}" onclick="choose(this,'${v.replace(/'/g,"\\'")}','${k.replace(/'/g,"\\'")}')">${v}</button>`).join('')}</div></div>`}const specs=(p.specs||[]).map(x=>{let a=x.split(':');return `<tr><td>${a[0]}</td><td>${a.slice(1).join(':').trim()}</td></tr>`}).join('');function currentPrice(){let price=p.price;for(const [k,map] of Object.entries(variantPrices)){if(selections[k]&&map[selections[k]]!=null)price=map[selections[k]]}return price}function money(n){return Number(n).toFixed(2).replace('.',',')}function currentImage(){for(const v of Object.values(selections)){if(variantImages[v])return variantImages[v]}return p.image}function render(){const options=Object.entries(p.options||{}).map(([k,v])=>optionBlock(k,v)).join('');document.getElementById('root').innerHTML=`<section class="v6-gallery v83-gallery"><div class="v6-thumbs"><button class="active"><img src="${currentImage()}" alt=""></button></div><div class="gallery v6-main-image"><img id="mainProductImage" src="${currentImage()}" alt="${p.name}"><div class="v6-image-note">Imagem demonstrativa da variante selecionada</div></div></section><section class="details v6-details"><div class="v6-brand">${p.brand}</div><h1>${p.name}</h1><p class="v6-subtitle">${p.description}</p><div class="stars">★★★★★ <span>4,8 · 24 avaliações</span></div><div class="sku">Referência base: <span data-variant-sku>${p.sku}</span></div><div class="v6-feature-list"><span>✓ Qualidade profissional</span><span>✓ Várias opções</span><span>✓ Informação técnica</span></div>${options}<div class="v6-buy"><div><div class="detail-price"><span id="currentPrice">${money(currentPrice())} €</span> <small>IVA incluído</small></div><div class="stock">● <span data-variant-stock>${p.stock}</span></div></div><div class="qty"><button onclick="qty(-1)">−</button><span id="qty">1</span><button onclick="qty(1)">+</button></div><button class="btn light big v6-cart" onclick="add()">🛒 ADICIONAR AO CARRINHO</button></div><div class="delivery">🚚 Entrega em Portugal Continental · 🏪 Levantamento em loja</div></section>`;document.getElementById('tabbody').innerHTML=`<p>${p.description} Nesta área teremos a descrição completa, aplicações, recomendações e documentação técnica.</p><table class="mm-spec-table">${specs}</table>`}function choose(btn,value,key){selections[key]=value;btn.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');const img=document.getElementById('mainProductImage');if(img)img.src=currentImage();const price=document.getElementById('currentPrice');if(price)price.textContent=money(currentPrice())+' €';if(window.MMVariantEngine)MMVariantEngine.sync()}function qty(x){qtyValue=Math.max(1,qtyValue+x);document.getElementById('qty').textContent=qtyValue}function add(){if(window.MMStore){const opts={};Object.entries(selections).forEach(([k,v])=>opts[k]=v);MMStore.addCart(sku,qtyValue,opts)}else{let old=Number(localStorage.getItem('mm_cart_count')||0);localStorage.setItem('mm_cart_count',old+qtyValue);document.getElementById('cartCount').textContent=old+qtyValue}alert('Variante selecionada adicionada ao carrinho (demonstração).')}function doSearch(){let x=document.getElementById('searchInput').value.trim();if(x)location.href='category.html?q='+encodeURIComponent(x)}document.getElementById('cartCount').textContent=localStorage.getItem('mm_cart_count')||0;render();</script><script src="js/v8.12-variant-engine.js"></script><script src="js/v8.13-buy.js"></script><script src="js/v89-tabs.js"></script></body></html>
