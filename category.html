<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo | MarquesMater</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="v5.css"><link rel="stylesheet" href="v7.css"><link rel="stylesheet" href="v7.1.css"><link rel="stylesheet" href="v7.2.css"><link rel="stylesheet" href="v7.2.1.css"><link rel="stylesheet" href="v7.2.2.css"><link rel="stylesheet" href="v8.2.css"><link rel="stylesheet" href="v8.3.css"><link rel="stylesheet" href="v8.4.css"><link rel="stylesheet" href="v8.13-favorites.css"></head><body><div class="top">ENTREGA EM PORTUGAL CONTINENTAL · LEVANTAMENTO EM LOJA · APOIO AO CLIENTE</div><header><div class="wrap head"><a class="logo" href="index.html">MARQUES<span>MATER</span></a><div class="search"><input id="q" placeholder="Pesquisar produtos, marcas ou referências..."><button onclick="goSearch()">⌕</button></div><div class="actions"><a href="#">♙<small>Conta</small></a><a href="#">♡<small>Favoritos</small></a><a href="cart.html">🛒<small>Carrinho <b id="cartCount">0</b></small></a></div></div></header><nav><div class="wrap nav" id="nav"></div></nav><main class="wrap section"><div class="crumb"><a href="index.html">Início</a> / Catálogo</div><span class="eyebrow dark">CATÁLOGO · V9.10.13</span><h1 id="title">Produtos</h1><p id="intro"></p><div class="subcats" id="subcats"></div><div class="tools"><span id="count">A carregar catálogo...</span><select id="sort"><option value="featured">Destaques</option><option value="low">Preço mais baixo</option><option value="high">Preço mais alto</option></select></div><div class="products" id="products"></div></main><footer><div class="copy">© MarquesMater · V9.10.13</div></footer><script src="js/catalog.js"></script><script src="js/v8.4-data.js"></script><script src="js/store.js"></script><script src="js/chat.js"></script><script src="js/v9.10.13-taxonomy-front-order.js?v=1031"></script><script>(async()=>{let catalog=[],classMap={};const ps=new URLSearchParams(location.search),q=(ps.get('q')||'').trim().toLowerCase(),cat=ps.get('cat')||'Construção';let current='';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function normalize(p){const a=p.attributes&&typeof p.attributes==='object'?p.attributes:{};return {...p,sku:String(p.sku||''),_pid:p.id||p.productId||null,brand:p.brand||'',name:p.name||'',category:p.category||'',subcategory:p.subcategory||'',family:p.family||a.family||'',price:Number(p.price||0),oldPrice:p.oldPrice==null?null:Number(p.oldPrice),stock:p.stockText||p.stock||'Em stock',image:p.image||'images/product-placeholder.svg',options:p.options||{},specs:p.specs||[],description:p.description||''}}async function loadDb(){const r=await fetch('/api/catalog/products?active=true&v=1030',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const rows=Array.isArray(data)?data:(Array.isArray(data.products)?data.products:(Array.isArray(data.items)?data.items:[]));catalog=rows.map(normalize).filter(p=>p.sku);if(!catalog.length)throw new Error('A API não devolveu produtos');}async function loadClassifications(){const r=await fetch('/api/catalog/classification?all=1&v=1030',{cache:'no-store'});if(!r.ok)throw new Error('HTTP classificações '+r.status);const j=await r.json();classMap=j.items||{};catalog=catalog.map(p=>({...p,classifications:classMap[String(p._pid)]||{}}))}function money(n){return Number(n||0).toFixed(2).replace('.',',')+' €'}function familyOf(p){return p.family||((p.attributes||{}).family)||''}function commercialOf(p){const x=p.classifications?.commercial||{};return {category:x.category||p.category,subcategory:x.subcategory||p.subcategory,family:x.family||familyOf(p)}}function ridaOf(p){return p.classifications?.rida||{}}function matchesCat(p){if(q)return true;if(cat==='RIDA')return String(ridaOf(p).category||'').toLowerCase()==='rida'||p.category==='RIDA';const x=commercialOf(p);return String(x.category||'')===cat}function subValue(p){if(cat==='RIDA'){const r=ridaOf(p);return r.family||r.subcategory||'RIDA'}const x=commercialOf(p);return x.subcategory||x.family||''}function renderSubcats(){const names=[...new Set(catalog.filter(matchesCat).map(subValue).filter(Boolean))];document.getElementById('subcats').innerHTML=names.map(s=>`<button onclick="filterSub('${esc(s).replace(/'/g,"\\'")}',this)">${esc(s)}</button>`).join('')}function minPrice(p){return Number(p.price||0)}function cardPrice(p){return `<div class="v84-price">${money(p.price)} <small>IVA incluído</small></div>`}function addQuick(p){if(window.MMStore)MMStore.addCart(p.sku,1)}function fav(sku,btn){if(window.MMStore){const on=MMStore.addFavorite(sku);btn.classList.toggle('active',on);btn.textContent=on?'♥':'♡';return}let f=JSON.parse(localStorage.getItem('mm_favs')||'[]');f=f.includes(sku)?f.filter(x=>x!==sku):[...f,sku];localStorage.setItem('mm_favs',JSON.stringify(f));btn.classList.toggle('active');btn.textContent=btn.classList.contains('active')?'♥':'♡'}function render(){let a=catalog.filter(p=>q?(p.name+' '+p.brand+' '+p.sku+' '+p.category+' '+p.subcategory+' '+familyOf(p)+' '+JSON.stringify(p.classifications||{})).toLowerCase().includes(q):matchesCat(p));if(current)a=a.filter(p=>subValue(p)===current);const s=document.getElementById('sort').value;if(s==='low')a.sort((x,y)=>minPrice(x)-minPrice(y));if(s==='high')a.sort((x,y)=>minPrice(y)-minPrice(x));document.getElementById('count').textContent=a.length+' produto(s)';const fs=window.MMStore?MMStore.state().favorites:JSON.parse(localStorage.getItem('mm_favs')||'[]');document.getElementById('products').innerHTML=a.length?a.map(p=>`<article class="product v84-card"><button class="v84-fav ${fs.includes(p.sku)?'active':''}" onclick="event.preventDefault();event.stopPropagation();fav('${esc(p.sku)}',this)" aria-label="Favorito">${fs.includes(p.sku)?'♥':'♡'}</button><a href="product.html?sku=${encodeURIComponent(p.sku)}"><div class="product-media">${p.badge?`<em>${esc(p.badge)}</em>`:''}<img src="${esc(p.image)}" alt="${esc(p.name)}" onerror="this.style.display='none'"></div><div><small>${esc(p.brand)}</small><h3>${esc(p.name)}</h3>${cardPrice(p)}<div class="v83-card-actions"><span class="v83-stock">● ${esc(p.stock)}</span><button class="v84-add" onclick="event.preventDefault();event.stopPropagation();addQuick(${JSON.stringify(p).replace(/</g,'\\u003c')})">ADICIONAR AO CARRINHO</button></div></div></a></article>`).join(''):'<p>Nenhum produto encontrado.</p>'}function filterSub(s,btn){current=current===s?'':s;document.querySelectorAll('.subcats button').forEach(b=>b.classList.remove('active'));if(current&&btn)btn.classList.add('active');render()}function goSearch(){const x=document.getElementById('q').value.trim();if(x)location.href='category.html?q='+encodeURIComponent(x)}window.filterSub=filterSub;window.goSearch=goSearch;document.getElementById('sort').onchange=render;document.getElementById('cartCount').textContent=localStorage.getItem('mm_cart_count')||0;document.getElementById('title').textContent=q?'Resultados da pesquisa':'Comprar '+cat;document.getElementById('intro').textContent=q?'Resultados da pesquisa em catálogo real.':'Escolhe uma subcategoria e abre cada produto para ver as opções técnicas.';document.getElementById('count').textContent='A carregar catálogo real...';try{await loadDb();await loadClassifications();document.getElementById('nav').innerHTML=(window.MM_CATEGORIES||[...new Set(catalog.map(p=>p.category).filter(Boolean))]).map(x=>`<a href="category.html?cat=${encodeURIComponent(x)}">${esc(x)}</a>`).join('');renderSubcats();render();}catch(e){console.error(e);document.getElementById('count').textContent='Não foi possível carregar o catálogo.';document.getElementById('products').innerHTML='<p>O catálogo está temporariamente indisponível. Tenta atualizar a página.</p>'}setTimeout(()=>window.MMStore&&MMStore.sync(),0)})();</script><script src="js/v11-taxonomy-front.js?v=1101"></script></body></html>
