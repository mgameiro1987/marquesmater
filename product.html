<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto | MarquesMater</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="v5.css"></head><body><div class="top">ENTREGA EM PORTUGAL CONTINENTAL · LEVANTAMENTO EM LOJA · APOIO AO CLIENTE</div><header><div class="wrap head"><a class="logo" href="index.html">MARQUES<span>MATER</span></a><div class="search"><input id="q" placeholder="Pesquisar produtos..."><button onclick="goSearch()">⌕</button></div><div class="actions"><a href="cart.html">🛒<small>Carrinho <b id="cartCount">0</b></small></a></div></div></header><nav><div class="wrap nav" id="nav"></div></nav><main class="wrap section"><div class="crumb"><a href="index.html">Início</a> / Produto</div><div id="root"></div></main><footer><div class="copy">© MarquesMater · V5</div></footer><script src="js/catalog.js"></script><script>document.getElementById('nav').innerHTML=MM_CATEGORIES.map(c=>`<a href="category.html?cat=${encodeURIComponent(c)}">${c}</a>`).join('');const sku=new URLSearchParams(location.search).get('sku')||'NEUCE-FACHADAS-15L',p=MARQUES_CATALOG.find(x=>x.sku===sku)||MARQUES_CATALOG[0];document.title=p.name+' | MarquesMater';let o=Object.entries(p.options||{}).map(([k,v])=>`<div class="option"><label>${k}</label><div>${v.map((x,i)=>`<button class="${i?'':'sel'}" onclick="pick(this)">${x}</button>`).join('')}</div></div>`).join('');let specs=(p.specs||[]).map(s=>{let a=s.split(':');return `<tr><td>${a[0]}</td><td>${a.slice(1).join(':').trim()}</td></tr>`}).join('');document.getElementById('root').innerHTML=`<div class="detail"><div class="gallery"><img src="${p.image}" alt="${p.name}"></div><div><small class="tag">${p.brand} · ${p.subcategory}</small><h1>${p.name}</h1><p class="stars">★★★★★ <span>4,8 · 24 avaliações</span></p><small>Referência: ${p.sku}</small><div class="bigprice">${p.price.toFixed(2).replace('.',',')} € <small>IVA incluído</small></div><p class="stock">● ${p.stock}</p><p>${p.description}</p>${o}<div class="buy"><button onclick="add()">ADICIONAR AO CARRINHO</button></div><div class="delivery">🚚 Entrega em Portugal Continental · 🏪 Levantamento em loja</div></div></div><div class="tabs"><b>Descrição</b><b>Características</b><b>Ficha Técnica</b><b>Downloads</b></div><table>${specs}</table>`;function pick(b){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}function add(){let n=Number(localStorage.getItem('mm_cart_count')||0)+1;localStorage.setItem('mm_cart_count',n);document.getElementById('cartCount').textContent=n;alert('Produto adicionado ao carrinho (demonstração).')}function goSearch(){let x=document.getElementById('q').value.trim();if(x)location.href='category.html?q='+encodeURIComponent(x)}document.getElementById('cartCount').textContent=localStorage.getItem('mm_cart_count')||0;</script></body></html>
