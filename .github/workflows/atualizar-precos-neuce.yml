name: Atualizar preços NEUCE
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar catálogo e produto
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, json

          prices = {
            'neucebel': [('1L','€9,90'),('5L','€39,90'),('15L','€89,90')],
            'neucematt': [('5L','€29,90'),('15L','€69,90')],
            'neucesoft': [('1L','€14,90'),('5L','€39,90'),('15L','€129,90')],
          }

          # Atualiza os dados estáticos do catálogo, mantendo imagens/descritivos existentes.
          p = Path('catalogo.html')
          s = p.read_text(encoding='utf-8')
          m = re.search(r'const PAINTINGS=(\[.*?\]);\nfunction esc', s, re.S)
          if not m:
              raise SystemExit('PAINTINGS não encontrado')
          arr = json.loads(m.group(1))
          for x in arr:
              slug = x.get('slug')
              if slug in prices:
                  vals = prices[slug]
                  x['variants'] = [{'name': n, 'price': pr, 'stock': 'Disponível'} for n,pr in vals]
                  x['capacity'] = [n for n,_ in vals]
                  x['price'] = f"{vals[0][1]} – {vals[-1][1]}"
          new_arr = json.dumps(arr, ensure_ascii=False, separators=(',',':'))
          s = s[:m.start(1)] + new_arr + s[m.end(1):]
          p.write_text(s, encoding='utf-8')

          # Na página de produto, os dados vêm da API. Este override garante as embalagens/preços definidos para NEUCE.
          q = Path('produto-wc.html')
          s = q.read_text(encoding='utf-8')
          marker = '</body>'
          if 'MM_NEUCE_PRICES_20260909' not in s:
              block = r'''<script id="MM_NEUCE_PRICES_20260909">
          (function(){
            const PR={
              neucebel:[['1L','€9,90'],['5L','€39,90'],['15L','€89,90']],
              neucematt:[['5L','€29,90'],['15L','€69,90']],
              neucesoft:[['1L','€14,90'],['5L','€39,90'],['15L','€129,90']]
            };
            const key=(new URLSearchParams(location.search).get('slug')||'').toLowerCase();
            if(!PR[key])return;
            let done=false;
            const apply=()=>{
              if(done||!window.P)return;
              P.variants=PR[key].map(x=>({name:x[0],price:x[1],stock:'Disponível'}));
              P.capacity=PR[key].map(x=>x[0]);
              P.price=PR[key][0][1]+' – '+PR[key][PR[key].length-1][1];
              P.price_display=P.price;
              done=true;
              render();
            };
            const t=setInterval(()=>{if(window.P){apply();clearInterval(t)}},100);
            setTimeout(()=>clearInterval(t),10000);
          })();
          </script>
          '''
              s = s.replace(marker, block + marker)
              q.write_text(s, encoding='utf-8')
          PY
      - name: Commit e remover workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.html produto-wc.html
          git diff --cached --quiet || git commit -m "Definir preços e embalagens NEUCE"
          git push
          git rm .github/workflows/atualizar-precos-neuce.yml
          git commit -m "Remover workflow temporário de preços NEUCE"
          git push
