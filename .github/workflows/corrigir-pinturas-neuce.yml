name: Corrigir Pinturas NEUCE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção definitiva
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('catalogo.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- MM-NEUCE-PINTURAS-FIX -->'
          if marker not in s:
              block=r'''<!-- MM-NEUCE-PINTURAS-FIX -->
          <script>
          (function(){
            function render(){
              const params=new URLSearchParams(location.search);
              if(params.get('cat')!=='Pinturas') return;
              const grid=document.getElementById('grid');
              if(!grid) return;
              const items=[
                {slug:'neucebel',name:'NeuceBel',price:'Desde 89,00 €',image:'https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucebel-600x638.png'},
                {slug:'neucematt',name:'NeuceMatt',price:'Desde 79,00 €',image:'https://www.saniluz.pt/cdn/shop/files/5602920000587.jpg?v=1733586586'},
                {slug:'neucesoft',name:'NeuceSoft',price:'Desde 129,00 €',image:'https://cdn-shopkit.com/usercontent/tintas-vital/media/images/square/37a3a6a-neucesoft.jpeg'}
              ];
              const safe=(v)=>String(v).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
              grid.innerHTML=items.map(x=>`<a class="product neuce-simple-card" href="produto-wc.html?slug=${encodeURIComponent(x.slug)}"><div class="pimg"><img src="${x.image}" alt="${safe(x.name)}" loading="lazy" onerror="this.onerror=null;this.src='/assets/paint-placeholder.svg'"></div><div class="pbody"><small>NEUCE · PINTURAS</small><h3>${safe(x.name)}</h3><div class="price">${safe(x.price)}</div></div></a>`).join('');
              const count=document.getElementById('count'); if(count) count.textContent='3 produtos NEUCE';
              const pager=document.getElementById('pager'); if(pager) pager.innerHTML='';
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',render); else render();
            setTimeout(render,250);
          })();
          </script>
          '''
              s=s.replace('</body>',block+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q 'MM-NEUCE-PINTURAS-FIX' catalogo.html
          grep -q 'NeuceBel' catalogo.html
          grep -q 'NeuceMatt' catalogo.html
          grep -q 'NeuceSoft' catalogo.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogo.html
          git diff --cached --quiet || git commit -m 'MarquesMater V26 - fix definitivo Pinturas NEUCE'
          git push
