services:
  - type: web
    name: marquesmater
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/sync_missing_neuce_images.py"
    startCommand: "python server.py"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
