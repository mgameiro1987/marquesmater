<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrinho — MarquesMater</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="container head-main"><a href="index.html"><img class="logo" src="assets/marquesmater-logo.svg" alt="MarquesMater"></a><div class="head-actions"><a class="action" href="catalogo.html"><b>←</b><span>Loja</span></a></div></div></header><main class="catalog"><div class="container"><div class="tag">MarquesMater</div><h1>Carrinho</h1><div id="cart"></div></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function render(){let c=JSON.parse(localStorage.getItem('mm_cart')||'[]'),box=document.getElementById('cart');if(!c.length){box.innerHTML='<div class="panel" style="background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:25px">O carrinho está vazio. <a class="cta" href="catalogo.html">CONTINUAR A COMPRAR</a></div>';return}box.innerHTML=c.map((x,i)=>`<div class="product" style="display:flex;align-items:center;gap:15px;padding:14px;margin-bottom:10px"><img src="${esc(x.image||'assets/paint-placeholder.svg')}" style="width:80px;height:80px;object-fit:contain"><div style="flex:1"><b>${esc(x.name)}</b><div class="muted">${esc(x.variant||'')} ${x.ref?'· Ref. '+esc(x.ref):''}</div><div class="price">${esc(x.price||'Consultar')}</div></div><input type="number" min="1" value="${x.qty}" style="width:70px;padding:10px" onchange="qty(${i},this.value)"><button class="btn" onclick="del(${i})">✕</button></div>`).join('')+`<div style="margin-top:18px;text-align:right"><button class="btn danger" onclick="clearCart()">Esvaziar</button></div>`}function qty(i,v){let c=JSON.parse(localStorage.getItem('mm_cart')||'[]');c[i].qty=Math.max(1,parseInt(v||1));localStorage.setItem('mm_cart',JSON.stringify(c));render()}function del(i){let c=JSON.parse(localStorage.getItem('mm_cart')||'[]');c.splice(i,1);localStorage.setItem('mm_cart',JSON.stringify(c));render()}function clearCart(){localStorage.removeItem('mm_cart');render()}render()</script><script src="chat.js"></script><script src="nav.js"></script></body></html>
