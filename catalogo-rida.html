<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Máquinas — MarquesMater</title><link rel="stylesheet" href="style.css"><style>.machine-head{padding:30px 0}.machine-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.machine-card{border:1px solid #e1e5e9;border-radius:12px;background:#fff;overflow:hidden;text-decoration:none;color:inherit}.machine-card img{width:100%;height:220px;object-fit:contain;background:#fafafa}.machine-card .b{padding:13px}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.subnav button{border:1px solid #ddd;background:#fff;border-radius:20px;padding:8px 12px}.subnav button.active{border-color:#e85d04}@media(max-width:900px){.machine-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.machine-grid{grid-template-columns:1fr}}</style></head><body><header class="header"><div class="container head-main"><a href="index.html"><img class="logo" src="assets/marquesmater-logo.svg"></a><form class="search" onsubmit="event.preventDefault();load()"><input id="q" placeholder="Pesquisar máquinas..."><button>⌕</button></form><div class="head-actions"><a class="action" href="index.html"><b>⌂</b><span>Início</span></a><a class="action" href="carrinho.html"><b>🛒</b><span>Carrinho</span></a></div></div><div class="menu"><div class="container"><div id="global-menu"></div></div></div></header><main><div class="container machine-head"><div class="tag">MarquesMater</div><h1>Máquinas</h1><p>Máquinas com fio e máquinas sem fio. RIDA é a marca.</p><div class="subnav"><button class="active" onclick="setSub('')">Todas</button><button onclick="setSub('Máquinas com fio')">Com fio</button><button onclick="setSub('Máquinas sem fio')">Sem fio</button></div><div id="grid" class="machine-grid"></div></div></main><footer class="footer"><div class="container copyright">© 2026 MarquesMater · </div></footer><script>let sub='';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function setSub(x){sub=x;document.querySelectorAll('.subnav button').forEach((b,i)=>b.classList.toggle('active',i===(x===''?0:x.includes('com fio')?1:2)));load()}async function load(){let q=document.getElementById('q').value||'';let r=await fetch('/api/products?category=Máquinas&sub='+encodeURIComponent(sub)+'&search='+encodeURIComponent(q));let a=await r.json();a=a.filter(p=>p.brand==='RIDA');document.getElementById('grid').innerHTML=a.map(p=>`<a class="machine-card" href="produto-wc.html?slug=${encodeURIComponent(p.slug)}"><img src="${esc(p.image||'assets/paint-placeholder.svg')}" alt="${esc(p.name)}"><div class="b"><small>RIDA · ${esc(p.subfamily||'')}</small><h3>${esc(p.name)}</h3><b>${esc(p.price_display||p.price||'Preço sob consulta')}</b></div></a>`).join('')||'<p>Sem máquinas.</p>'}load()</script><script src="chat.js"></script><script src="nav.js"></script></body></html>
