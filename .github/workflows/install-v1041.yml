name: Install V10.41 Backoffice extensions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.py')
          s=p.read_text(encoding='utf-8')
          marker='server=ThreadingHTTPServer(("0.0.0.0",PORT),Handler)'
          insert="""# MarquesMater V10.41 — extensões persistentes do Backoffice\ntry:\n    from server_extensions import install as _mm_install_extensions\n    _mm_install_extensions(Handler, get_conn, DB_READY)\nexcept Exception as _mm_ext_error:\n    print('MarquesMater V10.41 extensions error:', _mm_ext_error)\n"""
          if 'from server_extensions import install as _mm_install_extensions' not in s:
              if marker not in s: raise SystemExit('server start marker not found')
              s=s.replace(marker,insert+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
          else:
              print('server.py já corrigido')
          PY
      - name: Commit server patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.py
          git diff --cached --quiet || git commit -m 'V10.41 — ligar extensões persistentes ao servidor'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/install-v1041.yml
          git commit -m 'V10.41 — remover workflow temporário'
          git push
