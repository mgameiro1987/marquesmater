name: Corrigir Soudal Front Office + Back Office V25

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/corrigir-soudal-front-back-v25.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Aplicar correções Soudal
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('server.py'); s=p.read_text(encoding='utf-8')
          if '/api/admin/soudal' not in s:
              get_code="""
          if urllib.parse.urlparse(self.path).path == '/api/admin/soudal':
              fp=os.path.join(ROOT,'data','soudal_products.json')
              try:
                  with open(fp,'r',encoding='utf-8') as f: payload=json.load(f)
              except Exception: payload={'products':[]}
              raw=json.dumps(payload,ensure_ascii=False).encode('utf-8')
              self.send_response(200); self.send_header('Content-Type','application/json; charset=utf-8'); self.send_header('Cache-Control','no-store'); self.send_header('Content-Length',str(len(raw))); self.end_headers(); self.wfile.write(raw); return
          """
              post_code="""
          if urllib.parse.urlparse(self.path).path == '/api/admin/soudal':
              try:
                  length=int(self.headers.get('Content-Length','0')); payload=json.loads(self.rfile.read(length).decode('utf-8'))
                  fp=os.path.join(ROOT,'data','soudal_products.json'); os.makedirs(os.path.dirname(fp),exist_ok=True)
                  with open(fp,'w',encoding='utf-8') as f: json.dump(payload,f,ensure_ascii=False,indent=2)
                  raw=json.dumps({'ok':True,'count':len(payload.get('products',[]))},ensure_ascii=False).encode('utf-8')
                  self.send_response(200); self.send_header('Content-Type','application/json; charset=utf-8'); self.send_header('Content-Length',str(len(raw))); self.end_headers(); self.wfile.write(raw)
              except Exception as e:
                  raw=json.dumps({'ok':False,'error':str(e)},ensure_ascii=False).encode('utf-8'); self.send_response(400); self.send_header('Content-Type','application/json; charset=utf-8'); self.send_header('Content-Length',str(len(raw))); self.end_headers(); self.wfile.write(raw)
              return
          """
              m=re.search(r'\n(    def do_GET\(self\):)',s)
              if not m: raise SystemExit('do_GET não encontrado')
              s=s[:m.start(1)]+m.group(1)+get_code+s[m.end(1):]
              m=re.search(r'\n(    def do_POST\(self\):)',s)
              if not m: raise SystemExit('do_POST não encontrado')
              s=s[:m.start(1)]+m.group(1)+post_code+s[m.end(1):]
              p.write_text(s,encoding='utf-8')

          pp=Path('produto-wc.html'); s=pp.read_text(encoding='utf-8')
          if 'MM_SoudalLocalFix' not in s:
              s=s.replace('</head>','<style id="MM_SoudalLocalFix">.color-choice-grid{display:flex;flex-wrap:wrap;gap:8px}.color-choice{display:inline-flex;align-items:center;gap:8px;border:1px solid #cfd6dc;background:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.color-choice.active{border-color:#f28c00;box-shadow:0 0 0 2px rgba(242,140,0,.13)}.color-dot{width:22px;height:22px;border-radius:50%;border:1px solid #c6ccd1;display:inline-block;box-shadow:inset 0 0 0 2px #fff}</style></head>',1)
              js='''<script id="MM_SoudalLocalFix">(async function(){try{if(!slug||!/^soudal-|^soudabond-/i.test(slug))return;const r=await fetch('/data/soudal_products.json?mm='+Date.now(),{cache:'no-store'});if(!r.ok)return;const d=await r.json();const raw=(d.products||[]).find(x=>x.slug===slug);if(!raw)return;const colors=(raw.variants||[]).map(v=>({name:v.color||v.name||v.label||'',color:v.color||v.name||v.label||'',price:v.price})).filter(v=>v.name);P={...P,...raw,image:raw.asset_image||raw.image,gallery:[raw.asset_image||raw.image].filter(Boolean),docs:raw.asset_doc?[{title:'Ficha técnica / documentação Soudal',url:raw.asset_doc}]:[],variants:colors,description:raw.description||P.description,tech:raw.tech||P.tech,brand:raw.brand||P.brand,sku:raw.ref||P.sku,price_display:raw.price_display||P.price_display,price:raw.price||P.price,stock:raw.stock??P.stock};render();setTimeout(()=>{const t=document.querySelector('.variant-title'),g=document.querySelector('.variant-grid');if(t&&g&&colors.length){t.textContent='Escolha a cor';g.className='color-choice-grid';g.innerHTML=colors.map((v,i)=>{const c=(v.color||'').toLowerCase();let bg='#fff';if(c.includes('preto'))bg='#171717';else if(c.includes('cinz'))bg='#9ca3a8';else if(c.includes('castanho'))bg='#8b5a36';else if(c.includes('terracota'))bg='#b85c43';else if(c.includes('bege'))bg='#d7c2a2';else if(c.includes('antracite'))bg='#4d5255';else if(c.includes('transpar'))bg='linear-gradient(135deg,#fff,#dfe8ef)';else if(c.includes('laranja'))bg='#e87518';return `<button type="button" class="color-choice ${i===0?'active':''}" onclick="selectVariant(${i});MM_SoudalColor(${i})"><span class="color-dot" style="background:${bg}"></span>${esc(v.name)}</button>`}).join('')}document.querySelectorAll('.rel-card').forEach(card=>{const n=card.querySelector('.rel-name')?.textContent?.trim();const m=(d.products||[]).find(x=>x.name===n);if(m?.asset_image){const im=card.querySelector('img');if(im){im.src='/'+m.asset_image.replace(/^\//,'');im.onerror=null}}})},120)}catch(e){console.warn(e)}})();function MM_SoudalColor(i){document.querySelectorAll('.color-choice').forEach((b,k)=>b.classList.toggle('active',k===i))}</script>'''
              s=s.replace('</body>',js+'</body>',1); pp.write_text(s,encoding='utf-8')

          cp=Path('catalogo.html'); s=cp.read_text(encoding='utf-8')
          if 'MM_SoudalCatalogFix' not in s:
              js='''<script id="MM_SoudalCatalogFix">(async function(){try{const r=await fetch('/data/soudal_products.json?mm='+Date.now(),{cache:'no-store'});if(!r.ok)return;const d=await r.json(),a=d.products||[];const fix=()=>document.querySelectorAll('.product').forEach(card=>{const n=card.querySelector('h3')?.textContent?.trim(),p=a.find(x=>x.name===n);if(p?.asset_image){const im=card.querySelector('img');if(im){im.src='/'+p.asset_image.replace(/^\//,'');im.onerror=null}}});setTimeout(fix,250);const old=window.load;if(typeof old==='function')window.load=async function(){const z=await old.apply(this,arguments);setTimeout(fix,100);return z}}catch(e){console.warn(e)}})();</script>'''
              s=s.replace('</body>',js+'</body>',1); cp.write_text(s,encoding='utf-8')

          ap=Path('admin.html'); s=ap.read_text(encoding='utf-8')
          if 'MM_SoudalAdmin' not in s:
              css='''<style id="MM_SoudalAdmin">.mm-soudal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mm-soudal-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:16px;margin-bottom:14px}.mm-soudal-colors{display:grid;gap:8px}.mm-soudal-color{display:grid;grid-template-columns:1.5fr 1fr 42px;gap:8px;align-items:center}.mm-soudal-preview{width:100%;max-height:220px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#fafbfc;padding:12px}@media(max-width:800px){.mm-soudal-grid{grid-template-columns:1fr}.mm-soudal-color{grid-template-columns:1fr 1fr 42px}}</style>'''
              s=s.replace('</head>',css+'</head>',1)
              js='''<script id="MM_SoudalAdmin">(function(){let db={products:[]},cur=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function nav(){const n=$('.nav');if(!n||$('#mmSoudalBtn'))return;const b=document.createElement('button');b.id='mmSoudalBtn';b.textContent='🧴 Soudal';b.onclick=open;n.appendChild(b)}function open(){let v=$('#mmSoudalView');if(!v){v=document.createElement('section');v.id='mmSoudalView';v.className='view';$('.content').appendChild(v)}document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));v.classList.add('active');load()}async function load(){db=await (await fetch('/api/admin/soudal?mm='+Date.now(),{cache:'no-store'})).json();cur=db.products[0]||null;render()}function render(){const v=$('#mmSoudalView');v.innerHTML=`<div class="bo-section-head"><div><div class="eyebrow">Produtos / Soudal</div><h2>Gestão de produtos Soudal</h2><p class="muted">Preço, descrição, imagem, ficha técnica, especificações e cores. Sem seleção de embalagens.</p></div><div class="actions"><select id="mmSel" class="input" style="width:auto;min-width:280px">${db.products.map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join('')}</select><button id="mmSave" class="btn primary">Guardar alterações</button></div></div><div id="mmForm" class="mm-soudal-card"></div>`;$('#mmSel').value=db.products.indexOf(cur);$('#mmSel').onchange=e=>{cur=db.products[+e.target.value];form()};$('#mmSave').onclick=save;form()}function form(){const p=cur||{};$('#mmForm').innerHTML=`<div class="mm-soudal-grid"><div><label class="label">Nome</label><input id="mn" class="input" value="${esc(p.name)}"></div><div><label class="label">Referência</label><input id="mr" class="input" value="${esc(p.ref)}"></div><div><label class="label">Preço (€)</label><input id="mp" class="input" type="number" step="0.01" value="${p.price??''}"></div><div><label class="label">Stock</label><input id="ms" class="input" type="number" value="${p.stock??1}"></div><div class="full"><label class="label">Descrição</label><textarea id="md" class="input" rows="4">${esc(p.description)}</textarea></div><div><label class="label">Imagem local</label><input id="mi" class="input" value="${esc(p.asset_image)}"></div><div><label class="label">Ficha técnica local</label><input id="mf" class="input" value="${esc(p.asset_doc)}"></div><div class="full"><label class="label">Especificações técnicas</label><textarea id="mt" class="input" rows="7">${esc((p.tech||[]).join('\\n'))}</textarea></div></div><div class="mm-soudal-card"><h3>Cores disponíveis</h3><div id="mc" class="mm-soudal-colors"></div><button id="ma" class="btn">+ Adicionar cor</button></div><div class="mm-soudal-card"><h3>Imagem</h3><img class="mm-soudal-preview" src="/${String(p.asset_image||'').replace(/^\//,'')}" onerror="this.style.display='none'"></div>`;colors();$('#ma').onclick=()=>{cur.variants=cur.variants||[];cur.variants.push({label:'',color:'',price:cur.price||0});colors()}}function colors(){const b=$('#mc');b.innerHTML=(cur.variants||[]).map((v,i)=>`<div class="mm-soudal-color"><input class="input cn" data-i="${i}" value="${esc(v.color||v.name||v.label)}" placeholder="Cor"><input class="input cp" data-i="${i}" type="number" step="0.01" value="${v.price??cur.price??''}" placeholder="Preço"><button class="btn danger rm" data-i="${i}">✕</button></div>`).join('');b.querySelectorAll('.rm').forEach(x=>x.onclick=()=>{cur.variants.splice(+x.dataset.i,1);colors()})}async function save(){cur.name=$('#mn').value;cur.ref=$('#mr').value;cur.price=+$('#mp').value||0;cur.price_display=cur.price?cur.price.toFixed(2).replace('.',',')+' €':'';cur.stock=+$('#ms').value||0;cur.description=$('#md').value;cur.asset_image=$('#mi').value;cur.asset_doc=$('#mf').value;cur.tech=$('#mt').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);cur.variants=[...document.querySelectorAll('.cn')].map((x,i)=>({label:x.value,color:x.value,price:+document.querySelectorAll('.cp')[i].value||cur.price}));const o=await (await fetch('/api/admin/soudal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(db)})).json();alert(o.ok?'Alterações guardadas.':'Erro: '+o.error);render()}document.addEventListener('DOMContentLoaded',nav)})();</script>'''
              s=s.replace('</body>',js+'</body>',1); ap.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: python -m py_compile server.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py produto-wc.html catalogo.html admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir Soudal: imagens cores e editor backoffice"
          git push
