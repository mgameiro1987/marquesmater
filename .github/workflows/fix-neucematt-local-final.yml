name: Fix NeuceMatt local image
on:
  push:
    paths:
      - '.github/workflows/fix-neucematt-local-final.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use local NEUCE real image everywhere
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('catalogo.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucematt-600x638.jpg','assets/neucematt-real.png')
          s=s.replace('https://wsrv.nl/?url=https%3A%2F%2Fwww.saniluz.pt%2Fcdn%2Fshop%2Ffiles%2F5602920000587.jpg%3Fv%3D1733586586&w=600&h=600&fit=inside','assets/neucematt-real.png')
          s=s.replace('https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucematt.png','assets/neucematt-real.png')
          p.write_text(s,encoding='utf-8')
          q=Path('produto-wc.html')
          x=q.read_text(encoding='utf-8')
          old="const MAP={neucebel:['/assets/neucebel-trabalhada.svg','/assets/neucebel-normal.svg'],neucematt:['/assets/neucematt-trabalhada.svg','/assets/neucematt-normal.svg'],neucesoft:['/assets/neucesoft-trabalhada.svg','/assets/neucesoft-normal.svg']};"
          new="const MAP={neucebel:['/assets/neucebel-real.jpg','/assets/neucebel-normal.svg'],neucematt:['/assets/neucematt-real.png','/assets/neucematt-normal.svg'],neucesoft:['/assets/neucesoft-real.jpg','/assets/neucesoft-normal.svg']};"
          if old not in x:
            raise SystemExit('MAP NEUCE esperado não encontrado; não alterar')
          q.write_text(x.replace(old,new),encoding='utf-8')
          PY
          test -f assets/neucematt-real.png
          grep -q 'assets/neucematt-real.png' catalogo.html
          grep -q "neucematt:\['/assets/neucematt-real.png'" produto-wc.html
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogo.html produto-wc.html
          git commit -m 'Fix imagem NeuceMatt local no catalogo e produto'
          git push
          git rm -f .github/workflows/fix-neucematt-local-final.yml
          git commit -m 'Remover workflow temporario NeuceMatt local'
          git push
