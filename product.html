<!doctype html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Produto | MarquesMater</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="v4.css"><link rel="stylesheet" href="v5.css"><link rel="stylesheet" href="v6.css"><link rel="stylesheet" href="v7.css"><link rel="stylesheet" href="v7.1.css"><link rel="stylesheet" href="v7.2.css"><link rel="stylesheet" href="v7.2.1.css"><link rel="stylesheet" href="v8.3.css"><link rel="stylesheet" href="v8.4.css"><link rel="stylesheet" href="v8.13.css"></head><body><div class="topbar">ENTREGA EM PORTUGAL CONTINENTAL · LEVANTAMENTO EM LOJA · APOIO AO CLIENTE</div><header><div class="container header-main"><a class="logo" href="index.html">MARQUES<b>MATER</b></a><div class="search"><input id="searchInput" placeholder="Pesquisar produtos, marcas ou referências..."><button onclick="doSearch()">⌕</button></div><div class="head-actions"><a href="account.html"><span>♙</span><small>Conta</small></a><a href="favorites.html"><span>♡</span><small>Favoritos</small></a><a href="cart.html"><span>🛒</span><small>Carrinho <b id="cartCount">0</b></small></a></div></div></header><nav><div class="container nav-inner" id="mainNav"></div></nav><main class="section"><div class="container"><div class="breadcrumbs"><a href="index.html">Início</a> / <a id="catLink">Categoria</a> / Produto</div><div class="product-detail v6-product" id="root">A carregar produto...</div><div class="tabs v6-tabs"><button class="active" type="button">Descrição</button><button type="button">Características</button><button type="button">Especificações</button><button type="button">Aplicações</button><button type="button">Documentação</button><button type="button">Avaliações</button></div><div class="tabbody" id="tabbody"></div></div></main><footer><div class="container copyright">© MarquesMater · Produto V9.10.12</div></footer><script src="js/catalog.js"></script><script src="js/v8.4-data.js"></script><script src="js/store.js"></script><script src="js/chat.js"></script><script src="js/v8.12-variant-engine.js"></script><script src="js/v8.13-buy.js"></script><script src="js/v89-tabs.js"></script><script>(async()=>{const params=new URLSearchParams(location.search),sku=params.get('sku')||'SIL001';let base=Array.isArray(window.MARQUES_CATALOG)?window.MARQUES_CATALOG:[];let p=base.find(x=>x.sku===sku)||null;try{const r=await fetch('/api/catalog/products?active=true',{cache:'no-store'});if(r.ok){const d=await r.json(),rows=Array.isArray(d)?d:(d.products||d.items||[]);const db=rows.find(x=>String(x.sku)===String(sku));if(db)p={...p,...db}}}catch(e){console.warn('Produto API indisponível',e)}if(!p){document.getElementById('root').innerHTML='<p>Produto não encontrado.</p>';return}p.options=p.options||{};p.specs=p.specs||[];p.image=p.image||'images/product-placeholder.svg';p.stockText=p.stockText||p.stock||'Em stock';p.description=p.description||'';document.title=p.name+' | MarquesMater';document.getElementById('mainNav').innerHTML=window.MM_NAV||'';document.getElementById('catLink').href='category.html?cat='+encodeURIComponent(p.category||'');document.getElementById('catLink').textContent=p.category||'Categoria';const variantImages=(window.MM_VARIANT_IMAGES||{})[p.sku]||{},variantPrices=(window.MM_VARIANT_PRICES||{})[p.sku]||{};let selections={},qtyValue=1;for(const [k,vals] of Object.entries(p.options)){selections[k]=variantPrices[k]?Object.keys(variantPrices[k])[0]:vals[0]}function money(n){return Number(n||0).toFixed(2).replace('.',',')}function currentPrice(){let price=Number(p.price||0);for(const [k,map] of Object.entries(variantPrices)){if(selections[k]&&map[selections[k]]!=null)price=Number(map[selections[k]])}return price}function currentImage(){for(const v of Object.values(selections)){if(variantImages[v])return variantImages[v]}return p.image}function choose(btn,value,key){selections[key]=value;btn.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');const img=document.getElementById('mainProductImage');if(img)img.src=currentImage();const price=document.getElementById('currentPrice');if(price)price.textContent=money(currentPrice())+' €'}function qty(x){qtyValue=Math.max(1,qtyValue+x);document.getElementById('qty').textContent=qtyValue}function add(){const opts={};Object.entries(selections).forEach(([k,v])=>opts[k]=v);if(window.MMStore)MMStore.addCart(p.sku,qtyValue,opts);else localStorage.setItem('mm_cart_count',Number(localStorage.getItem('mm_cart_count')||0)+qtyValue);document.getElementById('cartCount').textContent=localStorage.getItem('mm_cart_count')||0;alert('Produto adicionado ao carrinho.')}function optionBlock(k,vals){return `<div class="option v6-option"><label>${k}</label><div class="option-buttons">${vals.map(v=>`<button class="${selections[k]===v?'selected':''}" onclick="choose(this,${JSON.stringify(v)},${JSON.stringify(k)})">${v}</button>`).join('')}</div></div>`}window.choose=choose;window.qty=qty;window.add=add;window.doSearch=()=>{let x=document.getElementById('searchInput').value.trim();if(x)location.href='category.html?q='+encodeURIComponent(x)};const options=Object.entries(p.options).map(([k,v])=>optionBlock(k,v)).join(''),specs=p.specs.map(x=>{const a=String(x).split(':');return `<tr><td>${a[0]}</td><td>${a.slice(1).join(':').trim()}</td></tr>`}).join('');document.getElementById('root').innerHTML=`<section class="v6-gallery v83-gallery"><div class="v6-thumbs"><button class="active"><img src="${currentImage()}" alt=""></button></div><div class="gallery v6-main-image"><img id="mainProductImage" src="${currentImage()}" alt="${p.name}"></div></section><section class="details v6-details"><div class="v6-brand">${p.brand||''}</div><h1>${p.name}</h1><p class="v6-subtitle">${p.description}</p><div class="sku">Referência: <span>${p.sku}</span></div>${options}<div class="v6-buy"><div><div class="detail-price"><span id="currentPrice">${money(currentPrice())} €</span> <small>IVA incluído</small></div><div class="stock">● <span>${p.stockText}</span></div></div><div class="qty"><button onclick="qty(-1)">−</button><span id="qty">1</span><button onclick="qty(1)">+</button></div><button class="btn light big v6-cart" onclick="add()">🛒 ADICIONAR AO CARRINHO</button></div><div class="delivery">🚚 Entrega em Portugal Continental · 🏪 Levantamento em loja</div></section>`;document.getElementById('tabbody').innerHTML=`<p>${p.description}</p><table class="mm-spec-table">${specs}</table>`;document.getElementById('cartCount').textContent=localStorage.getItem('mm_cart_count')||0})();</script></body></html>
