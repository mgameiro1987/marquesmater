name: Finalizar T-Rex Power V25
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/limpar_soudal.py'
permissions:
  contents: write
jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Limpar e preparar dados
        run: python scripts/limpar_soudal.py
      - name: Ajustar front office
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('produto-wc.html'); s=p.read_text()
          s=re.sub(r'<script id="MM_TrexPower290JS">.*?</script>','',s,flags=re.S)
          js='''<script id="MM_TrexPowerFinalJS">(function(){let T=null,I=0;const path=v=>'/'+String(v.image||v.asset_image||'').replace(/^\\//,'');const bg=c=>{c=(c||'').toLowerCase();if(c.includes('preto'))return '#171717';if(c.includes('cinz'))return '#9da3a8';if(c.includes('bege'))return '#d7c2a2';if(c.includes('terracota'))return '#b65c43';if(c.includes('transpar'))return 'linear-gradient(135deg,#fff,#dfe8ef)';return '#fff'};function apply(){if(!T)return;let b=document.getElementById('priceBox');if(b)b.innerHTML='<div class="price">€ '+Number(T.price||12.95).toFixed(2).replace('.',',')+'</div>';document.querySelector('.stock')?.remove();let t=document.querySelector('.variant-title'),g=document.querySelector('.variant-grid');if(!t||!g)return;t.textContent='Escolha a cor';g.className='mm-trex-colors';g.innerHTML=T.variants.map((v,i)=>'<button type="button" class="mm-trex-color '+(i===I?'active':'')+'" data-i="'+i+'"><span class="mm-trex-dot" style="background:'+bg(v.color)+'"></span>'+v.color+'</button>').join('');g.querySelectorAll('.mm-trex-color').forEach(x=>x.onclick=()=>{I=Number(x.dataset.i);document.getElementById('mainImg').src=path(T.variants[I]);g.querySelectorAll('.mm-trex-color').forEach((z,k)=>z.classList.toggle('active',k===I))})}async function boot(){if(!/soudal-t-rex-power-290ml/i.test(new URLSearchParams(location.search).get('slug')||''))return;T=(await fetch('/data/soudal_products.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json())).products.find(x=>x.slug==='soudal-t-rex-power-290ml');if(!T)return;T.price=12.95;let n=0,q=setInterval(()=>{if(document.getElementById('priceBox')&&document.querySelector('.variant-grid')){apply();clearInterval(q)}else if(++n>40)clearInterval(q)},150)}boot()})();</script>'''
          p.write_text(s.replace('</body>',js+'</body>',1))
          c=Path('catalogo.html');s=c.read_text(); j='''<script id="MM_TrexCardFinal">(function(){function f(){document.querySelectorAll('.product').forEach(x=>{if(!(x.querySelector('h3')?.textContent||'').includes('T-Rex Power 290ml'))return;[...x.querySelectorAll('*')].forEach(e=>{let t=(e.textContent||'').trim();if(t==='Preço sob consulta')e.textContent='12,95 €';if(/^Disponibilidade/i.test(t)||t==='Ver produto →'||t==='Ver produto')e.remove()})}if(document.querySelector('.product'))f();new MutationObserver(f).observe(document.body,{childList:true,subtree:true})})();</script>''';c.write_text(s.replace('</body>',j+'</body>',1))
          PY
      - name: Validar
        run: python -m py_compile server.py scripts/limpar_soudal.py
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/soudal_products.json data/catalog.db produto-wc.html catalogo.html scripts/limpar_soudal.py
          git diff --cached --quiet && exit 0
          git commit -m "T-Rex Power final: preço, cores e limpeza Soudal"
          git push
