name: MarquesMater fix orders API

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch server.py
        shell: python
        run: |
          from pathlib import Path
          p = Path('server.py')
          s = p.read_text(encoding='utf-8')
          marker = 'server=ThreadingHTTPServer(("0.0.0.0",PORT),Handler)'
          injection = '''# MarquesMater — API admin de encomendas instalada diretamente no Handler.\ntry:\n    from orders_admin_api import install as _mm_install_orders_direct\n    _mm_install_orders_direct(Handler)\nexcept Exception as _mm_orders_error:\n    print('MarquesMater orders direct install error:', _mm_orders_error)\n\n'''
          if marker in s and 'API admin de encomendas instalada diretamente no Handler' not in s:
              p.write_text(s.replace(marker, injection + marker, 1), encoding='utf-8')
          else:
              print('server.py já corrigido ou marcador não encontrado')

      - name: Commit patch if changed
        shell: bash
        run: |
          git config user.name "MarquesMater Bot"
          git config user.email "actions@marquesmater.local"
          git add server.py
          if git diff --cached --quiet; then
            echo "Sem alterações no server.py"
          else
            git commit -m "V10.18 — ligar API de encomendas diretamente no server.py"
            git push
          fi

      - name: Test live orders API
        shell: bash
        run: |
          set -e
          for i in $(seq 1 18); do
            body=$(curl -fsS --max-time 10 https://marquesmater-7ap1.onrender.com/api/admin/orders || true)
            if printf '%s' "$body" | python -c 'import json,sys; x=json.load(sys.stdin); assert x.get("ok") is True and isinstance(x.get("orders"), list)' 2>/dev/null; then
              echo "GET /api/admin/orders respondeu JSON corretamente."
              break
            fi
            if [ "$i" = "18" ]; then exit 1; fi
            sleep 10
          done

      - name: Confirmar encomenda de teste real no Backoffice
        shell: bash
        run: |
          set -e
          body=$(curl -fsS --max-time 15 https://marquesmater-7ap1.onrender.com/api/admin/orders)
          printf '%s' "$body" | python -c 'import json,sys; x=json.load(sys.stdin); matches=[o for o in x.get("orders",[]) if o.get("data",{}).get("reference")=="TESTE-BACKOFFICE-V10.20"]; assert matches, "Encomenda de teste não encontrada"; print("ENCOMENDA TESTE ENCONTRADA:", matches[0]["id"], matches[0].get("status"))'
