name: V26 assets
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/v26-assets.yml']
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 scripts/v26_neuce_assets.py
      - run: python3 -m py_compile server.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'MarquesMater V26 - imagens e fichas Neuce' || true
          git push origin HEAD:main
