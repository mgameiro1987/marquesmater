name: MarquesMater live test
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test orders API read
        run: |
          set -e
          curl --fail --silent --show-error --max-time 15 https://marquesmater-7ap1.onrender.com/api/admin/orders -o orders.json
          python - <<'PY'
          import json
          j=json.load(open('orders.json'))
          assert j.get('ok') is True
          assert isinstance(j.get('orders'), list)
          print('GET orders OK:', len(j['orders']))
          PY
      - name: Test orders status write without changing visible state
        run: |
          set -e
          curl --fail --silent --show-error --max-time 15 -X POST https://marquesmater-7ap1.onrender.com/api/admin/orders/status -H 'Content-Type: application/json' --data '{"id":6,"status":"Concluída"}' -o status.json
          python - <<'PY'
          import json
          j=json.load(open('status.json'))
          assert j.get('ok') is True
          assert j.get('id') == 6
          assert j.get('status') == 'Concluída'
          print('POST status OK:', j)
          PY
      - name: Test catalog API read
        run: |
          set -e
          curl --fail --silent --show-error --max-time 15 https://marquesmater-7ap1.onrender.com/api/catalog?include_inactive=1 -o catalog.json
          python - <<'PY'
          import json
          j=json.load(open('catalog.json'))
          assert j.get('ok') is True
          assert isinstance(j.get('catalog'), list)
          print('GET catalog OK:', len(j['catalog']))
          PY
