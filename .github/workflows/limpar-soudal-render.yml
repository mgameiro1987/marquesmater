name: Corrigir Soudal no Render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir server.py para limpar Soudal antigo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.py')
          s = p.read_text(encoding='utf-8')
          marker = 'ensure_v19_catalog()\n'
          inject = '''ensure_v19_catalog()\n\ndef ensure_soudal_only_trex():\n    """Remove legacy Soudal products from persistent SQLite data, keeping only T-Rex Power 290ml."""\n    c = db()\n    c.execute("DELETE FROM products WHERE brand='Soudal' AND slug <> 'soudal-t-rex-power-290ml'")\n    c.execute("DELETE FROM brands WHERE name='Soudal'")\n    if c.execute("SELECT 1 FROM products WHERE brand='Soudal' LIMIT 1").fetchone():\n        c.execute("INSERT OR IGNORE INTO brands(name) VALUES('Soudal')")\n    c.commit()\n    c.close()\n\nensure_soudal_only_trex()\n'''
          if 'def ensure_soudal_only_trex()' not in s:
              if marker not in s:
                  raise SystemExit('Marcador ensure_v19_catalog() não encontrado')
              s = s.replace(marker, inject, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Aplicar NEUCE final
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request
          assets=Path('assets/neuce'); assets.mkdir(parents=True,exist_ok=True)
          urls={
            'neucebel':('https://templodastintas.pt/cdn/shop/files/neucebel.png?v=1705605720&width=533','.png'),
            'neucematt':('https://www.saniluz.pt/cdn/shop/files/5602920000587.jpg?v=1733586586','.jpg'),
            'neucesoft':('https://cdn-shopkit.com/usercontent/tintas-vital/media/images/square/37a3a6a-neucesoft.jpeg','.jpg')}
          for slug,(url,ext) in urls.items():
              out=assets/(slug+ext)
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              data=urllib.request.urlopen(req,timeout=30).read()
              if len(data)<1000: raise SystemExit('Imagem inválida: '+slug)
              out.write_bytes(data)
          p=Path('catalogo.html'); s=p.read_text(encoding='utf-8')
          for old,new in {'https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucebel-600x638.png':'assets/neuce/neucebel.png','https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucematt-600x638.png':'assets/neuce/neucematt.jpg','https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucesoft-600x638.png':'assets/neuce/neucesoft.jpg'}.items(): s=s.replace(old,new)
          if 'MM-NEUCE-FINAL' not in s:
              patch='<style id="MM-NEUCE-FINAL">body.mm-neuce-final .more{display:none!important}</style><script>(function(){function f(){var p=new URLSearchParams(location.search);if(p.get("cat")!=="Pinturas")return;document.body.classList.add("mm-neuce-final");document.querySelectorAll("#grid .product").forEach(function(c){var n=(c.querySelector("h3")||{}).textContent||"";var v={"NeuceBel":"89,90 €","NeuceMatt":"69,90 €","NeuceSoft":"129,90 €"}[n.trim()];if(v){var q=c.querySelector(".price");if(q)q.textContent=v;var m=c.querySelector(".more");if(m)m.remove()}})}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){setTimeout(f,200);setTimeout(f,1000)});else{setTimeout(f,200);setTimeout(f,1000)}})();</script>'
              s=s.replace('</body>',patch+'</body>')
          p.write_text(s,encoding='utf-8')
          p=Path('server.py'); s=p.read_text(encoding='utf-8')
          if 'MM-NEUCE-FINAL-SERVER' not in s:
              fn='''\n# MM-NEUCE-FINAL-SERVER\ndef ensure_neuce_final():\n    c=db()\n    vals={"neucebel":(89.9,"89,90 €","assets/neuce/neucebel.png"),"neucematt":(69.9,"69,90 €","assets/neuce/neucematt.jpg"),"neucesoft":(129.9,"129,90 €","assets/neuce/neucesoft.jpg")}\n    for slug,(price,display,image) in vals.items():\n        c.execute("UPDATE products SET price=?, price_display=?, image=?, updated_at=CURRENT_TIMESTAMP WHERE slug=?",(price,display,image,slug))\n    c.execute("INSERT OR IGNORE INTO brands(name) VALUES(?)",("NEUCE",))\n    c.commit(); c.close()\n\n'''
              pos=s.rfind('ensure_v26_runtime_fixes()')
              if pos<0: raise SystemExit('startup marker não encontrado')
              s=s[:pos]+fn+'ensure_neuce_final()\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar Python e assets
        run: |
          python3 -m py_compile server.py
          test -s assets/neuce/neucebel.png
          test -s assets/neuce/neucematt.jpg
          test -s assets/neuce/neucesoft.jpg

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py catalogo.html assets/neuce
          if git diff --cached --quiet; then echo "Sem alterações"; else git commit -m "NEUCE final: imagens locais, preços e sem Ver produto"; git push origin main; fi
