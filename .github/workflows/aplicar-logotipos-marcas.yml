name: Aplicar logotipos reais das marcas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  brands:
    if: ${{ !contains(github.event.head_commit.message, 'Aplicar logotipos reais') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar estilos dos logotipos
        run: |
          mkdir -p assets
          cat > assets/brand-logos.css <<'EOF'
          /* MarquesMater — logotipos reais das marcas */
          .brands-featured{background:#fff;padding:42px 0}
          .brands-featured .brands-grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
          .brands-featured .brand-tile{min-height:112px;border:1px solid #e1e5e9;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;box-shadow:0 3px 12px rgba(17,21,27,.06);transition:transform .18s,border-color .18s,box-shadow .18s}
          .brands-featured .brand-tile:hover{transform:translateY(-3px);border-color:#cfd5dd;box-shadow:0 12px 28px rgba(17,21,27,.1)}
          .brands-featured .brand-tile strong,.brands-featured .brand-tile small{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
          .brands-featured .brand-tile:before{content:"";display:block;width:100%;height:66px;background-repeat:no-repeat;background-position:center;background-size:contain}
          .brands-featured .brand-tile:nth-child(1):before{background-image:url('/assets/rida-logo.png')}
          .brands-featured .brand-tile:nth-child(2):before{background-image:url('https://supplymaster.store/cdn/shop/collections/10013748_781002805280107_6928551319780305804_n_1.jpg?v=1627140638&width=1296')}
          .brands-featured .brand-tile:nth-child(3):before{background-image:url('https://images.tcdn.com.br/img/img_prod/1206448/espuma_expansiva_pro_foam_340_soudal_500ml_3093_2_c5ccba014714e485173f80a976f243fb.jpg')}
          .brands-featured .brand-tile:nth-child(4):before{background-image:url('https://www.developmentaid.org/files/organizationLogos/leega-power-and-tools-505312.jpg')}
          .brands-featured .brand-tile:nth-child(5):before{background-image:url('https://upload.wikimedia.org/wikipedia/commons/c/c3/Bosch_logo.png')}
          .brands-featured .brand-tile:nth-child(6):before{background-image:url('https://gereed3d.nl/cdn/shop/collections/Makita.png?v=1732651049')}
          @media(max-width:900px){.brands-featured .brands-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
          @media(max-width:520px){.brands-featured .brands-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.brands-featured .brand-tile{min-height:96px;padding:14px}.brands-featured .brand-tile:before{height:58px}}
          EOF
      - name: Ligar estilos à homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          link='<link rel="stylesheet" href="assets/brand-logos.css">'
          if 'assets/brand-logos.css' not in s:
              s=s.replace('</head>',link+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit e push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand-logos.css index.html
          git diff --cached --quiet || git commit -m 'Aplicar logotipos reais das marcas'
          git push
