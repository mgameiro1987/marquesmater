name: Criar backup completo da base de dados
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Criar ZIP de backup
        run: |
          set -e
          mkdir -p backup-MarquesMater/data
          cp data/catalog.db backup-MarquesMater/data/catalog.db
          cp data/admin.json backup-MarquesMater/data/admin.json
          cp data/site_data.json backup-MarquesMater/data/site_data.json
          cp data/soudal_products.json backup-MarquesMater/data/soudal_products.json
          cp rida-products.json backup-MarquesMater/rida-products.json
          printf '%s\n' 'BACKUP COMPLETO DA BASE DE DADOS MARQUESMATER' 'Contém a base SQLite catalog.db e todos os ficheiros de dados usados pelo site/Back Office.' 'O catalog.db é a base de dados principal.' > backup-MarquesMater/LEIA-ME.txt
          sha256sum backup-MarquesMater/data/catalog.db backup-MarquesMater/data/admin.json backup-MarquesMater/data/site_data.json backup-MarquesMater/data/soudal_products.json backup-MarquesMater/rida-products.json > backup-MarquesMater/CHECKSUMS-SHA256.txt
          cd backup-MarquesMater
          zip -r ../MarquesMater_BACKUP_BASE_DADOS_COMPLETO.zip .
      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: MarquesMater_BACKUP_BASE_DADOS_COMPLETO
          path: MarquesMater_BACKUP_BASE_DADOS_COMPLETO.zip
          retention-days: 90
      - name: Apagar workflow temporário
        run: |
          rm -f .github/workflows/backup-base-dados.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Guardar backup completo da base de dados MarquesMater'
          git push