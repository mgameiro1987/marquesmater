name: Finalizar homepage tópicos 1 a 5
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/finalizar-home-1-5.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar estrutura definitiva 1 a 5
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.')
          # 1 = menu principal: apenas as 4 famílias definidas.
          # 3 = cartões de categorias: todas as famílias ficam visíveis.
          p=root/'data/site_data.json'
          d=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          menu={'Ferramentas','Pinturas','Máquinas','Colas e Selantes'}
          fams=d.get('families') or []
          for f in fams:
              name=f.get('name','')
              f['show_menu']=name in menu
              f['show_top']=False
              f['show_bottom']=True
          d.setdefault('settings',{})['visibility_mode']='menu_and_featured_categories_separate_persistent'
          d['families']=fams
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # 1 e 3 no Back Office: dois controlos independentes e permanentes.
          # O menu tem 4; os cartões têm todas as categorias. Não usamos mais a distinção acima/abaixo.
          p=root/'admin.html'; s=p.read_text(encoding='utf-8')
          start=s.find('function renderFamilies(){')
          end=s.find('let familyIconModalIndex=',start)
          if start<0 or end<0: raise SystemExit('renderFamilies não encontrado')
          new_fn=r'''function renderFamilies(){let a=DATA.families||[];a.forEach(f=>{f.icon=f.icon||familyDefaultIcon(f.name);if(typeof f.show_menu!=='boolean')f.show_menu=true;if(typeof f.show_top!=='boolean')f.show_top=true;f.show_bottom=f.show_top});$('families').innerHTML=`<div class="panel" style="background:#f8fafb"><div class="toolbar" style="margin-bottom:0"><div><h3 style="margin-bottom:4px">Famílias e subfamílias</h3><span class="muted">A visibilidade é guardada de forma permanente. O menu principal e os cartões de categorias são controlados separadamente.</span></div><button class="btn primary" onclick="openFamilyIconLibrary(-1)">🖼️ Biblioteca de ícones</button></div></div>`+a.map((f,i)=>`<div class="panel family-admin-card"><div class="toolbar" style="margin-bottom:0"><div style="display:flex;gap:12px;align-items:center;min-width:0"><div class="family-admin-icon">${iconImg(f.icon)}</div><div><h3 style="margin-bottom:4px">${esc(f.name)}</h3><span class="muted">${(f.subs||[]).length} subfamílias</span></div></div><div class="family-actions"><button class="btn" onclick="openFamilyIconLibrary(${i})">🖼️ Alterar ícone</button><button class="btn" onclick="editFamily(${i})">Editar</button><button class="btn danger" onclick="delFamily(${i})">Apagar</button></div></div><div class="family-visibility-row"><label class="setting-option"><input type="checkbox" ${f.show_menu?'checked':''} onchange="setFamilyVisibility(${i},'show_menu',this.checked)"><span><b>1 — Mostrar no menu principal</b><small>Categoria em texto na barra acima do banner.</small></span></label><label class="setting-option"><input type="checkbox" ${f.show_top?'checked':''} onchange="setFamilyVisibility(${i},'show_top',this.checked);DATA.families[${i}].show_bottom=this.checked;persistFamilies()"><span><b>3 — Mostrar nas categorias em destaque</b><small>Cartão com ícone e nome na homepage.</small></span></label></div><div class="family-subs">${(f.subs||[]).map((x,j)=>`<span class="pill">${esc(x)} <button style="border:0;background:none" onclick="delSub(${i},${j})">×</button></span>`).join(' ')||'<span class="muted">Sem subfamílias</span>'}</div><div style="margin-top:12px"><button class="btn" onclick="addSub(${i})">+ Subfamília</button></div></div>`).join('');if($('catFamilyCount'))$('catFamilyCount').textContent=a.length;if($('catSubCount'))$('catSubCount').textContent=a.reduce((n,f)=>n+(f.subs||[]).length,0);if($('catMenuCount'))$('catMenuCount').textContent=a.filter(f=>f.show_menu).length;if($('catCardCount'))$('catCardCount').textContent=a.filter(f=>f.show_top).length}'''
          s=s[:start]+new_fn+'\n'+s[end:]
          # Garantir que a caixa de cartões sincroniza os dois campos antigos.
          s=s.replace("async function setFamilyVisibility(i,key,value){const f=DATA.families?.[i];if(!f)return;f[key]=!!value;await persistFamilies();}","async function setFamilyVisibility(i,key,value){const f=DATA.families?.[i];if(!f)return;f[key]=!!value;if(key==='show_top')f.show_bottom=!!value;await persistFamilies();renderFamilies();}")
          p.write_text(s,encoding='utf-8')

          # 2 = banner/carrossel continua controlado pelo Back Office; apenas garantir o título/ordem visual.
          p=root/'index.html'; s=p.read_text(encoding='utf-8')
          # 3: se existir uma secção superior vazia, escondê-la. A secção completa de categorias permanece.
          inject="""<script>(function(){function mmCleanHome(){document.querySelectorAll('.families-section').forEach(function(sec){var cards=sec.querySelectorAll('.family-card');if(cards.length===0)sec.style.display='none';});}window.addEventListener('load',mmCleanHome);})();</script>"""
          if 'mmCleanHome' not in s:
              s=s.replace('</body>',inject+'</body>') if '</body>' in s else s+inject
          # 4: garantir limite de 8 produtos na secção RIDA.
          s=s.replace("slice(0,6)).map(card)","slice(0,8)).map(card)")
          s=s.replace("slice(0,6)).map(card)","slice(0,8)).map(card)")
          s=s.replace(":(rida||[]).slice(0,6)",":(rida||[]).slice(0,8)")
          # 5: marcas em destaque, local e leve, antes do rodapé.
          if 'id="brands-featured"' not in s:
              brands='''<section class="brands-featured" id="brands-featured"><div class="container"><div class="section-head"><div><div class="eyebrow">AS NOSSAS MARCAS</div><h2>Marcas em destaque</h2></div><a class="section-link" href="catalogo.html?brand=RIDA">Ver todas as marcas →</a></div><div class="brands-grid"><a class="brand-tile" href="catalogo-rida.html"><strong>RIDA</strong><small>Ferramentas</small></a><a class="brand-tile" href="catalogo.html?brand=NEUCE"><strong>NEUCE</strong><small>Pinturas</small></a><a class="brand-tile" href="catalogo.html?brand=Soudal"><strong>SOUDAL</strong><small>Colas e Selantes</small></a><a class="brand-tile" href="catalogo.html?brand=VITO"><strong>VITO</strong><small>Ferramentas e Jardim</small></a><a class="brand-tile" href="catalogo.html?brand=Bosch"><strong>BOSCH</strong><small>Ferramentas</small></a><a class="brand-tile" href="catalogo.html?brand=Makita"><strong>Makita</strong><small>Ferramentas</small></a></div></div></section>'''
              css='''<style>.brands-featured{padding:34px 0;background:#fff}.brands-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.brand-tile{min-height:82px;border:1px solid #e1e5e9;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#16212b;box-shadow:0 2px 8px #00000008}.brand-tile strong{font-size:24px;font-weight:950;letter-spacing:-.04em}.brand-tile small{margin-top:5px;color:#7a858d;font-size:11px}.brand-tile:hover{border-color:#f28c00;transform:translateY(-1px)}@media(max-width:800px){.brands-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:480px){.brands-grid{grid-template-columns:repeat(2,1fr)}}</style>'''
              s=s.replace('</head>',css+'</head>') if '</head>' in s else css+s
              s=s.replace('</main>',brands+'</main>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: python3 -m py_compile server.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/site_data.json admin.html index.html
          git commit -m 'MarquesMater V26 - homepage definitiva 1 a 5' || true
          git push origin HEAD:main
