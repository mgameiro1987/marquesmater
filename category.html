<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo | MarquesMater</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="v5.css"><link rel="stylesheet" href="v7.css"><link rel="stylesheet" href="v7.1.css"><link rel="stylesheet" href="v7.2.css"><link rel="stylesheet" href="v7.2.1.css"><link rel="stylesheet" href="v7.2.2.css"><link rel="stylesheet" href="v8.2.css"><link rel="stylesheet" href="v8.3.css"><link rel="stylesheet" href="v8.4.css"></head><body><div class="top">ENTREGA EM PORTUGAL CONTINENTAL · LEVANTAMENTO EM LOJA · APOIO AO CLIENTE</div><header><div class="wrap head"><a class="logo" href="index.html">MARQUES<span>MATER</span></a><div class="search"><input id="q" placeholder="Pesquisar produtos, marcas ou referências..."><button onclick="goSearch()">⌕</button></div><div class="actions"><a href="#">♙<small>Conta</small></a><a href="#">♡<small>Favoritos</small></a><a href="cart.html">🛒<small>Carrinho <b id="cartCount">0</b></small></a></div></div></header><nav><div class="wrap nav" id="nav"></div></nav><main class="wrap section"><div class="crumb"><a href="index.html">Início</a> / Catálogo</div><span class="eyebrow dark">CATÁLOGO · V8.4</span><h1 id="title">Produtos</h1><p id="intro"></p><div class="subcats" id="subcats"></div><div class="tools"><span id="count"></span><select id="sort"><option value="featured">Destaques</option><option value="low">Preço mais baixo</option><option value="high">Preço mais alto</option></select></div><div class="products" id="products"></div></main><footer><div class="copy">© MarquesMater · V8.4</div></footer><script src="js/catalog.js"></script><script src="js/v8.4-data.js"></script><script src="js/chat.js"></script><script>document.getElementById('nav').innerHTML=MM_CATEGORIES.map(c=>`<a href="category.html?cat=${encodeURIComponent(c)}">${c}</a>`).join('');const ps=new URLSearchParams(location.search),q=(ps.get('q')||'').toLowerCase(),cat=ps.get('cat')||'Construção';document.getElementById('title').textContent=q?'Resultados da pesquisa':'Comprar '+cat;document.getElementById('intro').textContent=q?'Resultados locais para “'+q+'”.':'Escolhe uma subcategoria e abre cada produto para ver as opções técnicas.';let current='';const subs=MM_SUBCATEGORIES[cat]||[];document.getElementById('subcats').innerHTML=subs.map(s=>`<button onclick="filterSub('${s.replace(/'/g,"\\'")}',this)">${s}</button>`).join('');function money(n){return Number(n).toFixed(2).replace('.',',')+' €'}function minPrice(p){const m=MM_VARIANT_PRICES[p.sku];if(m){const vals=Object.values(m).flatMap(x=>Object.values(x));if(vals.length)return Math.min(...vals)}return p.price}function cardPrice(p){const min=minPrice(p),has=MM_VARIANT_PRICES[p.sku]||((p.options&&p.options['Embalagem']&&p.options['Embalagem'].length>1)?{'Embalagem':p.options['Embalagem']}:null);return has?`<div class="v84-price">Desde ${money(min)} <small>IVA incluído</small></div><div class="v84-variants">${Object.values(has)[0].length} opções disponíveis</div>`:`<div class="v84-price">${money(p.price)} <small>IVA incluído</small></div>`}function addQuick(p){let old=Number(localStorage.getItem('mm_cart_count')||0);localStorage.setItem('mm_cart_count',old+1);document.getElementById('cartCount').textContent=old+1}function fav(sku,btn){let f=JSON.parse(localStorage.getItem('mm_favs')||'[]');f=f.includes(sku)?f.filter(x=>x!==sku):[...f,sku];localStorage.setItem('mm_favs',JSON.stringify(f));btn.classList.toggle('active');btn.textContent=btn.classList.contains('active')?'♥':'♡'}function render(){let a=MARQUES_CATALOG.filter(p=>q?(p.name+' '+p.brand+' '+p.category+' '+p.subcategory).toLowerCase().includes(q):p.category===cat);if(current)a=a.filter(p=>p.subcategory===current);let s=document.getElementById('sort').value;if(s==='low')a.sort((x,y)=>minPrice(x)-minPrice(y));if(s==='high')a.sort((x,y)=>minPrice(y)-minPrice(x));document.getElementById('count').textContent=a.length+' produto(s)';const fs=JSON.parse(localStorage.getItem('mm_favs')||'[]');document.getElementById('products').innerHTML=a.length?a.map(p=>`<article class="product v84-card"><button class="v84-fav ${fs.includes(p.sku)?'active':''}" onclick="event.preventDefault();event.stopPropagation();fav('${p.sku}',this)" aria-label="Favorito">${fs.includes(p.sku)?'♥':'♡'}</button><a href="product.html?sku=${encodeURIComponent(p.sku)}"><div class="product-media">${p.badge?`<em>${p.badge}</em>`:''}<img src="${p.image}" alt="${p.name}"></div><div><small>${p.brand}</small><h3>${p.name}</h3>${cardPrice(p)}<div class="v83-card-actions"><span class="v83-stock">● ${p.stock}</span><button class="v84-add" onclick="event.preventDefault();event.stopPropagation();addQuick(${JSON.stringify(p).replace(/</g,'\\u003c')})">ADICIONAR AO CARRINHO</button></div></div></a></article>`).join(''):'<p>Nenhum produto encontrado.</p>'}function filterSub(s,btn){current=current===s?'':s;document.querySelectorAll('.subcats button').forEach(b=>b.classList.remove('active'));if(current&&btn)btn.classList.add('active');render()}document.getElementById('sort').onchange=render;function goSearch(){let x=document.getElementById('q').value.trim();if(x)location.href='category.html?q='+encodeURIComponent(x)}document.getElementById('cartCount').textContent=localStorage.getItem('mm_cart_count')||0;render();</script></body></html>
