name: Corrigir Pinturas NEUCE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir página Pinturas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('catalogo.html')
          s=p.read_text(encoding='utf-8')

          marker='''function renderNeucePinturas(){'''
          block='''function renderNeucePinturas(){
 const grid=document.getElementById('grid');
 const items=[
  {slug:'neucebel',name:'NeuceBel',price:'Desde 89,00 €',image:'https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucebel-600x638.png'},
  {slug:'neucematt',name:'NeuceMatt',price:'Desde 79,00 €',image:'https://www.saniluz.pt/cdn/shop/files/5602920000587.jpg?v=1733586586'},
  {slug:'neucesoft',name:'NeuceSoft',price:'Desde 129,00 €',image:'https://cdn-shopkit.com/usercontent/tintas-vital/media/images/square/37a3a6a-neucesoft.jpeg'}
 ];
 grid.innerHTML=items.map(x=>`<a class="product neuce-simple-card" href="produto-wc.html?slug=${encodeURIComponent(x.slug)}"><div class="pimg"><img src="${esc(x.image)}" alt="${esc(x.name)}" loading="lazy" onerror="this.onerror=null;this.src='/assets/paint-placeholder.svg'"></div><div class="pbody"><small>NEUCE · PINTURAS</small><h3>${esc(x.name)}</h3><div class="price">${esc(x.price)}</div></div></a>`).join('');
 document.getElementById('count').textContent='3 produtos NEUCE';
 document.getElementById('pager').innerHTML='';
}
'''
          if marker not in s:
              s=s.replace('function sortList(list,sort){',block+'function sortList(list,sort){',1)

          # Load Pinturas immediately, without waiting for /api/site. This prevents
          # a slow/locked persistent database from leaving the page stuck on "A carregar catálogo...".
          old_start='''async function init(){try{const site=await fetch('/api/site').then(r=>r.json());'''
          new_start='''async function init(){
 const sp=new URLSearchParams(location.search); const requested=sp.get('cat')||'', requestedSub=sp.get('sub')||'', requestedBrand=sp.get('brand')||'';
 document.getElementById('q').value=sp.get('q')||''; window.initialSub=requestedSub;
 if(requested==='Pinturas'){
   document.getElementById('cat').value='Pinturas';
   try{document.getElementById('brand').value=requestedBrand}catch(e){}
   renderNeucePinturas();
   return;
 }
 try{const site=await fetch('/api/site',{cache:'no-store'}).then(r=>r.json());'''
          if old_start in s:
              s=s.replace(old_start,new_start,1)
          # Remove duplicated URLSearchParams declaration left by the old init tail.
          s=s.replace(" const sp=new URLSearchParams(location.search); document.getElementById('q').value=sp.get('q')||''; const requested=sp.get('cat')||'', requestedSub=sp.get('sub')||'', requestedBrand=sp.get('brand')||''; document.getElementById('cat').value=requested; window.initialSub=requestedSub; try{document.getElementById('brand').value=requestedBrand}catch(e){} try{rida=await fetch(ridaUrl).then(x=>x.json())}catch(e){rida=[]} load(1);", " document.getElementById('cat').value=requested; try{document.getElementById('brand').value=requestedBrand}catch(e){} try{rida=await fetch(ridaUrl).then(x=>x.json())}catch(e){rida=[]} load(1);")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q 'renderNeucePinturas' catalogo.html
          grep -q 'Desde 89,00 €' catalogo.html
          grep -q 'Desde 79,00 €' catalogo.html
          grep -q 'Desde 129,00 €' catalogo.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogo.html
          git diff --cached --quiet || git commit -m 'MarquesMater V26 - corrigir página Pinturas NEUCE'
          git push
