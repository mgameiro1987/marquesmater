name: Corrigir RIDA na página principal

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/corrigir-rida-home.yml'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preencher grelha RIDA com 12 produtos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- MM-RIDA-HOME-12-FIX -->'
          if marker in s:
              print('RIDA fix já aplicado')
              raise SystemExit(0)
          payload=r'''<!-- MM-RIDA-HOME-12-FIX -->
          <style>
          #rida-featured{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:14px!important;align-items:stretch!important}
          #rida-featured .product-card{min-width:0!important;height:100%!important}
          #rida-featured .product-card img{width:100%!important;aspect-ratio:1/1!important;object-fit:contain!important}
          @media(max-width:900px){#rida-featured{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
          @media(max-width:600px){#rida-featured{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}}
          </style>
          <script>
          (function(){
            async function fillRida(){
              const grid=document.getElementById('rida-featured');
              if(!grid)return;
              try{
                const r=await fetch('/api/products?limit=100',{cache:'no-store'});
                const data=await r.json();
                const all=Array.isArray(data)?data:(data.products||data.items||[]);
                const products=all.filter(p=>String(p.brand||'').trim().toUpperCase()==='RIDA').slice(0,12);
                if(products.length<9){console.warn('RIDA: apenas '+products.length+' produtos disponíveis');return;}
                const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
                const img=v=>{v=String(v||'').trim();if(!v)return '/assets/paint-placeholder.svg';if(v.startsWith('/'))return v;if(/^https?:\\/\\//i.test(v))return v;return '/'+v.replace(/^\\.\\//,'')};
                const money=v=>{const n=Number(v);return Number.isFinite(n)?n.toLocaleString('pt-PT',{style:'currency',currency:'EUR'}):esc(v||'Preço sob consulta')};
                grid.innerHTML=products.map(p=>{
                  const slug=esc(p.slug||p.id||'');
                  const href='produto.html?slug='+encodeURIComponent(p.slug||'');
                  return `<article class="product-card"><a href="${href}" class="product-image"><img src="${esc(img(p.image))}" alt="${esc(p.name||'Produto RIDA')}" loading="lazy"></a><div class="product-body"><small class="brand">RIDA</small><h3>${esc(p.name||'')}</h3><strong class="price">${money(p.price_display||p.price)}</strong><a class="more" href="${href}">Ver produto →</a></div></article>`;
                }).join('');
              }catch(e){console.warn('RIDA home fix:',e)}
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fillRida);else fillRida();
            setTimeout(fillRida,500);
          })();
          </script>'''
          if '</body>' not in s:
              raise SystemExit('index.html sem </body>')
          s=s.replace('</body>',payload+'</body>',1)
          p.write_text(s,encoding='utf-8')
          print('RIDA home fix aplicado')
          PY
      - name: Validar
        run: |
          grep -q 'MM-RIDA-HOME-12-FIX' index.html
          grep -q 'slice(0,12)' index.html
      - name: Commit e push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Corrigir grelha RIDA na página principal com 12 produtos'
          git push