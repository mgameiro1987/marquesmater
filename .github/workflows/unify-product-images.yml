name: Unificar imagens Back Office catalogo produto
on:
  push:
    paths:
      - '.github/workflows/unify-product-images.yml'
permissions:
  contents: write
jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar arquitetura unica de imagens
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ---------------- admin.html ----------------
          p=Path('admin.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('Podes colocar URLs existentes ou carregar ficheiros do PC. A primeira imagem será a principal.','A imagem na <b>posição 1</b> é sempre a imagem principal. A mesma ordem é usada no catálogo, na página do produto e nos produtos relacionados. Podes ter até 4 imagens e alterar a ordem com os botões ↑ ↓.')
          css='''\n<style id="MM_GalleryOrderCSS">\n.mm-gallery-item{display:grid;grid-template-columns:70px 86px 1fr auto;gap:10px;align-items:center;border:1px solid #e0e5e9;border-radius:12px;padding:10px;margin:8px 0;background:#fff}.mm-gallery-pos{font-weight:950;text-align:center;color:#17212b;font-size:12px}.mm-gallery-pos small{display:block;color:#f28c00;font-size:9px;margin-top:3px}.mm-gallery-preview{width:78px;height:78px;border:1px solid #e0e5e9;border-radius:9px;background:#f7f8fa;display:flex;align-items:center;justify-content:center;overflow:hidden}.mm-gallery-preview img{width:100%;height:100%;object-fit:contain}.mm-gallery-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.mm-gallery-actions button{min-width:36px}.mm-gallery-main{border-color:#f28c00;box-shadow:0 0 0 2px #f28c0014}\n@media(max-width:700px){.mm-gallery-item{grid-template-columns:52px 64px 1fr}.mm-gallery-preview{width:62px;height:62px}.mm-gallery-actions{grid-column:1/-1;justify-content:flex-start}.mm-gallery-actions button{flex:1}}\n</style>\n'''
          if 'MM_GalleryOrderCSS' not in s:
              s=s.replace('</head>',css+'</head>',1)
          new_gallery=r'''function galleryValues(){return [...document.querySelectorAll('#gallery .g')].map(x=>x.value.trim()).filter(Boolean)}
          function renderGallery(a){a=(a||[]).filter(Boolean).slice(0,4);$('gallery').innerHTML=a.map((x,i)=>`<div class="mm-gallery-item ${i===0?'mm-gallery-main':''}"><div class="mm-gallery-pos">POSIÇÃO ${i+1}<small>${i===0?'★ PRINCIPAL':'GALERIA'}</small></div><div class="mm-gallery-preview"><img src="${esc(x)}" alt="" onerror="this.style.opacity='.25'"></div><input class="input g" value="${esc(x)}" placeholder="URL da imagem" oninput="this.parentNode.querySelector('img').src=this.value"><div class="mm-gallery-actions"><button class="btn" onclick="moveGallery(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="btn" onclick="moveGallery(${i},1)" ${i===a.length-1?'disabled':''}>↓</button><button class="btn danger" onclick="removeGallery(${i})">Apagar</button></div></div>`).join('');$('gallery').dataset.count=String(a.length)}
          function addGallery(){const a=galleryValues();if(a.length>=4){alert('Podes definir no máximo 4 imagens por produto.');return}a.push('');renderGallery(a)}
          function moveGallery(i,d){const a=galleryValues();const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];renderGallery(a)}
          function removeGallery(i){const a=galleryValues();a.splice(i,1);renderGallery(a)}
          '''
          s2=re.sub(r'function renderGallery\(a\).*?function renderVariants',new_gallery+'function renderVariants',s,flags=re.S)
          if s2==s: raise SystemExit('Não foi possível localizar renderGallery no admin.html')
          s=s2
          s=s.replace("renderGallery(p.gallery||[]);", "renderGallery((p.gallery&&p.gallery.length?p.gallery:(p.image?[p.image]:[])).slice(0,4));")
          # ---------------- catalogo.html ----------------
          p=Path('catalogo.html'); c=p.read_text(encoding='utf-8')
          old="const p=localBySlug[x.slug];return p?{...x,...p,price_display:p.price,image:p.image}:x;"
          new="const p=localBySlug[x.slug];return p?{...p,...x,price_display:x.price_display||p.price,image:(x.gallery?.[0]||x.images?.[0]?.src||x.image||p.image),gallery:(x.gallery?.length?x.gallery:(p.gallery||[]))}:x;"
          if old not in c: raise SystemExit('Merge do catalogo não encontrado')
          c=c.replace(old,new)
          c=c.replace("let eur=p.price_display||'Consultar',img=p.images?.[0]?.src||p.image||'';", "let eur=p.price_display||'Consultar',img=p.gallery?.[0]||p.images?.[0]?.src||p.image||'';")
          c=re.sub(r'<script>\/\* MM-NEUCEMATT-CATALOG-FINAL \*/.*?<!-- MM-NEUCEMATT-CATALOG-FINAL -->\s*', '', c, flags=re.S)
          p.write_text(c,encoding='utf-8')
          # ---------------- produto-wc.html ----------------
          p=Path('produto-wc.html'); q=p.read_text(encoding='utf-8')
          q=q.replace("const images=(P.gallery?.length?P.gallery:[P.image].filter(Boolean));", "const images=(P.gallery?.length?P.gallery:[P.image].filter(Boolean));")
          q=q.replace("x.image||x.gallery?.[0]", "x.gallery?.[0]||x.image")
          q=q.replace("P.image||P.gallery?.[0]", "P.gallery?.[0]||P.image")
          q=re.sub(r'<script id="MM_NEUCE_PRODUCT_LOCAL">.*?</script>\s*', '', q, flags=re.S)
          p.write_text(q,encoding='utf-8')
          # ---------------- server.py ----------------
          p=Path('server.py'); srv=p.read_text(encoding='utf-8')
          # Preserve existing media when startup seed data has no media.
          needle="""slug=str(p.get('slug') or p.get('id') or '').strip()\n if not slug:return\n price=num"""
          repl="""slug=str(p.get('slug') or p.get('id') or '').strip()\n if not slug:return\n existing=c.execute('SELECT image,gallery_json,variants_json,docs_json,related_json,price_display,description,tech FROM products WHERE slug=?',(slug,)).fetchone()\n if existing:\n  ex=dict(existing)\n  if not p.get('image') and not p.get('gallery'):\n   p['image']=ex.get('image') or ''\n   try:p['gallery']=json.loads(ex.get('gallery_json') or '[]')\n   except:p['gallery']=[]\n  if not p.get('variants'):\n   try:p['variants']=json.loads(ex.get('variants_json') or '[]')\n   except:p['variants']=[]\n  if not p.get('docs'):\n   try:p['docs']=json.loads(ex.get('docs_json') or '[]')\n   except:p['docs']=[]\n  if not p.get('related'):\n   try:p['related']=json.loads(ex.get('related_json') or '[]')\n   except:p['related']=[]\n  if p.get('price_display') in ('','Preço por variante',None) and ex.get('price_display'):p['price_display']=ex['price_display']\n price=num"""
          if needle not in srv: raise SystemExit('put_product não encontrado')
          srv=srv.replace(needle,repl,1)
          # Make API image always equal gallery position 1.
          needle=""" for k,j in [('gallery','gallery_json'),('docs','docs_json'),('variants','variants_json'),('related','related_json')]:\n  try:p[k]=json.loads(p.get(j) or '[]')\n  except:p[k]=[]\n\n def official_image"""
          repl=""" for k,j in [('gallery','gallery_json'),('docs','docs_json'),('variants','variants_json'),('related','related_json')]:\n  try:p[k]=json.loads(p.get(j) or '[]')\n  except:p[k]=[]\n if not p.get('gallery') and p.get('image'):p['gallery']=[p['image']]\n if p.get('gallery'):p['image']=p['gallery'][0]\n\n def official_image"""
          if needle not in srv: raise SystemExit('row_product não encontrado')
          srv=srv.replace(needle,repl,1)
          # Seed real NEUCE images so a fresh/empty DB also follows the same model.
          srv=srv.replace("'slug':'neucebel','name':'NeuceBel'", "'slug':'neucebel','name':'NeuceBel'")
          srv=srv.replace("'price_display':'Preço por variante','stock':0,'image':'assets/paint-placeholder.svg'", "'price_display':'Preço por variante','stock':0,'image':'assets/neucebel-real.jpg','gallery':['assets/neucebel-real.jpg','assets/neucebel-normal.svg']")
          srv=srv.replace("'price_display':'Preço por variante','stock':0,'description':'Tinta plástica mate", "'price_display':'Preço por variante','stock':0,'image':'assets/neucematt-real.png','gallery':['assets/neucematt-real.png','assets/neucematt-normal.svg'],'description':'Tinta plástica mate")
          srv=srv.replace("'price_display':'Preço por variante','stock':0,'description':'Tinta plástica sedosa", "'price_display':'Preço por variante','stock':0,'image':'assets/neucesoft-real.jpg','gallery':['assets/neucesoft-real.jpg','assets/neucesoft-normal.svg'],'description':'Tinta plástica sedosa")
          # Do not overwrite a managed NEUCE main image with the old placeholder migration.
          srv=re.sub(r" # V3 migration: make the existing NeuceBel record presentable.*?\n  c\.execute\(\"UPDATE products SET image=.*?\n  \)\n", "", srv, flags=re.S)
          p.write_text(srv,encoding='utf-8')
          PY
          python -m py_compile server.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html catalogo.html produto-wc.html server.py
          git commit -m 'Unificar imagens entre Back Office catalogo e produto' || true
          git push
          git rm .github/workflows/unify-product-images.yml
          git commit -m 'Remover workflow temporario de imagens' || true
          git push
