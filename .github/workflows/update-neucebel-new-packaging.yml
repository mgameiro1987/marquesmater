name: Update NeuceBel new packaging
on:
  push:
    paths:
      - '.github/workflows/update-neucebel-new-packaging.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar imagem NeuceBel para embalagem atual
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.py')
          s=p.read_text(encoding='utf-8')
          old='https://templodastintas.pt/cdn/shop/files/neucebel.png?v=1705605720&width=533'
          new='https://www.neuce.com/files/products/881_3.png?dp=20260227101359'
          if old not in s:
              raise SystemExit('URL antiga da NeuceBel não encontrada')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.py
          git commit -m 'Atualizar imagem NeuceBel para embalagem nova'
          git push
      - name: Remover workflow temporário
        run: |
          git rm .github/workflows/update-neucebel-new-packaging.yml
          git commit -m 'Remover workflow temporário NeuceBel'
          git push
