name: Fix NEUCE single real image
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-neuce-single-real.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download real NEUCE images
        run: |
          curl -L --fail --retry 3 'https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucebel-600x638.png' -o assets/neucebel-real.png
          curl -L --fail --retry 3 'https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucematt-600x638.png' -o assets/neucematt-real.png
          curl -L --fail --retry 3 'https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucesoft-600x638.png' -o assets/neucesoft-real.png
      - name: Remove old NEUCE overrides and force catalog values
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('catalogo.html')
          s=p.read_text(encoding='utf-8')
          # Remove every old NEUCE-specific block that was replacing the catalog cards.
          s=re.sub(r'<!-- MM-PINTURAS-V26-OPEN-FIX -->.*?<script id="MM_NEUCE_LOCAL_GALLERY">.*?</script>', '', s, flags=re.S)
          # Remove any leftover gallery blocks if present.
          s=re.sub(r'<!-- MM-NEUCE-DUAL-GALLERY -->.*?</style>\s*<script>.*?</script>', '', s, flags=re.S)
          s=re.sub(r'<script id="MM_NEUCE_LOCAL_GALLERY">.*?</script>', '', s, flags=re.S)
          s=re.sub(r'<style id="MM-NEUCE-FINAL">.*?</script>', '', s, flags=re.S)
          # Real product images stored locally in this repository.
          s=s.replace('"image":"assets/neucebel-trabalhada.svg"','"image":"assets/neucebel-real.png"')
          s=s.replace('"image":"assets/neucematt-trabalhada.svg"','"image":"assets/neucematt-real.png"')
          s=s.replace('"image":"assets/neucesoft-trabalhada.svg"','"image":"assets/neucesoft-real.png"')
          # API data must never override the local NEUCE price/image.
          old="const localBySlug=Object.fromEntries(PAINTINGS.map(x=>[x.slug,x]));list=list.map(x=>localBySlug[x.slug]?{...x,...localBySlug[x.slug]}:x);"
          new="const localBySlug=Object.fromEntries(PAINTINGS.map(x=>[x.slug,x]));list=list.map(x=>{const p=localBySlug[x.slug];return p?{...x,...p,price_display:p.price,image:p.image}:x;});"
          if old not in s:
              raise SystemExit('runtime mapping target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify catalog has no old gallery code
        run: |
          ! grep -q 'MM-NEUCE-DUAL-GALLERY' catalogo.html
          ! grep -q 'MM_NEUCE_LOCAL_GALLERY' catalogo.html
          grep -q 'assets/neucebel-real.png' catalogo.html
          grep -q 'assets/neucematt-real.png' catalogo.html
          grep -q 'assets/neucesoft-real.png' catalogo.html
          grep -q 'price_display:p.price' catalogo.html
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogo.html assets/neucebel-real.png assets/neucematt-real.png assets/neucesoft-real.png
          git commit -m 'NEUCE: uma imagem real por produto e preços Desde' || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-neuce-single-real.yml || true
          git commit -m 'Remover workflow temporário NEUCE single image' || true
          git push || true
