name: Corrigir tópicos 1 2 3 e navegação
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Corrigir homepage, rodapé, navegação e pinturas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=re.sub(r'<div class="about-points">.*?</div></div></section>', '</div></div></section>', s, count=1, flags=re.S); p.write_text(s,encoding='utf-8')
          n=Path('nav.js'); ns=n.read_text(encoding='utf-8'); ns=ns.replace('          <a href="carrinho.html">Carrinho</a>\n',''); ns=re.sub(r'\n        <div class="mm-footer-col-v17">\n          <h4>Categorias</h4>.*?</div>\n\n        <div class="mm-footer-col-v17">\n          <h4>Informação</h4>','\n        <div class="mm-footer-col-v17">\n          <h4>Informação</h4>',ns,count=1,flags=re.S); n.write_text(ns,encoding='utf-8')
          PY
          python3 scripts/patch_server_neuce.py
          python3 scripts/update_neuce_paints.py
      - name: Validar
        run: |
          python -m py_compile server.py
          grep -q 'Máquinas RIDA em destaque' index.html
          ! grep -q 'about-points' index.html
          ! grep -q '<h4>Categorias</h4>' nav.js
          ! grep -q 'carrinho.html">Carrinho</a>' nav.js
      - name: Commit e push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html nav.js server.py admin.html produto-wc.html scripts
          git diff --cached --quiet || git commit -m 'MarquesMater - pinturas NEUCE e WoodNeuce'
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 3; done
