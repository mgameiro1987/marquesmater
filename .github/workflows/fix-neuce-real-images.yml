name: Set real NEUCE images
on:
  push:
    paths:
      - '.github/workflows/fix-neuce-real-images.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official NEUCE images and update SQLite catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3, requests, re
          from urllib.parse import urljoin
          try:
              from bs4 import BeautifulSoup
          except Exception:
              BeautifulSoup = None

          root=Path('.')
          out=root/'assets'/'neuce'
          out.mkdir(parents=True,exist_ok=True)
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; MarquesMater/1.0)'})

          # IDs confirmed on the official NEUCE product pages. The site does not
          # always use _1.jpg: some products use PNG or another image number.
          direct_ids={
            'aquaneuce':885,
            'hydroneuce':884,
            'multineuce':882,
            'neucebel':881,
            'neucematt':1026,
            'neucesoft':886,
            'primaneuce':1029,
            'textuneuce':894,
            'neucetex':892,
            'neucegold-ng':904,
            'woodneuce':934,
            'superneuce-sn':1144,
          }

          category_pages={
            'belneuce':('https://www.neuce.com/p179-cat-159-tinta-plastica-an_pt',['belneuce']),
            'superneuce':('https://www.neuce.com/p179-cat-159-tinta-plastica-an_pt',['superneuce']),
            'plioneuce':('https://www.neuce.com/p179-cat-161-fachada-se_pt',['plioneuce']),
          }

          def save_response(slug,r):
            if not r.ok or len(r.content)<5000:
              return ''
            ct=(r.headers.get('content-type') or '').lower()
            ext='.png' if 'png' in ct else ('.webp' if 'webp' in ct else '.jpg')
            p=out/(slug+ext)
            p.write_bytes(r.content)
            return 'assets/neuce/'+p.name

          def try_id(slug,pid):
            for n in range(1,7):
              for ext in ('jpg','png','jpeg','webp'):
                u=f'https://www.neuce.com/files/products/{pid}_{n}.{ext}'
                try:
                  r=s.get(u,timeout=20)
                  rel=save_response(slug,r)
                  if rel:
                    print('OK',slug,u,'->',rel)
                    return rel
                except Exception as e:
                  print('TRY FAIL',slug,u,e)
            return ''

          def product_page_for(category_url,names):
            try:
              h=s.get(category_url,timeout=30).text
              if BeautifulSoup:
                soup=BeautifulSoup(h,'html.parser')
                wanted={x.lower() for x in names}
                for a in soup.find_all('a',href=True):
                  text=' '.join(a.stripped_strings).strip().lower()
                  if text in wanted or any(text.startswith(x+' ') or text==x for x in wanted):
                    return urljoin(category_url,a['href'])
              # Fallback: locate a product URL containing the product name.
              for name in names:
                slug=name.replace(' ','-')
                m=re.search(r'href=[\"\']([^\"\']*p180-p-\\d+-'+re.escape(slug)+r'[^\"\']*)',h,re.I)
                if m:return urljoin(category_url,m.group(1))
            except Exception as e:
              print('CATEGORY FAIL',category_url,e)
            return ''

          def image_from_product_page(slug,page):
            try:
              h=s.get(page,timeout=30).text
              candidates=[]
              if BeautifulSoup:
                soup=BeautifulSoup(h,'html.parser')
                for tag in soup.find_all(['img','source']):
                  for attr in ('src','data-src','data-original','srcset'):
                    v=tag.get(attr)
                    if not v: continue
                    for part in str(v).split(','):
                      u=part.strip().split(' ')[0]
                      if '/files/products/' in u:candidates.append(urljoin(page,u))
              candidates += re.findall(r'https?://www\\.neuce\\.com/files/products/[^\"\'\\s<>]+',h,re.I)
              seen=[]
              for u in candidates:
                u=u.replace('&amp;','&')
                if u in seen: continue
                seen.append(u)
                try:
                  r=s.get(u,timeout=20)
                  rel=save_response(slug,r)
                  if rel:
                    print('OK PAGE',slug,u,'->',rel)
                    return rel
                except Exception as e: print('IMAGE FAIL',u,e)
            except Exception as e: print('PRODUCT PAGE FAIL',slug,page,e)
            return ''

          paths={}
          for slug,pid in direct_ids.items():
            paths[slug]=try_id(slug,pid)

          for slug,(cat,names) in category_pages.items():
            page=product_page_for(cat,names)
            print('PAGE',slug,page)
            if page: paths[slug]=image_from_product_page(slug,page)

          db=sqlite3.connect('data/catalog.db')
          cur=db.cursor()
          cols={r[1] for r in cur.execute('PRAGMA table_info(products)')}
          if 'gallery_json' not in cols:
            cur.execute("ALTER TABLE products ADD COLUMN gallery_json TEXT DEFAULT '[]'")
          for slug,rel in paths.items():
            if not rel: continue
            cur.execute('UPDATE products SET image=?, gallery_json=? WHERE slug=?',(rel,'["'+rel+'"]',slug))
            print('UPDATED',slug,rel,cur.rowcount)
          db.commit();db.close()

          ok=[k for k,v in paths.items() if v]
          print('Downloaded',len(ok),'of',len(paths),ok)
          if not ok:
            raise SystemExit('No official NEUCE images downloaded')
          PY
      - name: Keep catalog references for existing local NEUCE images
        run: |
          python - <<'PY'
          from pathlib import Path
          for f in ['catalogo.html','produto-wc.html']:
            p=Path(f)
            if not p.exists(): continue
            x=p.read_text(encoding='utf-8')
            for old,new in {
              'assets/neucebel-normal.svg':'assets/neuce/neucebel.png',
              'assets/neucematt-normal.svg':'assets/neuce/neucematt.jpg',
              'assets/neucesoft-normal.svg':'assets/neuce/neucesoft.jpg',
            }.items(): x=x.replace(old,new)
            p.write_text(x,encoding='utf-8')
          PY
      - name: Commit images and database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/neuce data/catalog.db catalogo.html produto-wc.html
          git diff --cached --quiet && exit 0
          git commit -m 'Usar imagens oficiais NEUCE no catálogo'
          git push
      - name: Remove temporary workflows
        if: success()
        run: |
          git rm .github/workflows/fix-neuce-real-images.yml .github/workflows/sync-neuce-db-images.yml || true
          git commit -m 'Remover workflows temporários de imagens NEUCE' || true
          git push