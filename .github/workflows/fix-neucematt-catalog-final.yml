name: Fix NeuceMatt catalog image final
on:
  push:
    paths:
      - '.github/workflows/fix-neucematt-catalog-final.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force local NeuceMatt image in catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('catalogo.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucematt-600x638.jpg','assets/neucematt-real.png')
          s=s.replace('assets/neucematt-real.jpg','assets/neucematt-real.png')
          marker='<!-- MM-NEUCEMATT-CATALOG-FINAL -->'
          if marker not in s:
              patch="""<script>/* MM-NEUCEMATT-CATALOG-FINAL */\n(function(){const SRC='/assets/neucematt-real.png?v=20260910';function fix(){document.querySelectorAll('.product').forEach(function(card){const h=card.querySelector('h3');if(h&&h.textContent.trim().toLowerCase()==='neucematt'){const im=card.querySelector('.pimg img');if(im){im.src=SRC;im.removeAttribute('onerror');}}});}fix();new MutationObserver(fix).observe(document.getElementById('grid')||document.body,{childList:true,subtree:true});})();\n</script>\n<!-- MM-NEUCEMATT-CATALOG-FINAL -->"""
              s=s.replace('</body>',patch+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogo.html
          git commit -m 'Fix final NeuceMatt image on catalog' || true
          git push
          git rm .github/workflows/fix-neucematt-catalog-final.yml || true
          git commit -m 'Remove temporary NeuceMatt catalog workflow' || true
          git push
