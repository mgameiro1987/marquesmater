name: One-off remove NeuceMatt
on:
  push:
    paths:
      - 'scripts/remove_neucematt.py'
permissions:
  contents: write
jobs:
  remove-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove NeuceMatt
        run: python scripts/remove_neucematt.py
      - name: Commit changes and remove one-off files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.db data/site_data.json server.py
          git rm -f scripts/remove_neucematt.py .github/workflows/oneoff-remove-neucematt.yml
          git commit -m 'Remover NeuceMatt do catálogo'
          git push
