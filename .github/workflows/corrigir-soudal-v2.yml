name: Corrigir Soudal V25 - imagens cores backoffice
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/corrigir-soudal-v2.yml'
      - 'scripts/fix_soudal_v2.py'
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção
        run: python scripts/fix_soudal_v2.py
      - name: Validar Python
        run: python -m py_compile server.py scripts/fix_soudal_v2.py
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.db produto-wc.html catalogo.html admin.html scripts/fix_soudal_v2.py
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir Soudal: imagens cores e editor backoffice"
          git push
