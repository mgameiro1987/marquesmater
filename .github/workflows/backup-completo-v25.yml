name: Backup completo MarquesMater V25

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/catalog.db'
      - 'data/soudal_products.json'
      - 'assets/soudal/**'
      - 'docs/soudal/**'
      - 'produto-wc.html'
      - 'catalogo.html'
      - 'admin.html'
      - 'scripts/fix_soudal_v2.py'
      - 'scripts/limpar_soudal.py'
      - '.github/workflows/backup-completo-v25.yml'
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar limpeza Soudal
        run: python scripts/limpar_soudal.py
      - name: Finalizar front e backoffice T-Rex
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('produto-wc.html'); s=p.read_text(); s=re.sub(r'<script id="MM_TrexPower290JS">.*?</script>','',s,flags=re.S)
          if 'MM_TrexPowerFinalJS' not in s:
            css='<style id="MM_TrexPowerFinalCSS">.mm-trex-colors{display:flex;flex-wrap:wrap;gap:8px}.mm-trex-color{display:flex;align-items:center;gap:8px;border:1px solid #d6dbe0;background:#fff;border-radius:10px;padding:8px 11px;font-weight:800;cursor:pointer}.mm-trex-color.active{border:2px solid #f28c00;box-shadow:0 0 0 3px rgba(242,140,0,.12)}.mm-trex-dot{width:24px;height:24px;border-radius:50%;border:1px solid #c7ccd1;box-shadow:inset 0 0 0 2px #fff}</style>'
            js='''<script id="MM_TrexPowerFinalJS">(function(){let T=null,I=0;const path=v=>'/'+String(v.image||v.asset_image||'').replace(/^\\//,'');const bg=c=>{c=(c||'').toLowerCase();if(c.includes('preto'))return '#171717';if(c.includes('cinz'))return '#9da3a8';if(c.includes('bege'))return '#d7c2a2';if(c.includes('terracota'))return '#b65c43';if(c.includes('transpar'))return 'linear-gradient(135deg,#fff,#dfe8ef)';return '#fff'};function apply(){if(!T)return;let b=document.getElementById('priceBox');if(b)b.innerHTML='<div class="price">€ '+Number(T.price||12.95).toFixed(2).replace('.',',')+'</div>';document.querySelector('.stock')?.remove();let t=document.querySelector('.variant-title'),g=document.querySelector('.variant-grid');if(!t||!g)return;t.textContent='Escolha a cor';g.className='mm-trex-colors';g.innerHTML=T.variants.map((v,i)=>'<button type="button" class="mm-trex-color '+(i===I?'active':'')+'" data-i="'+i+'"><span class="mm-trex-dot" style="background:'+bg(v.color)+'"></span>'+v.color+'</button>').join('');g.querySelectorAll('.mm-trex-color').forEach(x=>x.onclick=()=>{I=Number(x.dataset.i);let m=document.getElementById('mainImg');if(m)m.src=path(T.variants[I]);g.querySelectorAll('.mm-trex-color').forEach((z,k)=>z.classList.toggle('active',k===I))});let m=document.getElementById('mainImg');if(m)m.src=path(T.variants[I])}async function boot(){if(!/soudal-t-rex-power-290ml/i.test(new URLSearchParams(location.search).get('slug')||''))return;T=(await fetch('/data/soudal_products.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json())).products.find(x=>x.slug==='soudal-t-rex-power-290ml');if(!T)return;T.price=12.95;let n=0,q=setInterval(()=>{if(document.getElementById('priceBox')&&document.querySelector('.variant-grid')){apply();clearInterval(q)}else if(++n>40)clearInterval(q)},150)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot()})();</script>'''
            s=s.replace('</head>',css+'</head>',1).replace('</body>',js+'</body>',1)
          p.write_text(s)
          c=Path('catalogo.html'); s=c.read_text()
          if 'MM_TrexCardFinal' not in s:
            j='''<script id="MM_TrexCardFinal">(function(){function f(){document.querySelectorAll('.product').forEach(x=>{if(!(x.querySelector('h3')?.textContent||'').includes('T-Rex Power 290ml'))return;[...x.querySelectorAll('*')].forEach(e=>{let t=(e.textContent||'').trim();if(t==='Preço sob consulta')e.textContent='12,95 €';if(/^Disponibilidade/i.test(t)||t==='Ver produto →'||t==='Ver produto')e.remove()})})}f();new MutationObserver(f).observe(document.body,{childList:true,subtree:true})})();</script>'''
            c.write_text(s.replace('</body>',j+'</body>',1))
          a=Path('admin.html'); s=a.read_text()
          if 'MM_TrexAdminFinal' not in s:
            css='<style id="MM_TrexAdminFinalCSS">.mm-trex-admin{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}.mm-ta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mm-ta-colors{display:grid;gap:8px}.mm-ta-color{display:grid;grid-template-columns:65px 120px 1fr;gap:8px;align-items:center}.mm-ta-color img{width:55px;height:55px;object-fit:contain;border:1px solid var(--line);border-radius:8px}@media(max-width:800px){.mm-ta-grid{grid-template-columns:1fr}.mm-ta-color{grid-template-columns:55px 1fr}}}</style>'
            js='''<script id="MM_TrexAdminFinal">(function(){let P=null;async function load(){let a=await fetch('/api/admin/products?brand=Soudal',{cache:'no-store'}).then(r=>r.json());P=a.find(x=>x.slug==='soudal-t-rex-power-290ml');if(!P)return;let v=document.getElementById('mmTrexAdmin');if(!v){v=document.createElement('section');v.id='mmTrexAdmin';v.className='mm-trex-admin';document.querySelector('.content').appendChild(v)}draw()}function draw(){let v=document.getElementById('mmTrexAdmin');v.innerHTML='<h2>🧴 T-Rex Power 290ml</h2><p class="muted">Preço, promoção e cores disponíveis com imagens locais.</p><div class="mm-ta-grid"><div><label class="label">Preço (€)</label><input id="taPrice" class="input" type="number" step="0.01" value="'+(P.price||12.95)+'"></div><div><label class="label">Preço promoção (€)</label><input id="taPromo" class="input" type="number" step="0.01" value="'+(P.promo_price||'')+'" placeholder="Vazio = sem promoção"></div><div><label class="label">Promoção ativa</label><select id="taOn" class="input"><option value="0">Não</option><option value="1">Sim</option></select></div><div><label class="label">Stock</label><input id="taStock" class="input" type="number" value="'+(P.stock??1)+'"></div></div><h3>Cores disponíveis</h3><div class="mm-ta-colors">'+(P.variants||[]).map(x=>'<div class="mm-ta-color"><img src="/'+x.image+'"><b>'+x.color+'</b><input class="input taImg" value="'+x.image+'"></div>').join('')+'</div><button id="taSave" class="btn primary">Guardar T-Rex Power</button>';document.getElementById('taOn').value=P.promo_enabled?'1':'0';document.getElementById('taSave').onclick=save}async function save(){P.price=Number(document.getElementById('taPrice').value)||0;let q=document.getElementById('taPromo').value;P.promo_price=q?Number(q):null;P.promo_enabled=document.getElementById('taOn').value==='1';P.stock=Number(document.getElementById('taStock').value)||0;let im=[...document.querySelectorAll('.taImg')];P.variants=(P.variants||[]).map((x,i)=>({...x,price:P.price,image:im[i]?.value||x.image,asset_image:im[i]?.value||x.asset_image}));P.image=P.variants[0]?.image||P.image;P.gallery=P.variants.map(x=>x.image);let o=await fetch('/api/admin/product',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(P)}).then(r=>r.json());alert(o.ok?'Guardado.':'Erro: '+(o.error||''));load()}function hook(){let b=document.getElementById('mmSoudalB');if(b)b.onclick=load;else setTimeout(hook,500)}document.addEventListener('DOMContentLoaded',hook)})();</script>'''
            a.write_text(s.replace('</head>',css+'</head>',1).replace('</body>',js+'</body>',1))
          PY
      - name: Validar
        run: python -m py_compile server.py scripts/limpar_soudal.py
      - name: Guardar alterações no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/soudal_products.json data/catalog.db produto-wc.html catalogo.html admin.html scripts/limpar_soudal.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "T-Rex Power final: preço, cores, promoção e limpeza Soudal"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Criar ZIP completo
        run: |
          mkdir -p /tmp/backup/MarquesMater_V25_SOUDAL_BACKUP_COMPLETO
          rsync -a --exclude='.git' ./ /tmp/backup/MarquesMater_V25_SOUDAL_BACKUP_COMPLETO/
          cd /tmp/backup
          zip -r MarquesMater_V25_SOUDAL_BACKUP_COMPLETO.zip MarquesMater_V25_SOUDAL_BACKUP_COMPLETO
      - name: Disponibilizar backup para download
        uses: actions/upload-artifact@v4
        with:
          name: MarquesMater_V25_SOUDAL_BACKUP_COMPLETO
          path: /tmp/backup/MarquesMater_V25_SOUDAL_BACKUP_COMPLETO.zip
          retention-days: 30
