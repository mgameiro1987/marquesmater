name: Corrigir tópicos 1 2 3 e navegação
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Corrigir homepage, rodapé e navegação
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Menu principal: mantém as famílias controladas pelo Back Office,
          #    sem criar cartões adicionais acima do banner.
          # 2) Homepage: remove o bloco textual duplicado de 4 itens dentro do "Quem somos".
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<div class="about-points">.*?</div></div></section>', '</div></div></section>', s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')

          # 3) Rodapé: retirar Carrinho e Categorias; manter MarquesMater,
          #    Informação e Contactos.
          n = Path('nav.js')
          ns = n.read_text(encoding='utf-8')
          ns = ns.replace('          <a href="carrinho.html">Carrinho</a>\n', '')
          ns = re.sub(r'\n        <div class="mm-footer-col-v17">\n          <h4>Categorias</h4>.*?</div>\n\n        <div class="mm-footer-col-v17">\n          <h4>Informação</h4>', '\n        <div class="mm-footer-col-v17">\n          <h4>Informação</h4>', ns, count=1, flags=re.S)

          # Navegação mobile: tocar numa família com subfamílias deve abrir a própria
          # categoria. O dropdown não deve bloquear o clique da categoria.
          old = '''      if(window.matchMedia('(max-width: 900px)').matches){\n        const wasOpen=item.classList.contains('mm-open');\n        document.querySelectorAll('.mm-nav-family.mm-open').forEach(x=>x.classList.remove('mm-open'));\n        if(!wasOpen){\n          e.preventDefault();\n          item.classList.add('mm-open');\n        }\n      }'''
          new = '''      if(window.matchMedia('(max-width: 900px)').matches){\n        document.querySelectorAll('.mm-nav-family.mm-open').forEach(x=>x.classList.remove('mm-open'));\n        // A família é clicável: não bloquear a navegação para o catálogo.\n      }'''
          if old in ns:
              ns = ns.replace(old, new)
          n.write_text(ns, encoding='utf-8')

          # Remover também o mesmo bloco, caso tenha sido injetado com uma variação simples.
          for fname in ['index.html']:
              pp=Path(fname); txt=pp.read_text(encoding='utf-8')
              txt=txt.replace('<div class="about-points"><div><b>01</b><span>Construção e bricolage</span></div><div><b>02</b><span>Pinturas e acessórios</span></div><div><b>03</b><span>Ferramentas e máquinas</span></div><div><b>04</b><span>Jardim e manutenção</span></div></div>', '')
              pp.write_text(txt, encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q 'Máquinas RIDA em destaque' index.html
          ! grep -q 'about-points' index.html
          ! grep -q '<h4>Categorias</h4>' nav.js
          ! grep -q 'carrinho.html">Carrinho</a>' nav.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html nav.js
          git diff --cached --quiet || git commit -m 'MarquesMater V26 - corrigir tópicos 1 2 3 e clique Pinturas'
          git push
