name: Fix NEUCE catalog live
on: push
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix catalog source of truth
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('catalogo.html')
          s=p.read_text(encoding='utf-8')
          old="list=list.map(x=>{const p=localBySlug[x.slug];return p?{...p,...x,price_display:x.price_display||p.price,image:(x.gallery?.[0]||x.images?.[0]?.src||x.image||p.image),gallery:(x.gallery?.length?x.gallery:(p.gallery||[]))}:x;});"
          new="list=list.map(x=>{const p=localBySlug[x.slug];return p?{...x,...p,price_display:p.price,image:p.image,gallery:[p.image],images:[{src:p.image}]}:x;});"
          if old not in s:
              raise SystemExit('Expected catalog merge block not found')
          s=s.replace(old,new,1)
          s=s.replace('"image":"assets/neucebel-real.jpg"','"image":"https://www.neuce.com/files/products/881_3.png?dp=20260227101359"',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.html .github/workflows/fix-neuce-catalog-live.yml
          git commit -m "Corrigir catálogo NEUCE e imagem NeuceBel" || exit 0
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-neuce-catalog-live.yml
          git commit -m "Remover correção temporária do catálogo"
          git push
