name: Ajustar T-Rex Power 290ml V25
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ajustar-trex-power.yml'
      - 'scripts/ajustar_trex_power.py'
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste T-Rex Power
        run: python scripts/ajustar_trex_power.py
      - name: Validar Python
        run: python -m py_compile server.py scripts/ajustar_trex_power.py
      - name: Validar imagens
        run: |
          test -s assets/soudal/trex-power-290-branco.jpg
          test -s assets/soudal/trex-power-290-cinzento.jpg
          test -s assets/soudal/trex-power-290-preto.jpg
          test -s assets/soudal/trex-power-290-bege.jpg
          test -s assets/soudal/trex-power-290-terracota.jpg
          test -s assets/soudal/trex-power-290-transparente.jpg
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/soudal_products.json data/catalog.db produto-wc.html catalogo.html scripts/ajustar_trex_power.py assets/soudal/trex-power-290-*.jpg
          git diff --cached --quiet && exit 0
          git commit -m "T-Rex Power 290ml: preço 12,95 e imagens por cor"
          git push
