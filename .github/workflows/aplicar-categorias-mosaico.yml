name: Aplicar correcoes MarquesMater

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aplicar-categorias-mosaico.yml'
      - '.github/apply_categories_ui.b64'
      - '.github/apply_paint_options.b64'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar patch existente
        run: |
          base64 -d .github/apply_categories_ui.b64 | gzip -d > /tmp/apply_patch.py
          python3 /tmp/apply_patch.py
      - name: Aplicar patch das tintas
        run: |
          base64 -d .github/apply_paint_options.b64 | gzip -d > /tmp/apply_paint_options.py
          python3 /tmp/apply_paint_options.py
      - name: Guardar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.html server.py admin.html produto-wc.html assets/paint-options.js
          git commit -m "Aplicar opções de acabamento e cor nas tintas" || exit 0
          git push
