name: Localizar imagens dos produtos

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/products/**'
      - 'assets/products/image-map.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Localizar imagens externas no servidor
        run: python scripts/localize_product_images.py

      - name: Corrigir imagens das pinturas NEUCE no catálogo
        run: python scripts/fix_catalog_paint_images.py

      - name: Fixar imagens principais locais
        run: python scripts/finalize_local_product_images.py

      - name: Verificar ficheiros
        run: |
          python -m py_compile scripts/localize_product_images.py
          python -m py_compile scripts/fix_catalog_paint_images.py
          python -m py_compile scripts/finalize_local_product_images.py

      - name: Commit imagens locais
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/products catalogo.html produto-wc.html index.html carrinho.html *.html *.js *.css server.py rida-products.json 2>/dev/null || true
          git add scripts/localize_product_images.py scripts/fix_catalog_paint_images.py scripts/finalize_local_product_images.py assets/products/image-map.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Fixar imagens NEUCE localmente [skip ci]"
            git stash push --include-untracked -m "imagens-neuce-pre-rebase" || true
            git pull --rebase origin main
            git stash pop || true
            git add assets/products catalogo.html produto-wc.html index.html carrinho.html *.html *.js *.css server.py rida-products.json 2>/dev/null || true
            git add scripts/localize_product_images.py scripts/fix_catalog_paint_images.py scripts/finalize_local_product_images.py assets/products/image-map.json 2>/dev/null || true
            git commit -m "Aplicar imagens NEUCE locais" || true
            git push
          fi
