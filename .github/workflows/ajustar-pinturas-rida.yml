name: Corrigir grelha RIDA na página principal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir grelha RIDA para 12 produtos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          if 'MM-RIDA-GRID-FIX' not in h:
              css='''<!-- MM-RIDA-GRID-FIX --><style>.rida-section .product-grid-home{grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:14px!important;align-items:stretch!important}.rida-section .product-grid-home .product{min-width:0}.rida-section .product-grid-home img{width:100%!important;aspect-ratio:1/1!important;object-fit:contain!important}@media(max-width:900px){.rida-section .product-grid-home{grid-template-columns:repeat(3,minmax(0,1fr))!important}}@media(max-width:600px){.rida-section .product-grid-home{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}}</style>'''
              h=h.replace('</head>',css+'</head>',1)
          if 'MM-RIDA-12-PRODUCTS' not in h:
              js=r'''<!-- MM-RIDA-12-PRODUCTS --><script>
          (function(){
            async function fill(){
              const g=document.getElementById('rida-featured');if(!g)return;
              try{
                const r=await fetch('/api/products?limit=100',{cache:'no-store'});const d=await r.json();
                const a=Array.isArray(d)?d:(d.products||d.items||[]);
                const p=a.filter(x=>String(x.brand||'').trim().toUpperCase()==='RIDA').slice(0,12);
                if(p.length<12){console.warn('RIDA: apenas '+p.length+' produtos disponíveis');return;}
                const e=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
                const im=v=>{v=String(v||'').trim();if(!v)return '/assets/paint-placeholder.svg';if(v.startsWith('/'))return v;if(/^https?:\/\//i.test(v))return v;return '/'+v.replace(/^\.\//,'')};
                const mo=v=>{const n=Number(v);return Number.isFinite(n)?n.toLocaleString('pt-PT',{style:'currency',currency:'EUR'}):e(v||'Preço sob consulta')};
                g.innerHTML=p.map(x=>{const u='produto-wc.html?slug='+encodeURIComponent(x.slug||'');return `<a class="product" href="${u}"><div class="pimg"><img src="${e(im(x.image))}" alt="${e(x.name||'RIDA')}" loading="lazy"></div><div class="pbody"><small>RIDA</small><h3>${e(x.name||'')}</h3><div class="price">${mo(x.price_display||x.price)}</div><span class="more">Ver produto →</span></div></a>`}).join('');
              }catch(err){console.warn('RIDA home:',err)}
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fill);else fill();setTimeout(fill,700);
          })();
          </script>'''
              h=h.replace('</body>',js+'</body>',1)
          idx.write_text(h,encoding='utf-8')
          PY
      - name: Corrigir preços e embalagens NEUCE
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('produto-wc.html')
          s=p.read_text(encoding='utf-8')
          marker='MM_NEUCE_VARIANT_PRICES_FINAL'
          if marker not in s:
              js=r'''<script id="MM_NEUCE_VARIANT_PRICES_FINAL">
(function(){
  const PR={
    neucebel:[['1L','9,90 €'],['5L','39,90 €'],['15L','89,90 €']],
    neucematt:[['5L','29,90 €'],['15L','69,90 €']],
    neucesoft:[['1L','14,90 €'],['5L','39,90 €'],['15L','129,90 €']]
  };
  const key=(new URLSearchParams(location.search).get('slug')||'').toLowerCase();
  const vals=PR[key]; if(!vals)return;
  function apply(){
    if(!window.P || !P.variants)return false;
    P.variants=vals.map((x,i)=>Object.assign({},P.variants[i]||{}, {name:x[0],price:x[1]}));
    variant=P.variants[0]||null;
    const title=document.querySelector('.variant-title');
    const grid=document.querySelector('.variant-grid');
    const box=document.getElementById('priceBox');
    if(!title||!grid||!box)return false;
    title.textContent='Escolha a embalagem';
    grid.innerHTML=P.variants.map((v,i)=>`<button class="variant-btn ${i===0?'active':''}" type="button" data-mm-neuce-i="${i}">${v.name}<span class="variant-price">${v.price}</span></button>`).join('');
    const buttons=[...grid.querySelectorAll('[data-mm-neuce-i]')];
    buttons.forEach(b=>b.onclick=()=>{
      const i=Number(b.dataset.mmNeuceI); variant=P.variants[i];
      buttons.forEach((x,k)=>x.classList.toggle('active',k===i));
      box.innerHTML=`<div class="price">${variant.price}</div>`;
    });
    box.innerHTML=`<div class="price">${P.variants[0].price}</div>`;
    return true;
  }
  let n=0;const t=setInterval(()=>{if(apply()||++n>100)clearInterval(t)},100);
})();
</script>'''
              s=s.replace('</body>',js+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/fix-neuce-variant-prices.yml
      - name: Validar
        run: |
          grep -q 'MM-RIDA-GRID-FIX' index.html
          grep -q 'MM-RIDA-12-PRODUCTS' index.html
          grep -q 'MM_NEUCE_VARIANT_PRICES_FINAL' produto-wc.html
          test ! -f .github/workflows/fix-neuce-variant-prices.yml
      - name: Commit e push com retry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'Nada a alterar'; exit 0; fi
          git commit -m 'Corrigir preços e seleção de embalagens NEUCE'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 3
          done
          exit 1
