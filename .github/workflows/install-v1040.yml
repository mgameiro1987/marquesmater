name: Activate V10.40 Backoffice
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject recovery module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="js/v10.40-backoffice-recovery.js?v=140"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add admin.html
          git diff --cached --quiet || git commit -m 'V10.40 — ativar recuperação do Backoffice'
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/install-v1040.yml
          git add -u .github/workflows/install-v1040.yml
          git diff --cached --quiet || git commit -m 'V10.40 — remover workflow temporário'
          git push