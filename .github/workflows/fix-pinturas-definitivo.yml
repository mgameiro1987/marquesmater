name: Fix definitivo Pinturas
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-pinturas-definitivo.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir catálogo Pinturas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('catalogo.html')
          s=p.read_text(encoding='utf-8')
          if 'function renderNeucePinturas()' not in s:
              marker='async function load(page=1){'
              fn='''function renderNeucePinturas(){\n const grid=document.getElementById('grid');\n const items=[\n  {slug:'neucebel',name:'NeuceBel',price:'Desde 89,00 €',image:'https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucebel-600x638.png'},\n  {slug:'neucematt',name:'NeuceMatt',price:'Desde 79,00 €',image:'https://www.saniluz.pt/cdn/shop/files/5602920000587.jpg?v=1733586586'},\n  {slug:'neucesoft',name:'NeuceSoft',price:'Desde 129,00 €',image:'https://cdn-shopkit.com/usercontent/tintas-vital/media/images/square/37a3a6a-neucesoft.jpeg'}\n ];\n grid.innerHTML=items.map(x=>`<a class="product neuce-simple-card" href="produto-wc.html?slug=${encodeURIComponent(x.slug)}"><div class="pimg"><img src="${esc(x.image)}" alt="${esc(x.name)}" loading="lazy" onerror="this.onerror=null;this.src='/assets/paint-placeholder.svg'"></div><div class="pbody"><small>NEUCE · PINTURAS</small><h3>${esc(x.name)}</h3><div class="price">${esc(x.price)}</div></div></a>`).join('');\n document.getElementById('count').textContent='3 produtos NEUCE';\n document.getElementById('pager').innerHTML='';\n}\n'''
              s=s.replace(marker,fn+marker,1)
          start=s.find('async function init(){')
          if start>=0:
              end=s.find('</script>',start)
              block=s[start:end]
              if "requested==='Pinturas'" not in block:
                  import re
                  # Insert at beginning of init, before any await/fetch.
                  inject="""async function init(){\n const params=new URLSearchParams(location.search);\n const requested=params.get('cat')||'';\n const sub=params.get('sub')||'';\n window.initialSub=sub;\n if(requested==='Pinturas'){\n  const cat=document.getElementById('cat');\n  if(cat){let o=[...cat.options].find(x=>x.value==='Pinturas');if(!o){o=document.createElement('option');o.value='Pinturas';o.textContent='Pinturas';cat.appendChild(o);}cat.value='Pinturas';}\n  renderNeucePinturas();\n  return;\n }\n"""
                  block2=re.sub(r'async function init\(\)\{',inject,block,count=1)
                  s=s[:start]+block2+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('catalogo.html').read_text(encoding='utf-8')
          assert 'function renderNeucePinturas()' in s
          assert "requested==='Pinturas'" in s
          assert 'NeuceBel' in s and 'NeuceMatt' in s and 'NeuceSoft' in s
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogo.html
          git diff --cached --quiet || git commit -m 'Fix definitivo Pinturas NEUCE sem API'
          git push
