name: Fix NeuceMatt image final
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir imagem NeuceMatt
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p=Path('catalogo.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('assets/neucematt-real.png','https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucematt-600x638.jpg')
          s=s.replace('assets/neucematt-real.jpg','https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucematt-600x638.jpg')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogo.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Corrigir imagem NeuceMatt no catálogo'
          git push
      - name: Remover workflow temporário
        if: always()
        run: |
          git rm -f .github/workflows/fix-neucematt-image-final.yml || true
          git commit -m 'Remover workflow temporário NeuceMatt' || true
          git push || true
