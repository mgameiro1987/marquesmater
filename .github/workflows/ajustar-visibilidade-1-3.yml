name: Ajustar visibilidade 1 e 3
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ajustar-visibilidade-1-3.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar controlos do Back Office
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html');s=p.read_text(encoding='utf-8')
          s=s.replace("${f.show_top?'checked':''} onchange=\"setFamilyVisibility(${i},'show_top',this.checked);DATA.families[${i}].show_bottom=this.checked;persistFamilies()\"", "${f.show_bottom?'checked':''} onchange=\"setFamilyVisibility(${i},'show_bottom',this.checked)\"")
          s=s.replace("a.filter(f=>f.show_top).length", "a.filter(f=>f.show_bottom).length")
          old="async function setFamilyVisibility(i,key,value){const f=DATA.families?.[i];if(!f)return;f[key]=!!value;if(key==='show_top')f.show_bottom=!!value;await persistFamilies();renderFamilies();}"
          new="async function setFamilyVisibility(i,key,value){const f=DATA.families?.[i];if(!f)return;f[key]=!!value;await persistFamilies();renderFamilies();}"
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'MarquesMater V26 - visibilidade permanente menu e categorias' || true
          git push origin HEAD:main
