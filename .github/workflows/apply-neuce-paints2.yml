name: Apply NEUCE paints
on: push
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update_neuce_paints.py
      - run: python -m py_compile server.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py admin.html produto-wc.html scripts/update_neuce_paints.py
          git commit -m "Aplicar pinturas NEUCE e WoodNeuce" || true
          git push
