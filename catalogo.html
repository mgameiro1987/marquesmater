function sortList(list,sort){let a=[...list]; if(sort==='price'||sort==='price-desc'){a.sort((x,y)=>parseFloat(x.price.replace(/[^0-9,]/g,'').replace(',','.'))-parseFloat(y.price.replace(/[^0-9,]/g,'').replace(',','.'))); if(sort==='price-desc')a.reverse();} else if(sort==='name')a.sort((x,y)=>x.name.localeCompare(y.name,'pt')); return a;}

 const q=document.getElementById('q').value.trim().toLowerCase(),cat=document.getElementById('cat').value,brand=document.getElementById('brand').value,sort=document.getElementById('sort').value,grid=document.getElementById('grid'); const sub=window.initialSub||'';

}

.mm-neuce-slide img{position:relative;z-index:2;max-width:88%;max-height:88%;width:auto;height:auto;object-fit:contain}
.mm-neuce-slide.worked img{filter:drop-shadow(0 12px 12px rgba(0,0,0,.18));transform:scale(1.03)}
.mm-neuce-badge{position:absolute;z-index:3;left:9px;top:9px;padding:4px 7px;border-radius:999px;background:#fff;border:1px solid #e2e5e8;font-size:9px;font-weight:900;color:#17212b;text-transform:uppercase;letter-spacing:.04em}
.mm-neuce-switch{position:absolute;z-index:5;right:8px;bottom:8px;display:flex;gap:4px}
.mm-neuce-dot{width:7px;height:7px;border-radius:50%;border:0;background:#c7cdd2;padding:0;cursor:pointer}
.mm-neuce-dot.active{background:#f28c00;transform:scale(1.2)}
.mm-neuce-gallery .mm-neuce-prev,.mm-neuce-gallery .mm-neuce-next{position:absolute;z-index:5;top:50%;transform:translateY(-50%);width:25px;height:25px;border-radius:50%;border:1px solid #dfe3e7;background:#fff;color:#17212b;line-height:20px;font-size:18px;padding:0;cursor:pointer;opacity:.9}
.mm-neuce-gallery .mm-neuce-prev{left:6px}.mm-neuce-gallery .mm-neuce-next{right:6px}
.mm-neuce-gallery .mm-neuce-prev:hover,.mm-neuce-gallery .mm-neuce-next:hover{border-color:#f28c00}
@media(max-width:600px){.mm-neuce-gallery{min-height:170px}.mm-neuce-slide img{max-width:84%;max-height:84%}.mm-neuce-badge{font-size:8px}}
</style>
<script>
(function(){
  const PAINTS={
    'NeuceBel':{normal:'https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucebel-600x638.png',paint:'#f0c9c9',paint2:'#f7e6b8'},
    'NeuceMatt':{normal:'https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucematt-600x638.png',paint:'#d9a9bc',paint2:'#ead4df'},
    'NeuceSoft':{normal:'https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucesoft-600x638.png',paint:'#b9c9d3',paint2:'#dce7ec'}
  };
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  function gallery(name){
    const p=PAINTS[name]; if(!p)return '';
    return `<div class="mm-neuce-gallery" data-mm-gallery="${esc(name)}">
      <div class="mm-neuce-slide worked active" style="--mm-paint:${p.paint};--mm-paint2:${p.paint2}"><span class="mm-neuce-badge">Imagem trabalhada</span><img src="${p.normal}" alt="${esc(name)}" loading="lazy"></div>
      <div class="mm-neuce-slide normal"><span class="mm-neuce-badge">Imagem normal</span><img src="${p.normal}" alt="${esc(name)}" loading="lazy"></div>
      <button class="mm-neuce-prev" type="button" aria-label="Imagem anterior">‹</button><button class="mm-neuce-next" type="button" aria-label="Imagem seguinte">›</button>
      <div class="mm-neuce-switch"><button class="mm-neuce-dot active" type="button" aria-label="Imagem trabalhada"></button><button class="mm-neuce-dot" type="button" aria-label="Imagem normal"></button></div>
    </div>`;
  }
  function apply(){
    document.querySelectorAll('#grid .product').forEach(card=>{
      const h=card.querySelector('h3'); const name=(h?.textContent||'').trim(); if(!PAINTS[name])return;
      const host=card.querySelector('.pimg'); if(!host||host.dataset.mmDone)return;
      host.dataset.mmDone='1'; host.innerHTML=gallery(name);
      const slides=[...host.querySelectorAll('.mm-neuce-slide')],dots=[...host.querySelectorAll('.mm-neuce-dot')]; let i=0;
      const go=n=>{i=(n+2)%2;slides.forEach((x,k)=>x.classList.toggle('active',k===i));dots.forEach((x,k)=>x.classList.toggle('active',k===i))};
      host.querySelector('.mm-neuce-prev').onclick=e=>{e.preventDefault();e.stopPropagation();go(i-1)};
      host.querySelector('.mm-neuce-next').onclick=e=>{e.preventDefault();e.stopPropagation();go(i+1)};
      dots.forEach((d,k)=>d.onclick=e=>{e.preventDefault();e.stopPropagation();go(k)});
      host.addEventListener('click',e=>{if(e.target.closest('button'))return;e.preventDefault();e.stopPropagation();go(i+1)});
    });
  }
  function run(){apply();setTimeout(apply,300);setTimeout(apply,900);setTimeout(apply,1800)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
  const obs=new MutationObserver(apply); setTimeout(()=>obs.observe(document.getElementById('grid')||document.body,{childList:true,subtree:true}),500);
})();
</script>
<script id="MM_NEUCE_LOCAL_GALLERY">
(function(){
  const MAP={
    'NeuceBel':{normal:'/assets/neucebel-normal.svg',worked:'/assets/neucebel-trabalhada.svg'},
    'NeuceMatt':{normal:'/assets/neucematt-normal.svg',worked:'/assets/neucematt-trabalhada.svg'},
    'NeuceSoft':{normal:'/assets/neucesoft-normal.svg',worked:'/assets/neucesoft-trabalhada.svg'}
  };
  function gallery(name){const p=MAP[name];if(!p)return '';return `<div class="mm-local-gallery"><div class="mm-local-slide active"><span>IMAGEM TRABALHADA</span><img src="${p.worked}" alt="${name} — imagem trabalhada"></div><div class="mm-local-slide"><span>IMAGEM NORMAL</span><img src="${p.normal}" alt="${name} — imagem normal"></div><button type="button" class="mm-local-prev">‹</button><button type="button" class="mm-local-next">›</button><div class="mm-local-dots"><i class="active"></i><i></i></div></div>`}
  function apply(){document.querySelectorAll('#grid .product').forEach(card=>{const name=(card.querySelector('h3')?.textContent||'').trim();if(!MAP[name])return;const host=card.querySelector('.pimg');if(!host||host.dataset.mmLocal==='1')return;host.dataset.mmLocal='1';host.innerHTML=gallery(name);const slides=[...host.querySelectorAll('.mm-local-slide')],dots=[...host.querySelectorAll('.mm-local-dots i')];let i=0;const go=n=>{i=(n+2)%2;slides.forEach((s,k)=>s.classList.toggle('active',k===i));dots.forEach((d,k)=>d.classList.toggle('active',k===i))};host.querySelector('.mm-local-prev').onclick=e=>{e.preventDefault();e.stopPropagation();go(i-1)};host.querySelector('.mm-local-next').onclick=e=>{e.preventDefault();e.stopPropagation();go(i+1)};dots.forEach((d,k)=>d.onclick=e=>{e.preventDefault();e.stopPropagation();go(k)});host.onclick=e=>{if(e.target.closest('button')||e.target.closest('i'))return;e.preventDefault();e.stopPropagation();go(i+1)}})}
  const css=document.createElement('style');css.textContent=`.mm-local-gallery{position:relative;width:100%;height:100%;min-height:190px;overflow:hidden;background:#f7f8fa}.mm-local-slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:8px}.mm-local-slide.active{display:flex}.mm-local-slide img{width:100%;height:100%;object-fit:contain}.mm-local-slide span{position:absolute;z-index:3;top:7px;left:7px;background:#fff;border:1px solid #e1e5e9;border-radius:999px;padding:4px 7px;font-size:8px;font-weight:900;color:#17212b}.mm-local-prev,.mm-local-next{position:absolute;z-index:4;top:50%;transform:translateY(-50%);width:24px;height:24px;border:1px solid #dfe3e7;border-radius:50%;background:#fff;color:#17212b;font-size:18px;line-height:18px}.mm-local-prev{left:5px}.mm-local-next{right:5px}.mm-local-dots{position:absolute;z-index:4;right:7px;bottom:6px;display:flex;gap:4px}.mm-local-dots i{display:block;width:7px;height:7px;border-radius:50%;background:#c7cdd2}.mm-local-dots i.active{background:#f28c00}@media(max-width:600px){.mm-local-gallery{min-height:170px}}`;document.head.appendChild(css);
  function run(){apply();setTimeout(apply,250);setTimeout(apply,700);setTimeout(apply,1500)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
  const obs=new MutationObserver(apply);setTimeout(()=>obs.observe(document.getElementById('grid')||document.body,{childList:true,subtree:true}),300);
})();
</script></body></html>
