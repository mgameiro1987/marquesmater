name: NEUCE final
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalogo.html'
      - 'server.py'
      - '.github/workflows/neuce-final.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção
        run: python3 - <<'PY'
          from pathlib import Path
          import urllib.request
          a=Path('assets/neuce'); a.mkdir(parents=True,exist_ok=True)
          urls={'neucebel':'https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucebel-600x638.png','neucematt':'https://www.saniluz.pt/cdn/shop/files/5602920000587.jpg?v=1733586586','neucesoft':'https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucesoft-600x638.png'}
          for k,u in urls.items():
            ext='.jpg' if k=='neucematt' else '.png'; p=a/(k+ext)
            r=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
            p.write_bytes(urllib.request.urlopen(r,timeout=30).read())
          p=Path('catalogo.html'); s=p.read_text(encoding='utf-8')
          if 'MM-NEUCE-FINAL' not in s:
            s=s.replace('</body>', '<style id="MM-NEUCE-FINAL">body.mm-neuce-final .more{display:none!important}</style><script>(function(){function f(){var p=new URLSearchParams(location.search);if(p.get("cat")!=="Pinturas")return;document.body.classList.add("mm-neuce-final");document.querySelectorAll("#grid .product").forEach(function(c){var n=(c.querySelector("h3")||{}).textContent||"";if(n.trim()==="NeuceBel"){c.querySelector(".price").textContent="89,90 €";var m=c.querySelector(".more");if(m)m.remove()}if(n.trim()==="NeuceMatt"){c.querySelector(".price").textContent="69,90 €";var m=c.querySelector(".more");if(m)m.remove()}if(n.trim()==="NeuceSoft"){c.querySelector(".price").textContent="129,90 €";var m=c.querySelector(".more");if(m)m.remove()}})}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){setTimeout(f,200);setTimeout(f,1000)});else{setTimeout(f,200);setTimeout(f,1000)}})();</script></body>')
          for old,new in {'https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucebel-600x638.png':'assets/neuce/neucebel.png','https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucematt-600x638.png':'assets/neuce/neucematt.jpg','https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucesoft-600x638.png':'assets/neuce/neucesoft.png'}.items(): s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          p=Path('server.py'); s=p.read_text(encoding='utf-8')
          if 'MM-NEUCE-FINAL-SERVER' not in s:
            fn='\n# MM-NEUCE-FINAL-SERVER\ndef ensure_neuce_final():\n c=db(); vals={"neucebel":(89.9,"89,90 €","assets/neuce/neucebel.png"),"neucematt":(69.9,"69,90 €","assets/neuce/neucematt.jpg"),"neucesoft":(129.9,"129,90 €","assets/neuce/neucesoft.png")}; [c.execute("UPDATE products SET price=?,price_display=?,image=?,updated_at=CURRENT_TIMESTAMP WHERE slug=?",v+(k,)) for k,v in vals.items()]; c.commit(); c.close()\n'
            pos=s.rfind('ensure_v26_runtime_fixes()')
            if pos<0: raise SystemExit('startup marker not found')
            s=s[:pos]+fn+'ensure_neuce_final()\n'+s[pos:]
            p.write_text(s,encoding='utf-8')
          PY
      - name: Validar e publicar
        run: |
          python3 -m py_compile server.py
          test -s assets/neuce/neucebel.png
          test -s assets/neuce/neucematt.jpg
          test -s assets/neuce/neucesoft.png
          git config user.name 'mgameiro1987'
          git config user.email 'infomydreambox@gmail.com'
          git add catalogo.html server.py assets/neuce
          git diff --cached --quiet || git commit -m 'NEUCE final: imagens locais, preços e sem Ver produto'
          git push