name: Importar MarquesMater V25

on:
  workflow_dispatch:
  push:
    paths:
      - 'MarquesMater_V25_GITHUB.zip'

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extrair V25
        run: |
          test -f MarquesMater_V25_GITHUB.zip
          rm -rf /tmp/marquesmater-v25
          mkdir -p /tmp/marquesmater-v25
          unzip -q MarquesMater_V25_GITHUB.zip -d /tmp/marquesmater-v25
          cp -a /tmp/marquesmater-v25/. .
          rm -f .github/workflows/backup-v39.yml
          rm -f MarquesMater_V25_GITHUB.zip
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Guardar V25
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Importar MarquesMater V25 completa'
          git push
