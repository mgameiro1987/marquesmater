name: Fix final NEUCE catalog

on:
  push:
    paths:
      - '.github/workflows/fix-neuce-catalog-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrigir catálogo NEUCE
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('catalogo.html')
          s=p.read_text(encoding='utf-8')

          fixes={
            'neucebel': ('assets/neucebel-trabalhada.svg','€9,90','Desde 9,90 €'),
            'neucematt': ('assets/neucematt-trabalhada.svg','€29,90','Desde 29,90 €'),
            'neucesoft': ('assets/neucesoft-trabalhada.svg','€14,90','Desde 14,90 €'),
          }

          # Replace the image and catalog price only inside each matching PAINTINGS object.
          for slug,(img,old_price,display) in fixes.items():
              pat=r'(\{"slug":"'+re.escape(slug)+r'".*?\})(?=,\{"slug":|\];)'
              m=re.search(pat,s,re.S)
              if not m:
                  continue
              obj=m.group(1)
              obj=re.sub(r'"image":"[^"]*"', '"image":"'+img+'"', obj, count=1)
              obj=re.sub(r'"price":"[^"]*"', '"price":"'+display+'"', obj, count=1)
              s=s[:m.start()]+obj+s[m.end():]

          # Catalog cards: one image only, no arrows/dots/extra gallery; whole card remains a link.
          start=s.find('function paintCard(p)')
          if start!=-1:
              end=s.find('\nfunction ',start+1)
              if end==-1: end=len(s)
              newfun="""function paintCard(p){const prices=(p.variants||[]).map(v=>parseFloat(String(v.price||'').replace(/[^0-9,]/g,'').replace(',','.'))).filter(Number.isFinite);const low=prices.length?Math.min(...prices):null;const display=low!==null?'Desde '+low.toFixed(2).replace('.',',')+' €':(p.price||'Preço sob consulta');return `<a class=\"product\" href=\"produto-wc.html?slug=${encodeURIComponent(p.slug)}&local=1\"><div class=\"pimg\"><img src=\"${esc(imgUrl(p.image))}\" alt=\"${esc(p.name)}\" loading=\"lazy\" onerror=\"this.onerror=null;this.src='/assets/paint-placeholder.svg'\"></div><div class=\"pbody\"><small>NEUCE · PINTURAS</small><h3>${esc(p.name)}</h3><div class=\"price\">${esc(display)}</div><div class=\"stock\">${esc(p.stock)}</div><span class=\"more\">Ver produto →</span></div></a>`}\n"""
              s=s[:start]+newfun+s[end:]

          marker='/* MM-NEUCE-CATALOG-FINAL-CSS */'
          if marker not in s:
              css="""\n<style>/* MM-NEUCE-CATALOG-FINAL-CSS */\n.product-grid .product .pimg{position:relative;overflow:hidden}\n.product-grid .product .pimg img{display:block!important;width:100%!important;height:100%!important;object-fit:contain!important}\n.product-grid .product .pimg button,.product-grid .product .pimg [class*='arrow'],.product-grid .product .pimg [class*='dot'],.product-grid .product .pimg [class*='extra']{display:none!important}\n</style>\n"""
              s=s.replace('</head>',css+'</head>')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit correção e remover workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.html .github/workflows/fix-neuce-catalog-final.yml
          git diff --cached --quiet || git commit -m "Corrigir catálogo NEUCE: imagens locais e preços desde"
          git rm -f .github/workflows/fix-neuce-catalog-final.yml || true
          git commit -m "Remover workflow temporário catálogo NEUCE" || true
          git push
