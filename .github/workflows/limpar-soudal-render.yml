name: Corrigir Soudal no Render

# Woodneuce + opções de acabamento/cor mantidos nesta rotina de sincronização.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir server.py — Soudal e Woodneuce
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('server.py'); s=p.read_text(encoding='utf-8')
          marker='ensure_v19_catalog()\n'
          inject='''ensure_v19_catalog()\n\ndef ensure_soudal_only_trex():\n    c=db(); c.execute("DELETE FROM products WHERE brand='Soudal' AND slug <> 'soudal-t-rex-power-290ml'"); c.execute("DELETE FROM brands WHERE name='Soudal'"); c.commit(); c.close()\n\nensure_soudal_only_trex()\n'''
          if 'def ensure_soudal_only_trex()' not in s:
              if marker not in s: raise SystemExit('Marcador Soudal não encontrado')
              s=s.replace(marker,inject,1)
          if 'def ensure_woodneuce_product()' not in s:
              fn='''\n# MM-WOODNEUCE\ndef ensure_woodneuce_product():\n    try:\n        c=db()\n        p={'slug':'woodneuce','id':'woodneuce','name':'Woodneuce — Lasur','ref':'WOODNEUCE','family':'Pinturas','category':'Pinturas','subfamily':'Tinta Exterior','brand':'NEUCE','price':11.60,'price_display':'Desde 11,60 €','stock':0,'min_stock':0,'state':'active','description':'Lasur aquoso decorativo para protecção e decoração de madeiras, interior e exterior.','variants':[{'name':'0,75 L','price':'11,60 €','stock':0},{'name':'4 L','price':'59,90 €','stock':0}],'image':'','gallery':[],'docs':[{'title':'Ficha técnica WOODNEUCE — NEUCE','url':'https://www.neuce.com/'}],'tech':['Tipo: Lasur aquoso decorativo','Aplicação: madeira interior e exterior','Rendimento: 13–15 m²/L por demão','Acabamentos: Mate, Acetinado e Opaco','Embalagens: 0,75 L e 4 L',{'_mm_options':{'finish':{'enabled':True,'options':['Mate','Acetinado','Opaco']},'color':{'enabled':True,'options':['Incolor','Cores de catálogo']}}}]}\n        put_product(c,p); c.commit(); c.close()\n    except Exception as e: print('Woodneuce seed:',e)\n\n'''
              pos=s.find('ensure_v26_runtime_fixes()')
              if pos<0: raise SystemExit('Startup V26 não encontrado')
              s=s[:pos]+fn+'ensure_woodneuce_product()\n'+s[pos:]
          s=re.sub(r'\n# MM-NEUCE-FINAL-SERVER.*?(?=\nensure_v26_runtime_fixes\(\))','',s,flags=re.S)
          s=s.replace('\nensure_neuce_final()\n','\n')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: python3 -m py_compile server.py
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py
          if git diff --cached --quiet; then echo "Sem alterações"; else git commit -m "NEUCE: manter Woodneuce e opções de tinta"; git push origin main; fi
