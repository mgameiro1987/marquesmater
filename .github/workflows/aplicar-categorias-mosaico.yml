name: Aplicar categorias em mosaico

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aplicar-categorias-mosaico.yml'
      - '.github/apply_categories_ui.b64'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar patch de categorias — layout mosaico + editor lateral
        run: |
          base64 -d .github/apply_categories_ui.b64 | gzip -d > /tmp/apply_categories_ui.py
          python3 /tmp/apply_categories_ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Back Office: categorias em mosaico e editor lateral" || exit 0
          git push
