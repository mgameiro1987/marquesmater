: Branco","Capacidades: 1L, 5L e 15L","Aplicação: paredes interiores e exteriores","Acabamento: mate","Características: fácil aplicação e boa aderência","Rendimento: bom poder de cobertura e bom rendimento","Resistência: resistência ao aparecimento de algas e fungos","Afinação: afinável em BIGMIX"],"variants":[{"name":"1L","price":"€9,90","stock":"Disponível"},{"name":"5L","price":"€39,90","stock":"Disponível"},{"name":"15L","price":"€89,90","stock":"Disponível"}],"capacity":["1L","5L","15L"]},{"slug":"neucematt","name":"Neucematt","price":"Desde 29,90 €","stock":"Disponível","ref":"n.d.","image":"assets/neucematt-real.png","image_candidates":["assets/neucematt-real.png","assets/neucematt-real.png"],"desc":"Tinta plástica mate para interiores e exteriores, indicada para reboco liso, areado e vários outros suportes. Boa cobertura, rendimento e resistência à lavagem.","tech":["Tipo: tinta plástica mate","Cor: Branco","Capacidades: 5L e 15L","Aplicação: interiores e exteriores","Suportes: reboco liso, reboco areado e outros suportes","Acabamento: mate","Características: fácil aplicação e boa aderência","Rendimento: bom rendimento e bom poder de cobertura","Resistência: resistente à lavagem e à esfrega húmida"],"variants":[{"name":"5L","price":"€29,90","stock":"Disponível"},{"name":"15L","price":"€69,90","stock":"Disponível"}],"capacity":["5L","15L"]},{"slug":"neucesoft","name":"Neucesoft","price":"Desde 14,90 €","stock":"Disponível","ref":"n.d.","image":"assets/neucesoft-real.jpg","desc":"Tinta plástica sedosa de alta qualidade para paredes interiores. Boa lacagem, opacidade e brancura, fácil aplicação e elevada resistência à esfrega húmida. 1L, 5L e 15L.","tech":["Tipo: tinta plástica aquosa sedosa de alta qualidade","Base: copolímeros vinílicos, pigmentos e cargas de alta qualidade","Cor: Branco","Capacidades: 1L, 5L e 15L","Aplicação: paredes interiores","Acabamento: sedoso","Características: boa lacagem, opacidade e brancura","Rendimento: fácil aplicação e bom rendimento","Resistência: boa resistência à esfrega húmida frequente e ao desenvolvimento de fungos","Afinação: afinável em BIGMIX"],"variants":[{"name":"1L","price":"€14,90","stock":"Disponível"},{"name":"5L","price":"€39,90","stock":"Disponível"},{"name":"15L","price":"€129,90","stock":"Disponível"}],"capacity":["1L","5L","15L"]},{"slug":"pistola-gravidade-h-827-copo-aluminio-17mm","name":"Pistola gravidade H-827 (copo alumínio) 1,7MM","price":"€47,90","stock":"Disponível","ref":"5606026130315","image":"/assets/products/8207981dcd44.jpg","desc":"Pistola de pintura com copo de alumínio, adequada para trabalhos de pintura e acabamento.","tech":[]},{"slug":"pistola-lavagem-profissional-dg-10-ecb","name":"Pistola lavagem profissional DG-10-ECB","price":"€16,40","stock":"Esgotado","ref":"5606026129203","image":"/assets/products/b7cef3ea20cf.jpg","desc":"Pistola profissional para lavagem, apresentada na categoria Pinturas / Acessórios.","tech":[]},{"slug":"pistola-para-pintura-com-copo-baixo","name":"Pistola para pintura com copo baixo","price":"€25,95","stock":"Disponível","ref":"n.d.","image":"/assets/products/05fd97566286.jpg","desc":"Pistola para pintura com copo baixo, indicada para trabalhos de pintura e retoque.","tech":[]},{"slug":"spray-alta-temperatura-antracite-600c-400-ml","name":"Spray Alta Temperatura Antracite 600°C – 400 ml","price":"€5,25","stock":"6 em stock","ref":"4048500490255","image":"/assets/products/b494fe0e3397.png","desc":"Tinta em spray resistente a altas temperaturas, com excelente aderência, cobertura e resistência às intempéries.","tech":[]},{"slug":"spray-alta-temperatura-prata-800c-400-ml","name":"Spray Alta Temperatura Prata 800°C – 400 ml","price":"€5,40","stock":"Disponível","ref":"n.d.","image":"/assets/products/bc8e68382f55.png","desc":"Spray de alta temperatura em acabamento prata, indicado para superfícies sujeitas a temperaturas elevadas.","tech":[]},{"slug":"spray-alta-temperatura-preto-800c-400-ml","name":"Spray Alta Temperatura Preto 800°C – 400 ml","price":"€5,40","stock":"Disponível","ref":"n.d.","image":"/assets/products/04e43eff1ce7.png","desc":"Spray de alta temperatura preto, com elevada resistência térmica e boa aderência.","tech":[]},{"slug":"mangueira-ar-comprimido-ahc-40-pu","name":"Mangueira ar comprimido AHC-40 PU","price":"€19,20","stock":"Disponível","ref":"n.d.","image":"/assets/products/e5ccffd856be.jpg","desc":"Mangueira em PU para ar comprimido, listada atualmente pelo site MarquesMater na categoria Pinturas.","tech":[]}];
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function imgUrl(v){v=String(v||'').trim();if(!v)return '/assets/paint-placeholder.svg';if(v.startsWith('soudal-page:'))return '/api/soudal-image?url='+encodeURIComponent(v.slice(12));if(v.startsWith('/'))return v;if(/^https?:\/\//i.test(v)||v.startsWith('data:'))return v;return '/'+v.replace(/^\.\//,'')}
function imgTag(p){const fallback='/assets/paint-placeholder.svg'; return p.image?`<img src="${esc(imgUrl(p.image))}" alt="${esc(p.name)}" onerror="this.onerror=null;this.src='${fallback}'">`:'<img src="'+fallback+'" alt="">'}
function ridaCard(p){return `<a class="product" href="produto-wc.html?slug=${encodeURIComponent(p.slug||p.sku)}"><div class="pimg"><img src="${esc(imgUrl(p.image||'assets/paint-placeholder.svg'))}" alt="${esc(p.name)}" loading="lazy" onerror="this.onerror=null;this.src='/assets/paint-placeholder.svg'"></div><div class="pbody"><small>RIDA · ${esc(p.subfamily||'Máquinas')}</small><h3>${esc(p.name)}</h3><div class="price">${esc(p.price_display||p.price||'Preço sob consulta')}</div></div></a>`}
function paintCard(p){const prices=(p.variants||[]).map(v=>parseFloat(String(v.price||'').replace(/[^0-9,]/g,'').replace(',','.'))).filter(Number.isFinite);const low=prices.length?Math.min(...prices):null;const display=low!==null?'Desde '+low.toFixed(2).replace('.',',')+' €':(p.price||'Preço sob consulta');return `<a class="product" href="produto-wc.html?slug=${encodeURIComponent(p.slug)}&local=1"><div class="pimg"><img src="${esc(imgUrl(p.image))}" alt="${esc(p.name)}" loading="lazy" onerror="this.onerror=null;this.src='/assets/paint-placeholder.svg'"></div><div class="pbody"><small>NEUCE · PINTURAS</small><h3>${esc(p.name)}</h3><div class="price">${esc(display)}</div><div class="stock">${esc(p.stock)}</div></div></a>`}

function sortList(list,sort){let a=[...list]; if(sort==='price'||sort==='price-desc'){a.sort((x,y)=>parseFloat(x.price.replace(/[^0-9,]/g,'').replace(',','.'))-parseFloat(y.price.replace(/[^0-9,]/g,'').replace(',','.'))); if(sort==='price-desc')a.reverse();} else if(sort==='name')a.sort((x,y)=>x.name.localeCompare(y.name,'pt')); return a;}
async function load(page=1){
 const q=document.getElementById('q').value.trim().toLowerCase(),cat=document.getElementById('cat').value,brand=document.getElementById('brand').value,sort=document.getElementById('sort').value,grid=document.getElementById('grid'); const sub=window.initialSub||'';
 if(cat==='RIDA'){const list=rida.filter(x=>!q||x.name.toLowerCase().includes(q)||x.sku.toLowerCase().includes(q));const st=(page-1)*PER;grid.innerHTML=list.slice(st,st+PER).map(ridaCard).join('');document.getElementById('count').textContent=`${list.length} produtos RIDA`;pager(Math.ceil(list.length/PER),page);return;}
 let u=new URL(API,location.href);u.searchParams.set('page',page);u.searchParams.set('per_page',PER);if(q)u.searchParams.set('search',q);if(cat)u.searchParams.set('category',cat);if(brand)u.searchParams.set('brand',brand);if(sub)u.searchParams.set('sub',sub);try{const r=await fetch(u);if(!r.ok)throw Error();let list=await r.json();const localBySlug=Object.fromEntries(PAINTINGS.map(x=>[x.slug,x]));list=list.map(x=>{const p=localBySlug[x.slug];return p?{...x,...p,price_display:p.price,image:p.image,gallery:[p.image],images:[{src:p.image}]}:x;});const val=x=>parseFloat(String(x.price_display||'').replace(/[^0-9,.-]/g,'').replace(',','.'))||0;if(sort==='name')list.sort((a,b)=>(a.name||'').localeCompare(b.name||'','pt'));if(sort==='price'||sort==='price-desc'){list.sort((a,b)=>val(a)-val(b));if(sort==='price-desc')list.reverse();}grid.innerHTML=list.map(wcCard).join('')||'<p>Nenhum produto encontrado.</p>';document.getElementById('count').textContent=`${list.length} produtos MarquesMater`;document.getElementById('pager').innerHTML='';}catch(e){grid.innerHTML='<p class="catalog-error">Não foi possível carregar o catálogo neste momento.</p>';document.getElementById('count').textContent='Catálogo online';}
}
function wcCard(p){let eur=p.price_display||'Consultar',img=p.gallery?.[0]||p.images?.[0]?.src||p.image||''; return `<a class="product" href="produto-wc.html?slug=${encodeURIComponent(p.slug||p.id)}"><div class="pimg">${img?`<img src="${esc(imgUrl(img))}" alt="${esc(p.name)}" loading="lazy" onerror="this.onerror=null;this.src='/assets/paint-placeholder.svg'">`:'<img src="/assets/paint-placeholder.svg" alt="Imagem indisponível">'}</div><div class="pbody"><small>MARQUESMATER</small><h3>${esc(p.name)}</h3><div class="price">${esc(eur)}</div><div class="stock">${p.is_in_stock?'Em stock':'Disponibilidade a confirmar'}</div></div></a>`}
function pager(n,p){let el=document.getElementById('pager'); el.innerHTML=''; for(let i=Math.max(1,p-2);i<=Math.min(n,p+2);i++){let b=document.createElement('button');b.textContent=i;b.className=i===p?'active':'';b.onclick=()=>load(i);el.appendChild(b)}}
async function init(){try{const site=await fetch('/api/site').then(r=>r.json());const sel=document.getElementById('cat');sel.innerHTML='<option value="">Todas as famílias</option>'+(site.families||[]).map(f=>{const n=typeof f==='string'?f:f.name;return '<option value=\"'+esc(n)+'\">'+esc(n)+'</option>'}).join('');const bs=document.getElementById('brand');bs.innerHTML='<option value="">Todas as marcas</option>'+(site.brands||[]).map(b=>'<option value="'+esc(b)+'">'+esc(b)+'</option>').join('');}catch(e){} const sp=new URLSearchParams(location.search); document.getElementById('q').value=sp.get('q')||''; const requested=sp.get('cat')||'', requestedSub=sp.get('sub')||'', requestedBrand=sp.get('brand')||''; document.getElementById('cat').value=requested; window.initialSub=requestedSub; try{document.getElementById('brand').value=requestedBrand}catch(e){} try{rida=await fetch(ridaUrl).then(x=>x.json())}catch(e){rida=[]} load(1);}
document.getElementById('cat').onchange=()=>{const v=document.getElementById('cat').value; history.replaceState({},'',`catalogo.html${v?'?cat='+encodeURIComponent(v):''}`);load(1)}; document.getElementById('brand').onchange=()=>{const v=document.getElementById('brand').value; const sp=new URLSearchParams(location.search); if(v)sp.set('brand',v);else sp.delete('brand'); history.replaceState({},'',`catalogo.html${sp.toString()?'?'+sp.toString():''}`);load(1)}; document.getElementById('sort').onchange=()=>load(1); init();
</script><script src="chat.js?v=20"></script><script src="nav.js?v=20"></script><script id="MM_SoudalCatalogV2">(async function(){try{const r=await fetch('/data/soudal_products.json?x='+Date.now(),{cache:'no-store'});if(!r.ok)return;const d=await r.json(),a=d.products||[];const fix=()=>document.querySelectorAll('.product').forEach(card=>{const n=card.querySelector('h3')?.textContent?.trim(),p=a.find(x=>x.name===n);if(p?.asset_image){const im=card.querySelector('img');if(im){im.src='/'+String(p.asset_image).replace(/^\//,'');im.onerror=null}}});setTimeout(fix,300);const old=window.load;if(typeof old==='function')window.load=async function(){const z=await old.apply(this,arguments);setTimeout(fix,100);return z}}catch(e){console.warn(e)}})();</script><style id="MM_TrexCatalogCSS">.mm-hide-soudal-card-info{display:none!important}</style><script id="MM_TrexCatalogJS">(function(){
async function run(){try{const r=await fetch('/data/soudal_products.json?x='+Date.now(),{cache:'no-store'});const d=await r.json();const names=(d.products||[]).map(p=>String(p.name||'').trim());const hide=()=>document.querySelectorAll('.product').forEach(card=>{const n=card.querySelector('h3')?.textContent?.trim()||'';if(names.includes(n)){card.querySelectorAll('.stock,.more,.availability').forEach(x=>{x.classList.add('mm-hide-soudal-card-info');x.remove()})}});hide();new MutationObserver(hide).observe(document.getElementById('grid')||document.body,{childList:true,subtree:true})}catch(e){console.warn(e)}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run()})();</script><script id="MM_TrexCardFinal">(function(){function f(){document.querySelectorAll('.product').forEach(x=>{if(!(x.querySelector('h3')?.textContent||'').includes('T-Rex Power 290ml'))return;[...x.querySelectorAll('*')].forEach(e=>{let t=(e.textContent||'').trim();if(t==='Preço sob consulta')e.textContent='12,95 €';if(/^Disponibilidade/i.test(t)||t==='Ver produto →'||t==='Ver produto')e.remove()})})}f();new MutationObserver(f).observe(document.body,{childList:true,subtree:true})})();</script>
