name: Sync NEUCE images to catalog
on:
  push:
    paths:
      - '.github/workflows/sync-neuce-db-images.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official NEUCE images and update catalog DB
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sqlite3, requests
          from urllib.parse import urljoin

          root=Path('.')
          out=root/'assets'/'neuce'
          out.mkdir(parents=True,exist_ok=True)
          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0 (compatible; MarquesMater/1.0)'})

          direct={
            'aquaneuce':'https://www.neuce.com/files/products/885_1.jpg',
            'hydroneuce':'https://www.neuce.com/files/products/884_1.jpg',
            'multineuce':'https://www.neuce.com/files/products/882_1.jpg',
            'neucebel':'https://www.neuce.com/files/products/881_1.jpg',
            'neucematt':'https://www.neuce.com/files/products/1026_1.jpg',
            'neucesoft':'https://www.neuce.com/files/products/886_1.jpg',
            'primaneuce':'https://www.neuce.com/files/products/1029_1.jpg',
            'textuneuce':'https://www.neuce.com/files/products/894_1.jpg',
            'neucetex':'https://www.neuce.com/files/products/892_1.jpg',
            'neucegold-ng':'https://www.neuce.com/files/products/904_2.jpg',
            'woodneuce':'https://www.neuce.com/files/products/934_1.jpg',
          }

          category_pages={
            'superneuce':'https://www.neuce.com/p179-cat-159-tinta-plastica-ni_pt',
            'superneuce-sn':'https://www.neuce.com/p179-cat-159-tinta-plastica-ni_pt',
            'belneuce':'https://www.neuce.com/p179-cat-159-tinta-plastica-ni_pt',
            'plioneuce':'https://www.neuce.com/p179-cat-161-fachada-se_pt',
          }

          def image_from_page(page,slug):
            try:
              h=S.get(page,timeout=30).text
              # Prefer product image URLs embedded by NEUCE itself.
              urls=re.findall(r'https?://www\\.neuce\\.com/files/products/[^\"\'\\s<>]+',h,re.I)
              if not urls:
                urls=[urljoin(page,x) for x in re.findall(r'([\"\'])(/files/products/[^\"\']+)',h,re.I)]
              clean=[]
              for u in urls:
                u=u.replace('&amp;','&')
                if u not in clean: clean.append(u)
              # First image is normally the main packshot.
              for u in clean:
                if re.search(r'/products/\\d+_[12]\\.(?:jpg|jpeg|png|webp)',u,re.I):
                  r=S.get(u,timeout=30)
                  if r.ok and len(r.content)>5000:
                    ext='.jpg'
                    ct=(r.headers.get('content-type') or '').lower()
                    if 'png' in ct: ext='.png'
                    elif 'webp' in ct: ext='.webp'
                    p=out/(slug+ext);p.write_bytes(r.content);return str(p)
              return ''
            except Exception as e:
              print('page error',slug,e);return ''

          def download(u,slug):
            try:
              r=S.get(u,timeout=30)
              if not r.ok or len(r.content)<5000:return ''
              ct=(r.headers.get('content-type') or '').lower()
              ext='.jpg' if 'jpeg' in ct or 'jpg' in ct else ('.png' if 'png' in ct else '.webp')
              p=out/(slug+ext);p.write_bytes(r.content);return str(p)
            except Exception as e:
              print('download error',slug,e);return ''

          paths={}
          for slug,u in direct.items():
            paths[slug]=download(u,slug)

          for slug,page in category_pages.items():
            try:
              h=S.get(page,timeout=30).text
              m=re.search(r'href=[\"\']([^\"\']*'+re.escape(slug)+r'[^\"\']*)[\"\']',h,re.I)
              if m:
                product=urljoin(page,m.group(1))
                paths[slug]=image_from_page(product,slug) or paths.get(slug,'')
              else:
                print('product page not found',slug)
            except Exception as e: print('category error',slug,e)

          # Update the persistent SQLite catalog used by the running Flask app.
          db=sqlite3.connect('data/catalog.db')
          cur=db.cursor()
          for slug,path in paths.items():
            if not path: continue
            rel=path.replace('\\','/')
            cur.execute("UPDATE products SET image=?, gallery=? WHERE slug=?",(rel,'["'+rel+'"]',slug))
            print('UPDATED',slug,rel,cur.rowcount)
          db.commit();db.close()

          missing=[k for k,v in paths.items() if not v]
          print('Downloaded:',len(paths)-len(missing),'Missing:',missing)
          if len(paths)-len(missing)<10:
            raise SystemExit('Too few NEUCE images downloaded; refusing to commit partial result')
          PY
      - name: Commit assets and database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/neuce data/catalog.db
          git commit -m 'Atualizar imagens oficiais NEUCE no catálogo' || true
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/sync-neuce-db-images.yml
          git commit -m 'Remover workflow temporário NEUCE'
          git push