name: Fix Homepage V10 JavaScript

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir regex quebrada no index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          broken = "replace(/\n/g,'<br>')"
          fixed = "replace(/\\n/g,'<br>')"
          if broken in s:
              s = s.replace(broken, fixed)
              p.write_text(s, encoding='utf-8')
              print('Regex da Homepage corrigida.')
          else:
              print('Nenhuma regex quebrada encontrada.')
      - name: Commit da correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Sem alterações.'
          else
            git commit -m 'Corrigir JavaScript da Homepage V10'
            git push
          fi
