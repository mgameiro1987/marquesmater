name: Woodneuce — catálogo de cores no produto

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Associar imagem oficial da carta de cores WOODNEUCE
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.py')
          s=p.read_text(encoding='utf-8')
          url='https://www.neuce.com/files/media/145_1.png?d=V1'
          marker="'https://www.neuce.com/files/media/145_2.pdf?d=V1'"
          if url not in s:
              if marker not in s:
                  raise SystemExit('Catálogo WOODNEUCE não encontrado no seed')
              s=s.replace(marker, marker + ",{'title':'Carta de cores WOODNEUCE','url':'"+url+"'}", 1)
              s=s.replace("'gallery':['/assets/woodneuce.svg']", "'gallery':['/assets/woodneuce.svg','"+url+"']", 1)
              s=s.replace("'color':{'enabled':True,'options':['Incolor','Cores de catálogo']}", "'color':{'enabled':True,'options':['Incolor','Cores de catálogo'],'catalog_image':'"+url+"'}", 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: python3 -m py_compile server.py
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py
          if git diff --cached --quiet; then echo "Catálogo já associado"; else git commit -m "Adicionar carta de cores Woodneuce ao produto"; git push origin main; fi
