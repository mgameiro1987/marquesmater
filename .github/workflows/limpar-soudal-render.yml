name: Corrigir Soudal no Render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir server.py — Soudal e Woodneuce
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.py'); s=p.read_text(encoding='utf-8')
          marker='ensure_v19_catalog()\n'
          inject='''ensure_v19_catalog()\n\ndef ensure_soudal_only_trex():\n    c=db(); c.execute("DELETE FROM products WHERE brand='Soudal' AND slug <> 'soudal-t-rex-power-290ml'"); c.execute("DELETE FROM brands WHERE name='Soudal'")\n    if c.execute("SELECT 1 FROM products WHERE brand='Soudal' LIMIT 1").fetchone(): c.execute("INSERT OR IGNORE INTO brands(name) VALUES('Soudal')")\n    c.commit(); c.close()\n\nensure_soudal_only_trex()\n'''
          if 'def ensure_soudal_only_trex()' not in s:
              if marker not in s: raise SystemExit('Marcador Soudal não encontrado')
              s=s.replace(marker,inject,1)
          # Do NOT reintroduce NeuceBel/NeuceMatt/NeuceSoft.
          # Woodneuce is a real NEUCE lasur and is seeded on every startup.
          if 'def ensure_woodneuce_product()' not in s:
              fn='''\n# MM-WOODNEUCE\ndef ensure_woodneuce_product():\n    try:\n        c=db()\n        p={\n          'slug':'woodneuce','id':'woodneuce','name':'Woodneuce — Lasur','ref':'WOODNEUCE','family':'Pinturas','category':'Pinturas','subfamily':'Tinta Exterior','brand':'NEUCE',\n          'price':11.60,'price_display':'Desde 11,60 €','stock':0,'min_stock':0,'state':'active',\n          'description':'Lasur aquoso decorativo para protecção e decoração de madeiras, interior e exterior. Produto microporoso de base acrílica aquosa, inodoro e com protecção contra humidade e intempéries.',\n          'variants':[{'name':'0,75 L','price':'11,60 €','stock':0},{'name':'4 L','price':'59,90 €','stock':0}],\n          'image':'','gallery':[],'docs':[{'title':'Ficha técnica WOODNEUCE — NEUCE','url':'https://www.neuce.com/'}],\n          'tech':['Tipo: Lasur aquoso decorativo','Aplicação: madeira interior e exterior','Rendimento: 13–15 m²/L por demão','Acabamentos: Mate, Acetinado e Opaco','Embalagens: 0,75 L e 4 L',{'_mm_options':{'finish':{'enabled':True,'options':['Mate','Acetinado','Opaco']},'color':{'enabled':True,'options':['Incolor','Cores de catálogo']}}}]\n        }\n        put_product(c,p); c.commit(); c.close()\n    except Exception as e: print('Woodneuce seed:',e)\n\n'''
              pos=s.find('ensure_v26_runtime_fixes()')
              if pos<0: raise SystemExit('Startup V26 não encontrado')
              s=s[:pos]+fn+'ensure_woodneuce_product()\n'+s[pos:]
          # Remove any legacy NEUCE reintroduction function/call if a previous workflow left it behind.
          s=re.sub(r'\n# MM-NEUCE-FINAL-SERVER.*?(?=\nensure_v26_runtime_fixes\(\))','',s,flags=re.S)
          s=s.replace('\nensure_neuce_final()\n','\n')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Corrigir cartões NEUCE da página Pinturas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('catalogo.html'); s=p.read_text(encoding='utf-8')
          urls={
            'https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucebel-600x638.png':'https://wsrv.nl/?url=https%3A%2F%2Ftemplodastintas.pt%2Fcdn%2Fshop%2Ffiles%2Fneucebel.png%3Fv%3D1705605720%26width%3D533&w=600&h=600&fit=inside',
            'https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucematt-600x638.png':'https://wsrv.nl/?url=https%3A%2F%2Fwww.saniluz.pt%2Fcdn%2Fshop%2Ffiles%2F5602920000587.jpg%3Fv%3D1733586586&w=600&h=600&fit=inside',
            'https://www.marquesmater.pt/novo/wp-content/uploads/2024/03/Neucesoft-600x638.png':'https://wsrv.nl/?url=https%3A%2F%2Fcdn-shopkit.com%2Fusercontent%2Ftintas-vital%2Fmedia%2Fimages%2Fsquare%2F37a3a6a-neucesoft.jpeg&w=600&h=600&fit=inside'}
          for a,b in urls.items(): s=s.replace(a,b)
          if 'MM-NEUCE-FINAL' not in s:
            patch='<style id="MM-NEUCE-FINAL">body.mm-neuce-final .more{display:none!important}</style><script>(function(){function f(){var p=new URLSearchParams(location.search);if(p.get("cat")!=="Pinturas")return;document.body.classList.add("mm-neuce-final");document.querySelectorAll("#grid .product").forEach(function(c){var n=(c.querySelector("h3")||{}).textContent||"";var v={"NeuceBel":"89,90 €","NeuceMatt":"69,90 €","NeuceSoft":"129,90 €"}[n.trim()];if(v){var q=c.querySelector(".price");if(q)q.textContent=v;var m=c.querySelector(".more");if(m)m.remove()}})}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){setTimeout(f,200);setTimeout(f,1000)});else{setTimeout(f,200);setTimeout(f,1000)}})();</script>'
            s=s.replace('</body>',patch+'</body>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar
        run: python3 -m py_compile server.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py catalogo.html
          if git diff --cached --quiet; then echo "Sem alterações"; else git commit -m "NEUCE: manter Woodneuce e remover reintrodução antiga"; git push origin main; fi
