services:
  - type: web
    name: marquesmater
    runtime: python
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marquesmater-db
          property: connectionString

databases:
  - name: marquesmater-db
    plan: free
    region: oregon
