name: Smoke V10.41
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Render and test APIs
        env:
          SITE: https://marquesmater-7ap1.onrender.com
        run: |
          python - <<'PY'
          import os,time,json,urllib.request
          site=os.environ['SITE']
          def get(path):
              r=urllib.request.urlopen(site+path,timeout=20)
              b=r.read(); print(path,r.status,r.headers.get('content-type'),len(b)); return r,b
          for i in range(30):
              try:
                  r,b=get('/api/health')
                  if r.status==200: break
              except Exception as e: print('wait',i,e)
              time.sleep(10)
          else: raise SystemExit('Render não ficou disponível')
          for path in ['/api/catalog?include_inactive=1','/api/catalog-structure','/api/admin/state','/api/admin/customers','/api/admin/settings','/api/admin/promotions']:
              r,b=get(path); json.loads(b.decode())
          r,b=get('/admin.html'); html=b.decode('utf-8')
          assert 'v10.40-backoffice-recovery.js?v=140' in html, 'v10.40 não foi injetado no admin.html'
          print('SMOKE API OK')
          PY
      - name: Browser test — Novo artigo e Promoções
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat > smoke.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            await page.goto('https://marquesmater-7ap1.onrender.com/admin.html',{waitUntil:'networkidle',timeout:60000});
            await page.click('.navitem[data-section="products"]');
            await page.waitForTimeout(500);
            await page.click('#np');
            await page.waitForSelector('.modal.mm40', {timeout:5000});
            if(!await page.locator('.modal.mm40 h2').innerText().then(x=>x.includes('Novo artigo'))) throw new Error('Novo artigo não abriu');
            await page.locator('.modal.mm40 [data-x]').click();
            await page.click('.navitem[data-section="marketing"]');
            await page.waitForTimeout(500);
            if(!await page.locator('h1').innerText().then(x=>x.includes('Promoções'))) throw new Error('Promoções não abriu');
            const buttons=await page.locator('button').allTextContents();
            if(!buttons.some(x=>x.includes('Nova promoção')||x.includes('Criar promoção'))) throw new Error('Botões de promoção não apareceram');
            if(errors.length) throw new Error('Erros JS: '+errors.join(' | '));
            console.log('BROWSER SMOKE OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node smoke.js
      - name: Remove temporary smoke workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/smoke-v1041.yml || true
          git commit -m 'V10.41 — remover smoke test temporário' || true
          git push || true
