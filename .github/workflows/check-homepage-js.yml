name: Check Homepage JavaScript

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verificar scripts inline
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/scripts.txt').write_text('\n\n/* SCRIPT SEPARATOR */\n\n'.join(scripts),encoding='utf-8')
          print('Scripts encontrados:',len(scripts))
          PY
          node --check /tmp/scripts.txt > /tmp/check.txt 2>&1 || true
          cat /tmp/check.txt
          {
            echo 'Homepage JavaScript diagnostic';
            echo "Commit: $GITHUB_SHA";
            echo '--- node --check ---';
            cat /tmp/check.txt;
          } > homepage-js-check.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add homepage-js-check.txt
          git commit -m 'Diagnóstico JavaScript Homepage' || true
          git push || true
