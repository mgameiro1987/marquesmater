name: Backup completo repositorio MarquesMater
on:
  push:
    paths:
      - '.github/workflows/backup-completo-repositorio-temp.yml'
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Criar ZIP completo
        run: |
          mkdir -p /tmp/backup/MarquesMater_REPOSITORIO_COMPLETO
          rsync -a --exclude='.git' ./ /tmp/backup/MarquesMater_REPOSITORIO_COMPLETO/
          cd /tmp/backup
          zip -r MarquesMater_REPOSITORIO_COMPLETO.zip MarquesMater_REPOSITORIO_COMPLETO
      - name: Disponibilizar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MarquesMater_REPOSITORIO_COMPLETO
          path: /tmp/backup/MarquesMater_REPOSITORIO_COMPLETO.zip
          retention-days: 90
