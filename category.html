<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo | MarquesMater</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="v5.css"><link rel="stylesheet" href="v7.css"><link rel="stylesheet" href="v7.1.css"><link rel="stylesheet" href="v7.2.css"></head><body><div class="top">ENTREGA EM PORTUGAL CONTINENTAL · LEVANTAMENTO EM LOJA · APOIO AO CLIENTE</div><header><div class="wrap head"><a class="logo" href="index.html">MARQUES<span>MATER</span></a><div class="search"><input id="q" placeholder="Pesquisar produtos, marcas ou referências..."><button onclick="goSearch()">⌕</button></div><div class="actions"><a href="#">♙<small>Conta</small></a><a href="#">♡<small>Favoritos</small></a><a href="cart.html">🛒<small>Carrinho <b id="cartCount">0</b></small></a></div></div></header><nav><div class="wrap nav" id="nav"></div></nav><main class="wrap section"><div class="crumb"><a href="index.html">Início</a> / Catálogo</div><span class="eyebrow dark">CATÁLOGO · V7.2</span><h1 id="title">Produtos</h1><p id="intro"></p><div class="subcats" id="subcats"></div><div class="tools"><span id="count"></span><select id="sort"><option value="featured">Destaques</option><option value="low">Preço mais baixo</option><option value="high">Preço mais alto</option></select></div><div class="products" id="products"></div></main><footer><div class="copy">© MarquesMater · V7.2</div></footer><script src="js/catalog.js"></script><script src="js/chat.js"></script><script>document.getElementById('nav').innerHTML=MM_CATEGORIES.map(c=>`<a href="category.html?cat=${encodeURIComponent(c)}">${c}</a>`).join('');const ps=new URLSearchParams(location.search),q=(ps.get('q')||'').toLowerCase(),cat=ps.get('cat')||'Construção';document.getElementById('title').textContent=q?'Resultados da pesquisa':'Comprar '+cat;document.getElementById('intro').textContent=q?'Resultados locais para “'+q+'”.':'Escolhe uma subcategoria e abre cada produto para ver as opções técnicas.';let current='';const subs=MM_SUBCATEGORIES[cat]||[];document.getElementById('subcats').innerHTML=subs.map(s=>`<button onclick="filterSub('${s.replace(/'/g,"\\'")}')">${s}</button>`).join('');function render(){let a=MARQUES_CATALOG.filter(p=>q?(p.name+' '+p.brand+' '+p.category+' '+p.subcategory).toLowerCase().includes(q):p.category===cat);if(current)a=a.filter(p=>p.subcategory===current);let s=document.getElementById('sort').value;if(s==='low')a.sort((x,y)=>x.price-y.price);if(s==='high')a.sort((x,y)=>y.price-x.price);document.getElementById('count').textContent=a.length+' produto(s)';document.getElementById('products').innerHTML=a.length?a.map(p=>`<a href="product.html?sku=${encodeURIComponent(p.sku)}"><article class="product">${p.badge?`<em>${p.badge}</em>`:''}<img src="${p.image}"><div><small>${p.brand}</small><h3>${p.name}</h3><strong>${p.price.toFixed(2).replace('.',',')} €</strong></div></article></a>`).join(''):'<p>Nenhum produto encontrado.</p>'}function filterSub(s){current=current===s?'':s;render()}document.getElementById('sort').onchange=render;function goSearch(){let x=document.getElementById('q').value.trim();if(x)location.href='category.html?q='+encodeURIComponent(x)}document.getElementById('cartCount').textContent=localStorage.getItem('mm_cart_count')||0;render();</script></body></html>
