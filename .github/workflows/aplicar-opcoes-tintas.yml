name: Aplicar opcoes de tintas

on:
  push:
    paths:
      - '.github/paint-options-trigger'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar alterações
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          admin=root/'admin.html'
          s=admin.read_text(encoding='utf-8')
          tag='<script src="/assets/paint-options.js"></script>'
          if tag not in s:
              s=s.replace('</body></html>',tag+'</body></html>')
              admin.write_text(s,encoding='utf-8')

          prod=root/'produto-wc.html'
          s=prod.read_text(encoding='utf-8')
          if tag not in s:
              s=s.replace('</body></html>',tag+'</body></html>')
              prod.write_text(s,encoding='utf-8')

          js=r'''/* MarquesMater — opções de tintas / acabamentos */
          (function(){
            const META_KEY='_mm_options';
            function parseTech(t){let x=t;if(typeof x==='string'){try{x=JSON.parse(x)}catch{return {base:[x],meta:null}}}if(Array.isArray(x)){let meta=null,base=[];x.forEach(v=>{if(v&&typeof v==='object'&&v[META_KEY])meta=v[META_KEY];else base.push(v)});return {base,meta}}if(x&&typeof x==='object'&&x[META_KEY])return {base:[],meta:x[META_KEY]};return {base:x?[x]:[],meta:null}}
            function getMeta(p){return parseTech(p&&p.tech).meta||{finish:{enabled:false,options:[]},color:{enabled:false,options:[]}}}
            function adminUI(){const modal=document.getElementById('productModal');if(!modal||document.getElementById('mmPaintOptions'))return;const grid=modal.querySelector('.grid');if(!grid)return;const box=document.createElement('div');box.id='mmPaintOptions';box.className='field full';box.style.cssText='margin-top:14px;padding:15px;border:1px solid #e1e6eb;border-radius:12px;background:#fafbfc';box.innerHTML='<div style="font-weight:900;font-size:14px;margin-bottom:5px">Opções de tinta</div><div class="muted" style="margin-bottom:12px">Escolha se este produto mostra acabamento e cor na ficha da loja.</div><div class="grid" style="margin:0"><div class="field"><label>Mostrar escolha de acabamento</label><select class="input" id="mmFinishEnabled"><option value="false">Não</option><option value="true">Sim</option></select></div><div class="field"><label>Acabamentos disponíveis</label><div style="display:flex;gap:12px;flex-wrap:wrap;padding:9px 0"><label><input type="checkbox" id="mmFinishMate"> Mate</label><label><input type="checkbox" id="mmFinishAcetinado"> Acetinado</label><label><input type="checkbox" id="mmFinishOpaco"> Opaco</label></div></div><div class="field"><label>Mostrar escolha de cor</label><select class="input" id="mmColorEnabled"><option value="false">Não</option><option value="true">Sim</option></select></div><div class="field"><label>Cores disponíveis</label><div style="display:flex;gap:12px;flex-wrap:wrap;padding:9px 0"><label><input type="checkbox" id="mmColorIncolor"> Incolor</label><label><input type="checkbox" id="mmColorCatalogo"> Cores de catálogo</label></div></div></div>' ;grid.insertAdjacentElement('afterend',box)}
            function fillUI(p){adminUI();const m=getMeta(p||{}),f=m.finish||{},c=m.color||{};mmFinishEnabled.value=f.enabled?'true':'false';mmFinishMate.checked=(f.options||[]).includes('Mate');mmFinishAcetinado.checked=(f.options||[]).includes('Acetinado');mmFinishOpaco.checked=(f.options||[]).includes('Opaco');mmColorEnabled.value=c.enabled?'true':'false';mmColorIncolor.checked=(c.options||[]).includes('Incolor');mmColorCatalogo.checked=(c.options||[]).includes('Cores de catálogo')}
            function readUI(){return {finish:{enabled:mmFinishEnabled.value==='true',options:[mmFinishMate.checked?'Mate':null,mmFinishAcetinado.checked?'Acetinado':null,mmFinishOpaco.checked?'Opaco':null].filter(Boolean)},color:{enabled:mmColorEnabled.value==='true',options:[mmColorIncolor.checked?'Incolor':null,mmColorCatalogo.checked?'Cores de catálogo':null].filter(Boolean)}}}
            function merge(p){const t=parseTech(p&&p.tech),modal=document.getElementById('productModal');let meta=t.meta;if(modal&&modal.classList.contains('open'))meta=readUI();else if(!meta)meta={finish:{enabled:false,options:[]},color:{enabled:false,options:[]}};return {...p,tech:[...(t.base||[]),{[META_KEY]:meta}]}}
            function hook(){adminUI();if(typeof window.openProduct==='function'&&!window.__mmOpenHook){const old=window.openProduct;window.openProduct=function(i=null){adminUI();old(i);setTimeout(()=>{try{fillUI(i===null?{}:data.products[i])}catch(e){}},0)};window.__mmOpenHook=true}if(typeof window.saveProductObj==='function'&&!window.__mmSaveHook){const old=window.saveProductObj;window.saveProductObj=function(p){return old(merge(p))};window.__mmSaveHook=true}}
            function page(){let n=0;const timer=setInterval(()=>{n++;try{if(typeof P==='undefined'||!P){if(n>100)clearInterval(timer);return}const m=getMeta(P),f=m.finish||{},c=m.color||{},buy=document.querySelector('.buy-card');if(!buy){if(n>100)clearInterval(timer);return}if(f.enabled&&f.options?.length&&!document.getElementById('mmFinishPublic')){const w=document.createElement('div');w.id='mmFinishPublic';w.innerHTML='<div class="variant-title">Acabamento</div><div class="variant-grid">'+f.options.map((x,i)=>'<button type="button" class="variant-btn mm-opt-finish '+(i?'':'active')+'">'+x+'</button>').join('')+'</div>';const a=buy.querySelector('.variant-grid');(a?a.parentElement:buy.querySelector('.buy-row')).insertAdjacentElement('afterend',w);w.querySelectorAll('.mm-opt-finish').forEach(b=>b.onclick=()=>{w.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')})}if(c.enabled&&c.options?.length&&!document.getElementById('mmColorPublic')){const w=document.createElement('div');w.id='mmColorPublic';w.innerHTML='<div class="variant-title">Cor</div><div class="variant-grid">'+c.options.map((x,i)=>'<button type="button" class="variant-btn mm-opt-color '+(i?'':'active')+'">'+x+'</button>').join('')+'</div>';const a=document.getElementById('mmFinishPublic')||buy.querySelector('.variant-grid');(a||buy.querySelector('.buy-row')).insertAdjacentElement('afterend',w);w.querySelectorAll('.mm-opt-color').forEach(b=>b.onclick=()=>{w.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')})}document.querySelectorAll('.tech-item').forEach(e=>{if(e.textContent.includes(META_KEY))e.remove()});clearInterval(timer)}catch(e){if(n>100)clearInterval(timer)}},200)}
            if(document.getElementById('productModal')){hook();setInterval(hook,500)}else page();
          })();
          '''
          (root/'assets').mkdir(exist_ok=True)
          (root/'assets/paint-options.js').write_text(js,encoding='utf-8')

          server=root/'server.py'
          s=server.read_text(encoding='utf-8')
          if 'def ensure_woodneuce_product()' not in s:
              block=r'''

def ensure_woodneuce_product():
    """Seed Woodneuce with package, finish and colour choices."""
    try:
        c=db()
        p={
          'slug':'woodneuce','id':'woodneuce','name':'Woodneuce — Lasur','ref':'WOODNEUCE','family':'Pinturas','category':'Pinturas','subfamily':'Tinta Exterior','brand':'NEUCE',
          'price':11.60,'price_display':'Desde 11,60 €','promo_price':None,'stock':0,'min_stock':0,'state':'active',
          'description':'Lasur aquoso decorativo para protecção e decoração de madeiras, interior e exterior. Produto microporoso de base acrílica aquosa, inodoro e com protecção contra humidade e intempéries.',
          'variants':[{'name':'0,75 L','price':'11,60 €','stock':0},{'name':'4 L','price':'59,90 €','stock':0}],
          'image':'','gallery':[],'docs':[{'title':'Ficha técnica WOODNEUCE — NEUCE','url':'https://www.neuce.com/'}],
          'tech':['Tipo: Lasur aquoso decorativo','Aplicação: madeira interior e exterior','Rendimento: 13–15 m²/L por demão','Acabamentos: Mate, Acetinado e Opaco','Embalagens: 0,75 L e 4 L',{'_mm_options':{'finish':{'enabled':True,'options':['Mate','Acetinado','Opaco']},'color':{'enabled':True,'options':['Incolor','Cores de catálogo']}}}]
        }
        put_product(c,p); c.commit(); c.close()
    except Exception as e: print('Woodneuce seed:',e)

'''
              m=re.search(r'\nclass\s+\w+\(',s)
              if not m: raise SystemExit('Não encontrei a classe principal no server.py')
              s=s[:m.start()]+block+'ensure_woodneuce_product()\n\n'+s[m.start():]
              server.write_text(s,encoding='utf-8')
          trig=root/'.github/paint-options-trigger'
          if trig.exists():trig.unlink()
          PY
      - name: Commit alterações
        shell: bash
        run: |
          git config user.name 'MarquesMater Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html produto-wc.html server.py assets/paint-options.js .github/paint-options-trigger
          git diff --cached --quiet && exit 0
          git commit -m 'Adicionar opções de acabamento e cor às tintas'
          git push
