name: V26 run fix
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/v26-run-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/v26_runtime_fix.py
      - run: python3 -m py_compile server.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'MarquesMater V26 - topicos 1 a 5' || true
          git push origin HEAD:main
