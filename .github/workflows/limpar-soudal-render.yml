name: Corrigir Soudal no Render

# Woodneuce + opções de acabamento/cor + imagem do produto + visual profissional do Back Office.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir server.py — Soudal e Woodneuce
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('server.py'); s=p.read_text(encoding='utf-8')
          marker='ensure_v19_catalog()\n'
          inject='''ensure_v19_catalog()\n\ndef ensure_soudal_only_trex():\n    c=db(); c.execute("DELETE FROM products WHERE brand='Soudal' AND slug <> 'soudal-t-rex-power-290ml'"); c.execute("DELETE FROM brands WHERE name='Soudal'"); c.commit(); c.close()\n\nensure_soudal_only_trex()\n'''
          if 'def ensure_soudal_only_trex()' not in s:
              if marker not in s: raise SystemExit('Marcador Soudal não encontrado')
              s=s.replace(marker,inject,1)
          if 'def ensure_woodneuce_product()' not in s:
              fn='''\n# MM-WOODNEUCE\ndef ensure_woodneuce_product():\n    try:\n        c=db()\n        variants=[]\n        for finish in ['Acetinado','Mate']:\n            fcode='ACET' if finish=='Acetinado' else 'MATE'\n            for color,label in [('Incolor','INC'),('Cores de catálogo','COR')]:\n                for pack,pc in [('0,75 L','075'),('4 L','004')]:\n                    sku=f'WOODNEUCE-{fcode}-{pc}-{label}'\n                    price='11,60 €' if pack=='0,75 L' else '59,90 €'\n                    variants.append({'name':pack,'packaging':pack,'finish':finish,'color':color,'sku':sku,'price':price,'stock':0,'active':True,'image':'/assets/woodneuce.svg'})\n        p={'slug':'woodneuce','id':'woodneuce','name':'Woodneuce — Lasur','ref':'WOODNEUCE','family':'Pinturas','category':'Pinturas','subfamily':'Tinta Exterior','brand':'NEUCE','price':11.60,'price_display':'Desde 11,60 €','stock':0,'min_stock':0,'state':'active','description':'Lasur aquoso decorativo para protecção e decoração de madeiras, interior e exterior. Produto microporoso de raiz acrílica, à base de água, inodoro, com acabamento Acetinado ou Mate e disponível em Incolor ou Cores de catálogo.','variants':variants,'image':'/assets/woodneuce.svg','gallery':['/assets/woodneuce.svg'],'docs':[{'title':'Produto WOODNEUCE — NEUCE','url':'https://www.neuce.com/p180-p-934-woodneuce-pt_pt'},{'title':'Catálogo WOODNEUCE — NEUCE','url':'https://www.neuce.com/files/media/145_2.pdf?d=V1'}],'tech':['Tipo: Lasur aquoso decorativo','Aplicação: madeira interior e exterior','Rendimento: 13–15 m²/L por demão','Acabamentos: Acetinado e Mate','Embalagens: 0,75 L e 4 L','Cores: Incolor e Cores de catálogo',{'_mm_options':{'packaging':{'enabled':True},'finish':{'enabled':True,'options':['Acetinado','Mate']},'color':{'enabled':True,'options':['Incolor','Cores de catálogo']}}}]}\n        put_product(c,p); c.commit(); c.close()\n    except Exception as e: print('Woodneuce seed:',e)\n\n'''
              pos=s.find('ensure_v26_runtime_fixes()')
              if pos<0: raise SystemExit('Startup V26 não encontrado')
              s=s[:pos]+fn+'ensure_woodneuce_product()\n'+s[pos:]
          else:
              s=s.replace("'image':'','gallery':[]", "'image':'/assets/woodneuce.svg','gallery':['/assets/woodneuce.svg']")
          s=re.sub(r'\n# MM-NEUCE-FINAL-SERVER.*?(?=\nensure_v26_runtime_fixes\(\))','',s,flags=re.S)
          s=s.replace('\nensure_neuce_final()\n','\n')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Ligar visual profissional V2 do editor de tintas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/assets/paint-visual-v2.js?v=20260910-1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: python3 -m py_compile server.py
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py admin.html
          if git diff --cached --quiet; then echo "Sem alterações"; else git commit -m "Adicionar variantes Woodneuce acetinado e mate"; git push origin main; fi
