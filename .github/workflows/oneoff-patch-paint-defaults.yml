name: Definir preços por defeito das tintas
on:
  push:
    paths:
      - 'scripts/patch_paint_defaults.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server.py
        run: python scripts/patch_paint_defaults.py
      - name: Commit e remover ficheiros temporários
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.py
          git rm -f scripts/patch_paint_defaults.py .github/workflows/oneoff-patch-paint-defaults.yml
          git commit -m 'Definir preço mínimo e embalagens por defeito nas tintas'
          git push
