name: Aplicar homepage V10 e categorias

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aplicar-categorias-mosaico.yml'
      - '.github/homepage_v10.py'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar homepage V10
        run: python3 .github/homepage_v10.py
      - name: Guardar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html
          git commit -m "Homepage V10 profissional + gestor de imagens" || exit 0
          git push
