name: Aplicar V26 - tópicos 1 a 5
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aplicar-v26-topicos.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correções V26
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, sqlite3, re

          root=Path('.')

          # 1) Credenciais Back Office: admin / admin
          h=hashlib.sha256(b'admin').hexdigest()
          (root/'data/admin.json').write_text(json.dumps({'username':'admin','password_sha256':h},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # 2/3) Menu/famílias: as 5 etiquetas atuais ficam como base; daqui para a frente show_top é persistente.
          nav=root/'nav.js'
          s=nav.read_text(encoding='utf-8')
          old=".filter(f=>f.name && f.show_menu !== false);"
          new=".filter(f=>f.name && f.show_menu !== false && f.show_top !== false);"
          if old in s:
              s=s.replace(old,new,1)
          nav.write_text(s,encoding='utf-8')

          # 5) Produtos Neuce: dados locais, imagens locais e documentação local.
          dbp=root/'data/catalog.db'
          c=sqlite3.connect(dbp)
          c.row_factory=sqlite3.Row
          products={
            'neucebel': {
              'match':['neucebel'], 'name':'NeuceBel', 'family':'Pinturas', 'subfamily':'Tinta Exterior',
              'image':'assets/neuce/neucebel.png', 'variants':[{'name':'1L','price':'','stock':0},{'name':'5L','price':'','stock':0},{'name':'15L','price':'','stock':0}],
              'docs':[{'title':'Ficha técnica NeuceBel','url':'docs/neuce/neucebel-ficha-tecnica.pdf'},{'title':'Produto oficial NEUCE','url':'https://www.neuce.com/p180-p-881-neucebel-pt_pt'}],
              'manufacturer_url':'https://www.neuce.com/p180-p-881-neucebel-pt_pt',
              'description':'Tinta plástica exterior/interior de boa qualidade, com boa cobertura, rendimento e resistência ao desenvolvimento de fungos e algas.',
              'tech':['Tinta estireno-acrílica extra mate','Interior e exterior','Afinável no sistema BIGMIX','Fácil aplicação e boa aderência','Bom poder de cobertura e rendimento','Resistente a fungos e algas','Rendimento orientativo: 12 m²/L','Diluição: água 5-10%']
            },
            'neucematt': {
              'match':['neucematt'], 'name':'NeuceMatt', 'family':'Pinturas', 'subfamily':'Tinta Interior',
              'image':'assets/neuce/neucematt.jpg', 'variants':[{'name':'5L','price':'','stock':0},{'name':'15L','price':'','stock':0}],
              'docs':[{'title':'Ficha técnica NeuceMatt','url':'docs/neuce/neucematt-ficha-tecnica.pdf'},{'title':'Produto oficial NEUCE','url':'https://www.neuce.com/p180-p-1026-neucematt-pt_pt'}],
              'manufacturer_url':'https://www.neuce.com/p180-p-1026-neucematt-pt_pt',
              'description':'Tinta plástica mate para interiores e exteriores, indicada para vários suportes e com boa resistência à lavagem e esfrega húmida.',
              'tech':['Tinta plástica mate','Interior e exterior','Fácil aplicação e boa aderência','Bom rendimento','Bom poder de cobertura','Resistente à lavagem e esfrega húmida','Rendimento orientativo: 11,5 m²/L','Diluição: água 5%']
            },
            'neucesoft': {
              'match':['neucesoft','neucesoft'], 'name':'NeuceSoft', 'family':'Pinturas', 'subfamily':'Tinta Interior',
              'image':'assets/neuce/neucesoft.jpeg', 'variants':[{'name':'1L','price':'','stock':0},{'name':'5L','price':'','stock':0},{'name':'15L','price':'','stock':0}],
              'docs':[{'title':'Ficha técnica NeuceSoft','url':'docs/neuce/neucesoft-ficha-tecnica.pdf'},{'title':'Produto oficial NEUCE','url':'https://www.neuce.com/p180-p-886-neucesoft-mo_pt'}],
              'manufacturer_url':'https://www.neuce.com/p180-p-886-neucesoft-mo_pt',
              'description':'Tinta plástica aquosa sedosa de alta qualidade para paredes interiores, com boa lacagem, opacidade, brancura e resistência à esfrega húmida.',
              'tech':['Tinta plástica aquosa vinílica','Acabamento sedoso','Interior','Afinável no sistema BIGMIX','Boa lacagem, opacidade e brancura','Fácil aplicação e bom rendimento','Boa resistência à esfrega húmida frequente','Rendimento orientativo: 14 m²/L','Diluição: água 10% / 5-10%']
            }
          }
          rows=c.execute("SELECT slug,name FROM products").fetchall()
          for r in rows:
              slug=(r['slug'] or '').lower()
              name=(r['name'] or '').lower().replace(' ','')
              key=None
              if 'neucebel' in slug or 'neucebel' in name: key='neucebel'
              elif 'neucematt' in slug or 'neucematt' in name: key='neucematt'
              elif 'neucesoft' in slug or 'neucesoft' in name: key='neucesoft'
              if not key: continue
              p=products[key]
              c.execute('''UPDATE products SET name=?,family=?,category=?,subfamily=?,brand='NEUCE',price=0,price_display='Preço por variante',promo_price=NULL,promo_enabled=0,supplier='NEUCE',manufacturer_url=?,description=?,tech=?,image=?,gallery_json=?,docs_json=?,doc=?,variants_json=?,updated_at=CURRENT_TIMESTAMP WHERE slug=?''',(
                p['name'],p['family'],p['family'],p['subfamily'],p['manufacturer_url'],p['description'],json.dumps(p['tech'],ensure_ascii=False),p['image'],json.dumps([p['image']],ensure_ascii=False),json.dumps(p['docs'],ensure_ascii=False),p['docs'][0]['url'],json.dumps(p['variants'],ensure_ascii=False),r['slug']))
          c.execute("INSERT OR IGNORE INTO brands(name) VALUES('NEUCE')")
          c.commit(); c.close()

          # 1) Corrigir imagem persistente do T-Rex Power no SQLite do Render.
          c=sqlite3.connect(dbp)
          variants=[
            {'name':'Branco','color':'Branco','label':'290ml / Branco','price':12.95,'image':'assets/soudal/trex-power-290-branco.jpg','asset_image':'assets/soudal/trex-power-290-branco.jpg'},
            {'name':'Cinzento','color':'Cinzento','label':'290ml / Cinzento','price':12.95,'image':'assets/soudal/trex-power-290-cinzento.jpg','asset_image':'assets/soudal/trex-power-290-cinzento.jpg'},
            {'name':'Preto','color':'Preto','label':'290ml / Preto','price':12.95,'image':'assets/soudal/trex-power-290-preto.jpg','asset_image':'assets/soudal/trex-power-290-preto.jpg'},
            {'name':'Bege','color':'Bege','label':'290ml / Bege','price':12.95,'image':'assets/soudal/trex-power-290-bege.jpg','asset_image':'assets/soudal/trex-power-290-bege.jpg'},
            {'name':'Terracota','color':'Terracota','label':'290ml / Terracota','price':12.95,'image':'assets/soudal/trex-power-290-terracota.jpg','asset_image':'assets/soudal/trex-power-290-terracota.jpg'},
            {'name':'Transparente','color':'Transparente','label':'290ml / Transparente','price':12.95,'image':'assets/soudal/trex-power-290-transparente.jpg','asset_image':'assets/soudal/trex-power-290-transparente.jpg'}]
          gallery=[x['image'] for x in variants]
          c.execute("UPDATE products SET brand='Soudal',family='Construção',category='Colas e Selantes',subfamily='Adesivos de Montagem',price=12.95,price_display='12,95 €',image=?,gallery_json=?,variants_json=?,doc='docs/soudal/soudal-t-rex-power-290ml.pdf',docs_json=?,updated_at=CURRENT_TIMESTAMP WHERE slug='soudal-t-rex-power-290ml'",(variants[0]['image'],json.dumps(gallery,ensure_ascii=False),json.dumps(variants,ensure_ascii=False),json.dumps([{'title':'Ficha técnica Soudal T-Rex Power 290ml','url':'docs/soudal/soudal-t-rex-power-290ml.pdf'},{'title':'Página oficial Soudal','url':'https://www.soudal.pt/pro/produtos/gama-t-rex/cola-veda-t-rex/t-rex-power'}],ensure_ascii=False)))
          c.commit(); c.close()

          # 2/3) Defaults de navegação: apenas as 5 etiquetas que estavam visíveis na homepage.
          sd=root/'data/site_data.json'
          if sd.exists():
              d=json.loads(sd.read_text(encoding='utf-8'))
          else:
              d={'settings':{},'families':[]}
          top={'Ferramentas','Pinturas','Máquinas','Colas e Selantes','Sprays e Aerossóis'}
          marker=d.setdefault('settings',{}).get('v26_top_visibility_initialized')
          if not marker:
              for f in d.get('families',[]):
                  if isinstance(f,dict):
                      f['show_top']=f.get('name') in top
                      f.setdefault('show_menu',True); f.setdefault('show_bottom',True)
              d['settings']['v26_top_visibility_initialized']=True
              sd.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')

          # Versão
          (root/'VERSAO.txt').write_text('MarquesMater V26 — correções de persistência, login, imagens Soudal e catálogo Neuce\n',encoding='utf-8')

          # server.py: correções persistentes no Render para login, visibilidade e T-Rex/Neuce.
          sp=root/'server.py'; ss=sp.read_text(encoding='utf-8')
          marker='def ensure_v26_runtime_fixes():'
          if marker not in ss:
              insert='''\n\ndef ensure_v26_runtime_fixes():\n    """V26: preserve family visibility, admin credentials and local product images/data across Render restarts."""\n    # Admin login is explicitly admin/admin.\n    c=db()\n    h=hashlib.sha256(b"admin").hexdigest()\n    c.execute("INSERT OR IGNORE INTO admin_users(username,password_sha256,role,display_name,online) VALUES(?,?,?,?,0)",(\"admin\",h,\"owner\",\"Administrador\"))\n    c.execute("UPDATE admin_users SET password_sha256=?,role='owner',display_name='Administrador' WHERE username='admin'",(h,))\n\n    # T-Rex Power must always use repository-local images.\n    variants=[\n      {\"name\":\"Branco\",\"color\":\"Branco\",\"label\":\"290ml / Branco\",\"price\":12.95,\"image\":\"assets/soudal/trex-power-290-branco.jpg\",\"asset_image\":\"assets/soudal/trex-power-290-branco.jpg\"},\n      {\"name\":\"Cinzento\",\"color\":\"Cinzento\",\"label\":\"290ml / Cinzento\",\"price\":12.95,\"image\":\"assets/soudal/trex-power-290-cinzento.jpg\",\"asset_image\":\"assets/soudal/trex-power-290-cinzento.jpg\"},\n      {\"name\":\"Preto\",\"color\":\"Preto\",\"label\":\"290ml / Preto\",\"price\":12.95,\"image\":\"assets/soudal/trex-power-290-preto.jpg\",\"asset_image\":\"assets/soudal/trex-power-290-preto.jpg\"},\n      {\"name\":\"Bege\",\"color\":\"Bege\",\"label\":\"290ml / Bege\",\"price\":12.95,\"image\":\"assets/soudal/trex-power-290-bege.jpg\",\"asset_image\":\"assets/soudal/trex-power-290-bege.jpg\"},\n      {\"name\":\"Terracota\",\"color\":\"Terracota\",\"label\":\"290ml / Terracota\",\"price\":12.95,\"image\":\"assets/soudal/trex-power-290-terracota.jpg\",\"asset_image\":\"assets/soudal/trex-power-290-terracota.jpg\"},\n      {\"name\":\"Transparente\",\"color\":\"Transparente\",\"label\":\"290ml / Transparente\",\"price\":12.95,\"image\":\"assets/soudal/trex-power-290-transparente.jpg\",\"asset_image\":\"assets/soudal/trex-power-290-transparente.jpg\"}]\n    c.execute(\"UPDATE products SET brand='Soudal',family='Construção',category='Colas e Selantes',subfamily='Adesivos de Montagem',price=12.95,price_display='12,95 €',image=?,gallery_json=?,variants_json=?,doc='docs/soudal/soudal-t-rex-power-290ml.pdf',docs_json=? WHERE slug='soudal-t-rex-power-290ml'\",(variants[0]['image'],json.dumps([x['image'] for x in variants],ensure_ascii=False),json.dumps(variants,ensure_ascii=False),json.dumps([{\"title\":\"Ficha técnica Soudal T-Rex Power 290ml\",\"url\":\"docs/soudal/soudal-t-rex-power-290ml.pdf\"}],ensure_ascii=False)))\n\n    # Neuce products: always keep local image paths and NEUCE as manufacturer/brand.\n    ne={\n      'neucebel':('NeuceBel','assets/neuce/neucebel.png','Tinta Exterior',[{'name':'1L','price':'','stock':0},{'name':'5L','price':'','stock':0},{'name':'15L','price':'','stock':0}]),\n      'neucematt':('NeuceMatt','assets/neuce/neucematt.jpg','Tinta Interior',[{'name':'5L','price':'','stock':0},{'name':'15L','price':'','stock':0}]),\n      'neucesoft':('NeuceSoft','assets/neuce/neucesoft.jpeg','Tinta Interior',[{'name':'1L','price':'','stock':0},{'name':'5L','price':'','stock':0},{'name':'15L','price':'','stock':0}])}\n    for slug,(name,img,sub,variants) in ne.items():\n        c.execute(\"UPDATE products SET name=?,family='Pinturas',category='Pinturas',subfamily=?,brand='NEUCE',price=0,price_display='Preço por variante',promo_price=NULL,promo_enabled=0,supplier='NEUCE',image=?,gallery_json=?,variants_json=? WHERE slug=? OR lower(name)=lower(?)\",(name,sub,img,json.dumps([img],ensure_ascii=False),json.dumps(variants,ensure_ascii=False),slug,name))\n    c.execute(\"INSERT OR IGNORE INTO brands(name) VALUES('NEUCE')\")\n\n    # Persist family visibility in site_data.json; do not overwrite an already chosen setting.\n    d=site_data()\n    top={'Ferramentas','Pinturas','Máquinas','Colas e Selantes','Sprays e Aerossóis'}\n    hp=d.setdefault('settings',{})\n    if not hp.get('v26_top_visibility_initialized'):\n        for f in d.get('families',[]):\n            if isinstance(f,dict):\n                f['show_top']=f.get('name') in top\n                f.setdefault('show_menu',True); f.setdefault('show_bottom',True)\n        hp['v26_top_visibility_initialized']=True\n        write_json(DATA/'site_data.json',d)\n    c.commit(); c.close()\n\nensure_v26_runtime_fixes()\n'''
              ss=ss.replace('\nnormalize_product_taxonomy()\n', '\nnormalize_product_taxonomy()\n'+insert,1)
          ss=ss.replace("MarquesMater V25 server:","MarquesMater V26 server:")
          ss=ss.replace("'version':'V25'","'version':'V26'")
          sp.write_text(ss,encoding='utf-8')

          # Back Office login form should no longer show the old password value.
          ap=root/'admin.html'; a=ap.read_text(encoding='utf-8'); a=a.replace('value="admin123"','value="admin"'); a=a.replace('Back Office V25','Back Office V26'); ap.write_text(a,encoding='utf-8')
          PY

      - name: Descarregar imagens e fichas Neuce para o repositório
        shell: bash
        run: |
          set -e
          mkdir -p assets/neuce docs/neuce
          curl -L --fail --retry 3 'https://templodastintas.pt/cdn/shop/files/neucebel.png?v=1705605720&width=533' -o assets/neuce/neucebel.png
          curl -L --fail --retry 3 'https://cdn-shopkit.com/usercontent/tintas-vital/media/images/square/37a3a6a-neucesoft.jpeg' -o assets/neuce/neucesoft.jpeg
          curl -L --fail --retry 3 'https://www.saniluz.pt/cdn/shop/files/5602920000587.jpg?v=1733586586' -o assets/neuce/neucematt.jpg
          curl -L --fail --retry 3 'https://www.neuce.com/files/ficha_tec/ft_03-03_vr8_pt.pdf' -o docs/neuce/neucebel-ficha-tecnica.pdf
          curl -L --fail --retry 3 'https://filedn.eu/lSlvke6ltvtSSvzVtcrnBbk/4669636861735465636e69636173/5602920000570.pdf' -o docs/neuce/neucematt-ficha-tecnica.pdf
          curl -L --fail --retry 3 'https://cdn-shopkit.com/usercontent/tintas-vital/media/files/5fba0a4-neucesoft-ficha-tecnica.pdf' -o docs/neuce/neucesoft-ficha-tecnica.pdf
          file assets/neuce/* docs/neuce/*

      - name: Validar Python e SQLite
        shell: bash
        run: |
          python3 -m py_compile server.py
          python3 - <<'PY'
          import sqlite3, json
          c=sqlite3.connect('data/catalog.db')
          for slug in ['soudal-t-rex-power-290ml']:
              r=c.execute('select image,brand,price_display from products where slug=?',(slug,)).fetchone(); assert r and r[0].startswith('assets/') and r[1]=='Soudal'
          for name in ['NeuceBel','NeuceMatt','NeuceSoft']:
              r=c.execute('select image,brand,price_display from products where lower(name)=lower(?)',(name,)).fetchone(); assert r and r[0].startswith('assets/neuce/') and r[1]=='NEUCE' and r[2]=='Preço por variante'
          c.close()
          PY

      - name: Commit e push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --quiet && exit 0
          git commit -m 'MarquesMater V26 - tópicos 1 a 5'
          git push origin HEAD:main

      - name: Criar backup completo V26
        shell: bash
        run: |
          git archive --format=zip --output=MarquesMater_V26_COMPLETO.zip HEAD

      - name: Guardar backup como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MarquesMater_V26_COMPLETO
          path: MarquesMater_V26_COMPLETO.zip
          retention-days: 30
