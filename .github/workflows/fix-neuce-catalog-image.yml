name: Fix NeuceMatt catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir imagem e catálogo
        run: |
          set -e
          if [ -f assets/neucematt-real.jpg ]; then
            mv assets/neucematt-real.jpg assets/neucematt-real.png
          fi
          sed -i 's#assets/neucematt-real\.jpg#assets/neucematt-real.png#g' catalogo.html
          sed -i "s#<span class=\"more\">Ver produto →</span>##g" catalogo.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.html assets/neucematt-real.jpg assets/neucematt-real.png
          if git diff --cached --quiet; then
            echo "Sem alterações"
            exit 0
          fi
          git commit -m "Corrigir imagem NeuceMatt e remover Ver produto"
          git push
      - name: Remover workflow temporário
        if: always()
        run: |
          git rm -f .github/workflows/fix-neuce-catalog-image.yml || true
          git commit -m "Remover workflow temporário" || true
          git push || true
