name: Corrigir tópicos 1 e 2
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/corrigir-topicos-1-2.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir famílias e destaque RIDA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          # Restaurar as famílias e a visibilidade individual do topo.
          families=[
            ('Ferramentas',['Ferramentas a Bateria','Ferramentas Eléctricas','Ferramentas Pneumáticas','Medição'],'assets/family-icons/tools.png'),
            ('Construção',['Materiais de Construção','Colas e Fitas','Níveis','Silicone','Máquinas de cortar azulejo'],'assets/family-icons/construction.png'),
            ('Jardim/Agricultura',['Rega','Poda','Máquinas de Jardim','Pulverização'],'assets/family-icons/garden-vito.png'),
            ('Pinturas',['Tinta Interior','Tinta Exterior','Acessórios','Diluentes','Tintas em Spray'],'assets/family-icons/paint-neuce.png'),
            ('Ferragens',['Fixação','Diferenciais','Acessórios'],'assets/family-icons/hardware.png'),
            ('Iluminação',['Interior','Exterior','LED'],'assets/family-icons/lighting.png'),
            ('Casa',['Limpeza','Organização'],'assets/family-icons/home.png'),
            ('Bricolage',['Consumíveis','Acessórios'],'assets/family-icons/diy.png'),
            ('Material Elétrico',['Cabos','Tomadas','Acessórios'],'assets/family-icons/electric.png'),
            ('Protecção Individual',['Luvas','Calçado','Vestuário'],'assets/family-icons/ppe.png'),
            ('Máquinas',['Máquinas com fio','Máquinas sem fio'],'assets/family-icons/machines-rida.png'),
            ('Colas e Selantes',['Colas','Silicones','Selantes','Espumas PU','Adesivos de Montagem'],'assets/family-icons/construction.png'),
            ('Sprays e Aerossóis',['Tintas em Spray','Lubrificantes','Desbloqueantes','Limpeza','Proteção','Outros Sprays Técnicos'],'assets/family-icons/spray-aerosol.svg')]
          top={'Ferramentas','Pinturas','Máquinas','Colas e Selantes'}
          p=root/'data/site_data.json'
          d=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          existing={f.get('name'):f for f in d.get('families',[]) if isinstance(f,dict)}
          out=[]
          for name,subs,icon in families:
              f=dict(existing.get(name) or {})
              f.update({'name':name,'subs':subs,'icon':f.get('icon') or icon,'show_top':name in top,'show_bottom':f.get('show_bottom',True),'show_menu':f.get('show_menu',True)})
              out.append(f)
          d.setdefault('settings',{})['v26_top_visibility_initialized']=True
          d['families']=out
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          # A visibilidade do topo não deve esconder famílias do menu.
          p=root/'nav.js'; s=p.read_text(encoding='utf-8')
          s=s.replace(".filter(f=>f.name && f.show_menu !== false && f.show_top !== false);", ".filter(f=>f.name && f.show_menu !== false);")
          p.write_text(s,encoding='utf-8')
          # Preencher a grelha RIDA com 8 cartões: os destacados primeiro e depois os restantes.
          p=root/'index.html'; s=p.read_text(encoding='utf-8')
          old="const rp=(rida||[]).filter(p=>p.brand==='RIDA'&&p.featured).slice(0,6);document.getElementById('rida-featured').innerHTML=(rp.length?rp:(rida||[]).slice(0,6)).map(card).join('')"
          new="const featured=(rida||[]).filter(p=>p.brand==='RIDA'&&p.featured);const others=(rida||[]).filter(p=>p.brand==='RIDA'&&!p.featured);const rp=(featured.length?[...featured,...others].slice(0,8):(rida||[]).filter(p=>p.brand==='RIDA').slice(0,8));document.getElementById('rida-featured').innerHTML=rp.map(card).join('')"
          if old not in s:
              raise SystemExit('Trecho RIDA esperado não encontrado')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Validar
        run: python3 -m py_compile server.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/site_data.json nav.js index.html
          git commit -m 'MarquesMater V26 - corrigir tópicos 1 e 2' || true
          git push origin HEAD:main
