<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categorias | MarquesMater</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="v5.css"><link rel="stylesheet" href="v7.css"><link rel="stylesheet" href="v7.1.css"><link rel="stylesheet" href="v7.2.css"><link rel="stylesheet" href="v7.2.1.css"><link rel="stylesheet" href="v7.2.2.css"><link rel="stylesheet" href="v8.2.css"><link rel="stylesheet" href="v8.3.css"><link rel="stylesheet" href="v8.4.css"><link rel="stylesheet" href="v8.13-favorites.css"><style>.mm-categories-page{padding-bottom:110px}.mm-category-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:28px}.mm-category-card{display:flex;align-items:center;gap:16px;min-height:120px;padding:22px;border:1px solid #ddd;background:#fff;text-decoration:none;color:#111;transition:.18s;border-radius:4px}.mm-category-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08);border-color:#f18700}.mm-category-icon{width:58px;height:58px;display:grid;place-items:center;background:#f5f5f5;border-radius:50%;font-size:30px;flex:none}.mm-category-card h2{font-size:19px;margin:0 0 5px}.mm-category-card span{font-size:13px;color:#777}.mm-category-card strong{display:block;margin-top:8px;font-size:12px;color:#f18700;text-transform:uppercase;letter-spacing:.08em}@media(max-width:900px){.mm-category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.mm-category-grid{grid-template-columns:1fr;gap:12px}.mm-category-card{min-height:88px;padding:16px}.mm-category-icon{width:50px;height:50px;font-size:25px}.mm-category-card h2{font-size:17px}.mm-categories-page{padding-bottom:100px}}</style></head><body><div class="top">ENTREGA EM PORTUGAL CONTINENTAL · LEVANTAMENTO EM LOJA · APOIO AO CLIENTE</div><header><div class="wrap head"><a class="logo" href="index.html">MARQUES<span>MATER</span></a><div class="search"><input id="q" placeholder="Pesquisar produtos, marcas ou referências..."><button onclick="goSearch()">⌕</button></div><div class="actions"><a href="#">♙<small>Conta</small></a><a href="favorites.html">♡<small>Favoritos</small></a><a href="cart.html">🛒<small>Carrinho <b id="cartCount">0</b></small></a></div></div></header><nav><div class="wrap nav" id="nav"></div></nav><main class="wrap section mm-categories-page"><div class="crumb"><a href="index.html">Início</a> / Categorias</div><span class="eyebrow dark">CATÁLOGO · V8.27</span><h1>Todas as categorias</h1><p>Escolhe uma categoria para veres os produtos, subcategorias e opções disponíveis.</p><div class="mm-category-grid" id="categoryGrid"></div></main><footer><div class="copy">© MarquesMater · V8.27</div></footer><script src="js/catalog.js"></script><script src="js/v8.4-data.js"></script><script src="js/store.js"></script><script src="js/chat.js"></script><script>document.getElementById('nav').innerHTML=MM_CATEGORIES.map(c=>`<a href="category.html?cat=${encodeURIComponent(c)}">${c}</a>`).join('');const icons={"Construção":"🧱","Ferramentas":"🔧","Tintas":"🎨","Selantes & Colas":"🧴","Jardim & Agricultura":"🌳","Ferragens":"🔩","Eletricidade":"⚡","Iluminação":"💡","Canalização":"🚰","Casa":"🏠","EPI":"🦺","RIDA":"🔴","Promoções":"🏷️"};const counts=Object.fromEntries(MM_CATEGORIES.map(c=>[c,MARQUES_CATALOG.filter(p=>p.category===c).length]));document.getElementById('categoryGrid').innerHTML=MM_CATEGORIES.map(c=>`<a class="mm-category-card" href="category.html?cat=${encodeURIComponent(c)}"><div class="mm-category-icon">${icons[c]||'▦'}</div><div><h2>${c}</h2><span>${counts[c]||0} produto(s) disponíveis</span><strong>Ver categoria →</strong></div></a>`).join('');function goSearch(){const x=document.getElementById('q').value.trim();if(x)location.href='category.html?q='+encodeURIComponent(x)}document.getElementById('cartCount').textContent=localStorage.getItem('mm_cart_count')||0;setTimeout(()=>window.MMStore&&MMStore.sync(),0);</script></body></html>
