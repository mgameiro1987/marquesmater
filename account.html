ocomplete="current-password"><div class="v85-account-actions"><button type="button" class="btn orange" id="safeLogin">ENTRAR</button><button type="button" class="btn dark" id="safeCreate">CRIAR CONTA DEMO</button></div><div class="v87-demo">Conta de demonstração: <b>demo@marquesmater.pt</b> · palavra-passe <b>1234</b>. Serve apenas para testar a loja.</div></div>';const login=()=>{const email=(document.getElementById('demoEmail').value||'demo@marquesmater.pt').trim()||'demo@marquesmater.pt';localStorage.setItem('mm_demo_account_v87',JSON.stringify({email,demo:true}));location.href='account.html'};document.getElementById('safeLogin').onclick=login;document.getElementById('safeCreate').onclick=login;document.getElementById('demoPass').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();login()}}}window.setTimeout(fallback,100);window.setTimeout(fallback,500);window.setTimeout(fallback,1200)})();</script></body></html>
